  return `
    <h2 style="font-size:1.3rem;margin:0 0 16px">Campaign Setup</h2>
    <div class="fg" style="max-width:640px">
      <label class="fl">Campaign Title</label>
      <input class="fi" value="${esc(c.title)}" placeholder="Give your campaign a title, e.g. YerbaLytes summer push"
        onchange="campSet('title',this.value)">
    </div>
    <h3 style="font-size:1.02rem;margin:24px 0 12px">Audience and Message Type</h3>
    <div class="fl" style="color:var(--ink-3);font-weight:500">Outreach Audience</div>
    <div class="pick" style="margin-bottom:22px">${opt(CAMP_AUDIENCE,'a',c.audience,'audience')}</div>
    <div class="fl" style="color:var(--ink-3);font-weight:500">Message Sequence</div>
    <div class="pick">${opt(CAMP_SEQUENCE,'s',c.sequence,'sequence')}</div>
    <div class="fh" style="margin-top:10px">
      A <b>Target Collab</b> is TikTok's formal invite carrying your product and commission.
      A <b>DM</b> is a normal message. Sending both lands the offer and the human note together.
    </div>
    <h3 style="font-size:1.02rem;margin:26px 0 12px">Messaging Schedule</h3>
    <label style="display:flex;gap:9px;align-items:center;font-size:.84rem;margin-bottom:13px;cursor:pointer">
      <input type="checkbox" ${c.schedule.enabled?'checked':''} onchange="campPickThen('schedule.enabled',this.checked)">
      Set time range</label>
    ${c.schedule.enabled?`<div class="frow" style="max-width:660px">
      <div><label class="fl">From</label><input class="fi" type="time" value="${c.schedule.from}" onchange="campSet('schedule.from',this.value)"></div>
      <div><label class="fl">To</label><input class="fi" type="time" value="${c.schedule.to}" onchange="campSet('schedule.to',this.value)"></div>
      <div><label class="fl">Timezone</label><select class="fi" onchange="campSet('schedule.tz',this.value)">
        ${['Europe/London','Europe/Dublin','America/New_York','America/Los_Angeles','UTC'].map(t=>`<option ${c.schedule.tz===t?'selected':''}>${t}</option>`).join('')}
      </select></div></div>`:''}
    <label style="display:flex;gap:9px;align-items:center;font-size:.84rem;margin-top:14px;cursor:pointer">
      <input type="checkbox" ${c.schedule.limitOn?'checked':''} onchange="campPickThen('schedule.limitOn',this.checked)">
      Daily message limits</label>
    ${c.schedule.limitOn?`<div style="max-width:220px;margin-top:10px">
      <input class="fi" type="number" min="1" value="${c.schedule.perDay}" onchange="campSet('schedule.perDay',Number(this.value)||200)">
      <div class="fh">Messages per day across this campaign.</div></div>`:''}`;
}

/* ---- step 2 ---- */
function campStep2(c){
  const PM=creatorPeriodMap();
  const stat=x=>PM.get(String(x.handle||'').replace(/^@/,'').toLowerCase())||{gmv:0,views:0,videos:0,gpm:0};
  const pool=CREATORS.filter(inBrand).filter(x=>!c.excluded.includes(x.id));
  const q=c.query||{};
  const sel=new Set(c.selected);
  const rangeSel=(k,label,ph,money)=>`<div><label class="fl">${label}</label>
    <select class="fi" onchange="campSet('query.${k}',this.value)">
      ${(money?CAMP_MONEY_RANGES:CAMP_RANGES).map(r=>`<option value="${r}" ${q[k]===r?'selected':''}>${r||ph}</option>`).join('')}
    </select></div>`;
  const list=pool.slice(0,60);
  return `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="font-size:1.3rem;margin:0">Select Affiliates</h2>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="toast('Exclusion list — pick creators to skip')">⊘ Exclude affiliates</button>
    </div>
    <div class="card" style="background:var(--warn-soft);border-color:transparent;margin:14px 0 18px"><div class="card-b" style="padding:11px 15px;font-size:.78rem;color:var(--warn-ink);line-height:1.5">
      Cruva searches TikTok's full creator marketplace here. That endpoint
      (<code>/affiliate_seller/202508/marketplace_creators/search</code>) needs the affiliate scope, so for now this
      searches <b>your own ${pool.length} creators</b> from the video data. The filters and selection are real and will
      point at the marketplace the moment the scope lands.
    </div></div>
    <div class="seg" style="width:max-content;margin-bottom:16px">
      <button class="active">Performance</button>
      <button onclick="toast('Demographics filters arrive with the marketplace endpoint')">Demographics</button>
      <button onclick="toast('Appearance filters arrive with the marketplace endpoint')">Appearance</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px">
      ${rangeSel('categories','Product Categories','Select items…')}
      ${rangeSel('followers','Follower Count','Choose range…')}
      ${rangeSel('gmv30','30d GMV','Choose range…',1)}
      ${rangeSel('units30','30d Units Sold','Choose range…')}
      ${rangeSel('liveGmv30','30d LIVE GMV','Choose range…',1)}
      ${rangeSel('avgViews','Average Views Per Video','Choose range…')}
      ${rangeSel('engagement','Engagement Rate (%)','Choose range…')}
      ${rangeSel('postRate','Post Rate (%)','Choose range…')}
      ${rangeSel('brandCollabs','Brand Collaborations','Choose range…')}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-weight:700;font-size:.92rem">Total</span>
      <span class="badge bg-violet">${pool.length} results</span>
      <span style="margin-left:auto;font-size:.78rem;color:var(--ink-3)">${sel.size} selected</span>
      <button class="btn btn-ghost btn-sm" onclick="campSelectAll(${sel.size<pool.length})">${sel.size<pool.length?'Select all':'Clear'}</button>
    </div>
    <div class="card"><div class="card-b flush tbl-wrap" style="max-height:440px;overflow:auto">
      <table class="tbl"><thead><tr>
        <th style="width:34px"></th><th>Creator</th><th class="num">Followers</th>
        <th class="num">GMV</th><th class="num">Videos</th><th class="num">Avg views</th><th class="num">GPM</th>
      </tr></thead><tbody>
      ${list.map(x=>{const s=stat(x);return `<tr class="clickable" onclick="campToggleSel('${x.id}')">
        <td><input type="checkbox" ${sel.has(x.id)?'checked':''} onclick="event.stopPropagation();campToggleSel('${x.id}')"></td>
        <td><div class="cell-user"><span class="av ${x.av}">${esc(x.name.split(' ').map(w=>w[0]).join(''))}</span>
          <div class="main-cell"><div class="t">${esc(x.name)}</div><div class="s">${esc(x.handle)}</div></div></div></td>
        <td class="num">${x.followers?num(x.followers):'—'}</td>
        <td class="num">${s.gmv?money(s.gmv):'—'}</td>
        <td class="num">${s.videos||'—'}</td>
        <td class="num">${s.videos?num(Math.round(s.views/s.videos)):'—'}</td>
        <td class="num">${s.gpm?moneyDec(s.gpm):'—'}</td>
      </tr>`;}).join('')||`<tr><td colspan="7"><div class="empty">No creators yet — sync videos first</div></td></tr>`}
      </tbody></table>
    </div></div>
    ${pool.length>60?`<div class="fh" style="text-align:center;margin-top:10px">Showing the first 60 of ${pool.length}.</div>`:''}`;
}
function campToggleSel(id){
  const c=campById(state.campEdit); if(!c) return;
  const i=c.selected.indexOf(id);
  if(i<0) c.selected.push(id); else c.selected.splice(i,1);
  tikiPush(); renderOutreach();
}
function campSelectAll(on){
  const c=campById(state.campEdit); if(!c) return;
  c.selected = on ? CREATORS.filter(inBrand).map(x=>x.id) : [];
  tikiPush(); renderOutreach();
}

/* ---- step 3 ---- */
function campStep3(c){
  const iv=c.invite;
  const conflicts=[
    ['all','Resolve all creators','Gracefully moves all conflicting creators into the new invite. Creators who already accepted don’t need to re-accept.'],
    ['unaccepted','Resolve only creators who haven’t accepted','Moves only creators who haven’t accepted their previous invite. Those who accepted keep theirs untouched.'],
    ['none','Don’t resolve conflicts','Creators with a conflicting invite are skipped.']
  ];
  return `
    <h2 style="font-size:1.3rem;margin:0 0 4px">Invite Details</h2>
    <div class="fh" style="margin-bottom:20px;max-width:620px">
      The title and message are visible to the creator inside the TikTok invite. They will not appear in the DM
      unless you add messages in step 4.
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:18px;max-width:780px">
      <div class="card"><div class="card-b">
        <div class="fg"><label class="fl">Invite Title</label>

            >${esc(iv.message)}</textarea>
          <div class="fh"><span id="cmInviteCount">${(iv.message||'').length}</span>/500 characters ·
            no other company names, email addresses or profanity — TikTok rejects those.</div>
        </div>
        <div class="fg" style="max-width:330px">
          <label class="fl">Invite Expiration</label>
          <div class="frow">
            <input class="fi" type="number" min="1" value="${iv.expiryValue}" onchange="campSet('invite.expiryValue',Number(this.value)||6)">
            <select class="fi" onchange="campSet('invite.expiryUnit',this.value)">

            </select>
          </div>
          <div class="fh">Counted from when the invite is created.</div>
        </div>
      </div></div>

      <div class="card"><div class="card-b">
        <div style="font-weight:700;font-size:.95rem;margin-bottom:4px">Add Products</div>
        <div class="fh" style="margin-bottom:12px">Products you want creators to promote. You can add more than one.</div>
        <select class="fi" onchange="campAddProduct(this.value);this.value=''">
          <option value="">Select a product</option>
          ${PRODUCTS.filter(p=>!iv.products.some(x=>x.id===p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>
        ${iv.products.map((p,i)=>`
          <div class="prodrow">
            <div class="pi">${p.emoji||'📦'}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
              <div style="font-size:.68rem;color:var(--ink-3);margin-top:2px">ID: ${esc(p.id)}</div>
              <div style="display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap">
                <label style="display:flex;gap:6px;align-items:center;font-size:.76rem">Commission
                  <input class="fi" style="width:70px;padding:5px 8px" type="number" min="0" max="80" value="${p.commission}"
                    onchange="campProdSet(${i},'commission',Number(this.value)||0)"> %</label>
                <label style="display:flex;gap:6px;align-items:center;font-size:.76rem">
                  <input type="checkbox" ${p.shopAds?'checked':''} onchange="campProdSet(${i},'shopAds',this.checked)">
                  Shop Ads commission
                  <input class="fi" style="width:66px;padding:5px 8px" type="number" min="0" max="80" value="${p.shopAdsPct}"
                    onchange="campProdSet(${i},'shopAdsPct',Number(this.value)||0)"> %</label>
              </div>
            </div>
            <button class="btn btn-ghost btn-xs" onclick="campRemoveProduct(${i})">✕</button>
          </div>`).join('')}
        ${!iv.products.length?`<div class="fh" style="margin-top:10px">No products added yet.</div>`:''}
      </div></div>

      <div class="card"><div class="card-b">
        <div style="font-weight:700;font-size:.95rem;margin-bottom:12px">Free Sample &amp; Content Type</div>
        <label style="display:flex;gap:9px;align-items:center;font-size:.84rem;margin-bottom:9px;cursor:pointer">
          <input type="checkbox" ${iv.freeSamples?'checked':''} onchange="campPickThen('invite.freeSamples',this.checked)"> Offer free samples</label>
        <label style="display:flex;gap:9px;align-items:center;font-size:.84rem;margin-bottom:14px;cursor:pointer">
          <input type="checkbox" ${iv.autoApprove?'checked':''} onchange="campSet('invite.autoApprove',this.checked)"> Automatically approve sample requests</label>
        <div class="fl">Preferred content type</div>

          ${[['none','No preference'],['live','Shoppable LIVE'],['video','Shoppable Video']].map(([k,l])=>
            `<button class="${iv.contentType===k?'active':''}" onclick="campPickThen('invite.contentType','${k}')">${l}</button>`).join('')}
        </div>
        <div class="fg" style="margin-top:18px;max-width:380px">
          <label class="fl">Contact email</label>
          <input class="fi" type="email" value="${esc(iv.contactEmail)}" placeholder="Where creators reach you"
            onchange="campSet('invite.contactEmail',this.value)">
        </div>
      </div></div>

      <div class="card"><div class="card-b">
        <div style="font-weight:700;font-size:.95rem;margin-bottom:4px">Auto Resolve Conflicts</div>
        <div class="fh" style="margin-bottom:13px">
          TikTok won't let a creator hold two invites for the same product. Resolving a conflict bumps the new
          invite to the top of the creator's inbox.
        </div>
        ${conflicts.map(([k,t,s])=>`
          <div class="rcard ${iv.conflict===k?'on':''}" onclick="campPickThen('invite.conflict','${k}')">
            <span class="dot"></span>
            <div><div style="font-weight:650;font-size:.85rem">${t}</div>
              <div style="font-size:.77rem;color:var(--ink-2);margin-top:3px;line-height:1.45">${s}</div></div>
          </div>`).join('')}
      </div></div>
    </div>`;
}
function campAddProduct(id){
  if(!id) return;
  const c=campById(state.campEdit), p=PRODUCTS.find(x=>x.id===id); if(!c||!p) return;
  c.invite.products.push({ id:p.id, name:p.name, emoji:p.emoji, commission:20, shopAds:false, shopAdsPct:10 });
  tikiPush(); renderOutreach();
}
function campProdSet(i,k,v){
  const c=campById(state.campEdit); if(!c||!c.invite.products[i]) return;
  c.invite.products[i][k]=v; tikiPush();
}
function campRemoveProduct(i){
  const c=campById(state.campEdit); if(!c) return;
  c.invite.products.splice(i,1); tikiPush(); renderOutreach();
}
function campInsert(path,token){
  const c=campById(state.campEdit); if(!c) return;
  const parts=path.split('.'); let o=c;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]] = (o[parts[parts.length-1]]||'')+token;
  tikiPush(); renderOutreach();
}

                <button class="btn btn-ghost btn-xs" style="margin-left:auto" onclick="campRemoveMsg(${i})">✕</button>
              </div>
              <textarea class="fi" rows="4" maxlength="2000" placeholder="Message…"

            </div>`).join('')||`<div class="fh">No additional messages.</div>`}
        </div></div>

        <div class="card"><div class="card-b">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px">
            <div style="font-weight:700;font-size:.9rem">Follow-up messages</div>

   ========================================================================== */

/* Who this flow would contact right now, from live data. */
function flowMatches(f){
  const PM = (typeof creatorPeriodMap==='function') ? creatorPeriodMap() : new Map();
  const stat = c => PM.get(String(c.handle||'').replace(/^@/,'').trim().toLowerCase()) || {gmv:0,views:0,videos:0,gpm:0};
  const all = CREATORS.filter(inBrand);
  const contacted = ['Contacted','Interested','Sample Requested','Sample Sent','Content Pending','Active Creator','Content Live','Retainer Creator'];
  const days = Number(f.params&&f.params.days)||0;

  if(f.trigger==='new_affiliate')
    return all.filter(c=>stat(c).videos>0 && !contacted.includes(c.stage));
  if(f.trigger==='sample_received')
    return all.filter(c=>c.stage==='Sample Sent');
  if(f.trigger==='gone_quiet'){
    const cut = new Date(Date.now()-(days||14)*86400000).toISOString().slice(0,10);
    const last = new Map();
    for(const r of (typeof VIDEO_DAILY!=='undefined'?VIDEO_DAILY:[])){
      const u=String(r.username||'').toLowerCase(); if(!u) continue;
      if(!last.has(u)||r.stat_date>last.get(u)) last.set(u,r.stat_date);
    }
    return all.filter(c=>{
      const l=last.get(String(c.handle||'').replace(/^@/,'').toLowerCase());
      return l && l<cut;
    });
  }
  if(f.trigger==='high_gpm')
    return all.filter(c=>stat(c).gpm >= (Number(f.params&&f.params.gpm)||50));
  return [];
}

const TikiMap = (function(){
  const NODE_W = 176;
  const NS = 'http://www.w3.org/2000/svg';
  const M = MAP_GRAPH;
  let view = {x:0, y:0, s:1};
  let sel = null, filter = 'all', linkMode = false, pendingFrom = null;
  let idSeq = 1;
  let els = {};
  const nodeH = n => n.bench ? 92 : 62;
  const node = id => M.nodes.find(n=>n.id===id);
  const link = id => M.links.find(l=>l.id===id);
  const mesc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function save(){ /* cloud autosave diffs MAP_GRAPH every few seconds */ }
  function newId(p){ return p + Date.now().toString(36) + (idSeq++); }

  function nodeOpacity(n){
    if(filter==='all') return 1;
    if(filter==='health') return n.kind==='health' ? 1 : .13;
    return n.ws===filter ? 1 : .13;
  }
  function applyView(){ els.world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`); }

  function borderPoint(n, tx, ty){
    const w = NODE_W/2 + 6, h = nodeH(n)/2 + 6;
    const cx = n.x + NODE_W/2, cy = n.y + nodeH(n)/2;
    let dx = tx - cx, dy = ty - cy;
    if(dx===0 && dy===0) return {x:cx, y:cy};
    const k = 1/Math.max(Math.abs(dx)/w, Math.abs(dy)/h);
    return {x:cx + dx*k, y:cy + dy*k};
  }
  function edgePath(a, b){
    const ca = {x:a.x+NODE_W/2, y:a.y+nodeH(a)/2}, cb = {x:b.x+NODE_W/2, y:b.y+nodeH(b)/2};
    const p1 = borderPoint(a, cb.x, cb.y), p2 = borderPoint(b, ca.x, ca.y);
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    let c1, c2;
    if(Math.abs(dx) > Math.abs(dy)){ c1 = {x:p1.x + dx*0.45, y:p1.y}; c2 = {x:p2.x - dx*0.45, y:p2.y}; }
    else{ c1 = {x:p1.x, y:p1.y + dy*0.45}; c2 = {x:p2.x, y:p2.y - dy*0.45}; }
    const mid = { x:(p1.x + 3*c1.x + 3*c2.x + p2.x)/8, y:(p1.y + 3*c1.y + 3*c2.y + p2.y)/8 };
    return {d:`M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`, mid};
  }

  function render(){
    if(!els.edgeLayer) return;
    els.edgeLayer.innerHTML = '';
    els.nodeLayer.innerHTML = '';
    for(const l of M.links){
      const a = node(l.from), b = node(l.to);
      if(!a || !b) continue;
      const {d, mid} = edgePath(a, b);
      const op = Math.min(nodeOpacity(a), nodeOpacity(b));
      const g = document.createElementNS(NS,'g');
      g.setAttribute('opacity', op);
      const hit = document.createElementNS(NS,'path');
      hit.setAttribute('d', d); hit.setAttribute('class','edgeHit');
      hit.addEventListener('mousedown', e=>{ e.stopPropagation(); select('link', l.id); });
      const p = document.createElementNS(NS,'path');
      p.setAttribute('d', d);
      p.setAttribute('class', 'edge ' + (l.sign==='+'?'pos':'neg') + (sel && sel.type==='link' && sel.id===l.id ? ' sel':''));
      p.setAttribute('marker-end', l.sign==='+' ? 'url(#pcmArrowPos)' : 'url(#pcmArrowNeg)');
      const badge = document.createElementNS(NS,'g');
      badge.setAttribute('class','signBadge ' + (l.sign==='+'?'pos':'neg'));
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx',mid.x); c.setAttribute('cy',mid.y); c.setAttribute('r',8.5);
      const t = document.createElementNS(NS,'text');
      t.setAttribute('x',mid.x); t.setAttribute('y',mid.y+4); t.textContent = l.sign==='+' ? '+' : '−';
      badge.append(c,t);
      g.append(hit,p,badge);
      if(l.label){
        const lt = document.createElementNS(NS,'text');
        lt.setAttribute('class','edgeLabel'); lt.setAttribute('x',mid.x); lt.setAttribute('y',mid.y-13);
        lt.textContent = l.label; g.append(lt);
      }
      els.edgeLayer.append(g);
    }
    for(const n of M.nodes){
      const g = document.createElementNS(NS,'g');
      g.setAttribute('class','node');
      g.setAttribute('transform',`translate(${n.x},${n.y})`);
      g.setAttribute('opacity', nodeOpacity(n));
      const fo = document.createElementNS(NS,'foreignObject');
      fo.setAttribute('width', NODE_W); fo.setAttribute('height', nodeH(n));
      const div = document.createElement('div');
      div.className = 'nodeCard' + (n.kind==='health'?' health':'')
        + (sel && sel.type==='node' && sel.id===n.id ? ' sel':'')
        + (pendingFrom===n.id ? ' pendingFrom':'');
      div.style.setProperty('--acc', (MAP_WS[n.ws]||{color:'#999'}).color);
      div.style.height = nodeH(n)+'px';
      div.innerHTML = `<div class="nName">${mesc(n.name)}</div>
        <div class="nMeta"><span class="tag kind-${n.kind}">${n.kind==='health'?'★ health':mesc(MAP_KINDS[n.kind]||n.kind)}</span><span class="tag src">${mesc(MAP_SRCS[n.src]||n.src)}</span></div>`
        + (n.bench ? `<div class="nBench">${mesc(n.bench)}</div>` : '');
      fo.append(div);
      g.append(fo);
      attachNodeEvents(g, n);
      els.nodeLayer.append(g);
    }
    applyView();
    renderSide();
  }

  function toWorld(e){
    const r = els.wrap.getBoundingClientRect();
    return {x:(e.clientX - r.left - view.x)/view.s, y:(e.clientY - r.top - view.y)/view.s};
  }
  function attachNodeEvents(g, n){
    g.addEventListener('mousedown', e=>{
      e.stopPropagation();
      if(linkMode){
        if(!pendingFrom){ pendingFrom = n.id; render(); }
        else if(pendingFrom !== n.id){
          const exists = M.links.find(l=>l.from===pendingFrom && l.to===n.id);
          if(exists){ select('link', exists.id); }
          else{
            const nl = {id:newId('l'), from:pendingFrom, to:n.id, sign:'+', label:''};
            M.links.push(nl); save(); select('link', nl.id);
          }
          pendingFrom = null; render();
        }
        return;
      }
      select('node', n.id);
      const start = toWorld(e), ox = n.x, oy = n.y;
      let moved = false;
      const mv = ev=>{
        const p = toWorld(ev);
        n.x = ox + (p.x - start.x); n.y = oy + (p.y - start.y);
        moved = true; renderQuietMove();
      };
      const up = ()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); if(moved) save(); };
      window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
    });
  }
  let moveT = null;
  function renderQuietMove(){ if(moveT) return; moveT = requestAnimationFrame(()=>{ moveT=null; render(); }); }

  function select(type, id){ sel = type ? {type, id} : null; render(); }

  function addNode(x, y){
    const n = {id:newId('n'), name:'New metric', ws: filter!=='all' && filter!=='health' ? filter : 'core',
               kind:'driver', src:'manual', note:'', bench:'', x:Math.round(x), y:Math.round(y)};
    M.nodes.push(n); save(); select('node', n.id);
    setTimeout(()=>{ const i = $('pcm_f_name'); if(i){ i.focus(); i.select(); } }, 30);
  }
  function deleteSelection(){
    if(!sel) return;
    if(sel.type==='node'){
      M.links = M.links.filter(l=>l.from!==sel.id && l.to!==sel.id);
      M.nodes = M.nodes.filter(n=>n.id!==sel.id);
    }else{
      M.links = M.links.filter(l=>l.id!==sel.id);
    }
    sel = null; save(); render();
  }
  function setLinkMode(on){
    linkMode = on; pendingFrom = null;
    const b=$('pcmLinkBtn'); if(b){ b.classList.toggle('linking', on); b.textContent = on ? '⤳ Click source, then target… (Esc)' : '⤳ Link mode'; }
    els.wrap.classList.toggle('linkmode', on);
    render();
  }
  function fitView(){
    if(!M.nodes.length) return;
    const xs = M.nodes.map(n=>n.x), ys = M.nodes.map(n=>n.y);
    const x2 = M.nodes.map(n=>n.x+NODE_W), y2 = M.nodes.map(n=>n.y+nodeH(n));
    const bx = Math.min(...xs)-40, by = Math.min(...ys)-40;
    const bw = Math.max(...x2)-bx+40, bh = Math.max(...y2)-by+40;
    const r = els.wrap.getBoundingClientRect();
    if(!r.width) return;
    view.s = Math.min(r.width/bw, r.height/bh, 1.15);
    view.x = (r.width - bw*view.s)/2 - bx*view.s;
    view.y = (r.height - bh*view.s)/2 - by*view.s;
    applyView();
  }

  /* ---- side panel ---- */
  function renderSide(){
    if(sel && sel.type==='node'){ renderNodeEditor(node(sel.id)); return; }
    if(sel && sel.type==='link'){ renderLinkEditor(link(sel.id)); return; }
    renderHelp();
  }
  function renderNodeEditor(n){
    if(!n){ sel=null; renderHelp(); return; }
    els.side.innerHTML = `
      <h2>Edit metric</h2>
      <div class="field"><label>Name</label><input id="pcm_f_name" value="${mesc(n.name)}"></div>
      <div class="row2">
        <div class="field"><label>Workspace</label><select id="pcm_f_ws">${Object.entries(MAP_WS).map(([k,v])=>`<option value="${k}" ${n.ws===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
        <div class="field"><label>Type</label><select id="pcm_f_kind">${Object.entries(MAP_KINDS).map(([k,v])=>`<option value="${k}" ${n.kind===k?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Data source</label><select id="pcm_f_src">${Object.entries(MAP_SRCS).map(([k,v])=>`<option value="${k}" ${n.src===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Benchmark / rule (shown on card)</label><input id="pcm_f_bench" value="${mesc(n.bench||'')}" placeholder="e.g. Good ≥ 3:1"></div>
      <div class="field"><label>Notes</label><textarea id="pcm_f_note">${mesc(n.note||'')}</textarea></div>
      <div class="sideBtns">
        <button class="mbtn" id="pcm_f_linkfrom">⤳ Link from this</button>
        <button class="mbtn danger" id="pcm_f_del">Delete</button>
      </div>
      <h3>Connections</h3>
      <div class="mhelp" id="pcm_f_conns"></div>`;
    const bind = (id, key)=>{ $(id).addEventListener('input', e=>{ n[key]=e.target.value; save();
      if(id==='pcm_f_ws'||id==='pcm_f_kind'||id==='pcm_f_bench') render(); }); };
    bind('pcm_f_name','name'); bind('pcm_f_ws','ws'); bind('pcm_f_kind','kind'); bind('pcm_f_src','src'); bind('pcm_f_bench','bench'); bind('pcm_f_note','note');
    $('pcm_f_name').addEventListener('change', ()=>render());
    $('pcm_f_src').addEventListener('change', ()=>render());
    $('pcm_f_linkfrom').onclick = ()=>{ setLinkMode(true); pendingFrom = n.id; render(); };
    $('pcm_f_del').onclick = deleteSelection;
    const ins = M.links.filter(l=>l.to===n.id).map(l=>`<li>${l.sign==='+'?'🟢':'🔴'} ← <b>${mesc((node(l.from)||{}).name||'?')}</b></li>`);
    const outs = M.links.filter(l=>l.from===n.id).map(l=>`<li>${l.sign==='+'?'🟢':'🔴'} → <b>${mesc((node(l.to)||{}).name||'?')}</b></li>`);
    $('pcm_f_conns').innerHTML =
      (ins.length? `<ul>${ins.join('')}</ul>`:'<p style="margin-bottom:6px">No inputs.</p>') +
      (outs.length? `<ul>${outs.join('')}</ul>`:'<p>No outputs.</p>');
  }
  function renderLinkEditor(l){
    if(!l){ sel=null; renderHelp(); return; }
    const a = node(l.from), b = node(l.to);
    els.side.innerHTML = `
      <h2>Edit link</h2>
      <div class="fromTo"><b>${mesc(a?a.name:'?')}</b><br>↓<br><b>${mesc(b?b.name:'?')}</b></div>
      <div class="field"><label>Effect direction</label>
        <div class="signToggle">
          <button id="pcm_f_pos" class="pos ${l.sign==='+'?'on':''}">+ same direction</button>
          <button id="pcm_f_neg" class="neg ${l.sign==='-'?'on':''}">− inverse</button>
        </div>
      </div>
      <div class="field"><label>Label (optional)</label><input id="pcm_f_label" value="${mesc(l.label||'')}" placeholder="e.g. scales with GMV"></div>
      <div class="sideBtns">
        <button class="mbtn" id="pcm_f_flip">⇄ Reverse arrow</button>
        <button class="mbtn danger" id="pcm_f_del">Delete link</button>
      </div>
      <div class="mhelp" style="margin-top:14px">🟢 <b>+</b> means the source pushes the target the <b>same way</b> (more spend → more cost). 🔴 <b>−</b> means inverse (more churn → fewer subscribers). Colour is direction, not good/bad.</div>`;
    $('pcm_f_pos').onclick = ()=>{ l.sign='+'; save(); render(); };
    $('pcm_f_neg').onclick = ()=>{ l.sign='-'; save(); render(); };
    $('pcm_f_label').addEventListener('input', e=>{ l.label=e.target.value; save(); });
    $('pcm_f_label').addEventListener('change', ()=>render());
    $('pcm_f_flip').onclick = ()=>{ const f=l.from; l.from=l.to; l.to=f; save(); render(); };
    $('pcm_f_del').onclick = deleteSelection;
  }
  function renderHelp(){
    const counts = {};
    for(const n of M.nodes) counts[n.src] = (counts[n.src]||0)+1;
    els.side.innerHTML = `
      <h2>How to read this map</h2>
      <div class="mhelp">
        Every card is a number Tiki should track. Arrows show <b>cause</b>:
        <div style="margin:8px 0">
          <div class="legendRow"><div class="lineSw"></div> <b>+</b>&nbsp;pushes target the same direction</div>
          <div class="legendRow"><div class="lineSw neg"></div> <b>−</b>&nbsp;pushes target the opposite way</div>
        </div>
        Colour = direction of effect, <b>not</b> good/bad — "Meta spend → Total costs" is green because more spend means more cost.
      </div>
      <div class="callout"><b>★ Health checks are the point.</b> Raw counts lie: "59 videos, up 9%" is a failure if retainer spend doubled. Every amber card is a <b>ratio with a rule</b>. These feed the Assistant's insight engine.</div>
      <h3>Workspaces</h3>
      ${Object.entries(MAP_WS).map(([k,v])=>`<div class="legendRow"><div class="swatch" style="background:${v.color}"></div>${v.label}</div>`).join('')}
      <h3>Where the data comes from</h3>
      <div class="srcCounts">${Object.entries(MAP_SRCS).map(([k,v])=>`${v}: <b>${counts[k]||0}</b>`).join(' &nbsp;·&nbsp; ')}</div>
      <div class="mhelp" style="margin-top:6px">This list <i>is</i> the integration spec — it maps 1:1 onto Settings → API Connections.</div>
      <h3>Editing</h3>
      <div class="mhelp"><ul>
        <li><b>Drag</b> cards to move, drag background to pan, scroll to zoom</li>
        <li><b>Double-click</b> empty space (or + Node) to add a metric</li>
        <li><b>⤳ Link mode</b>: click source card, then target card</li>
        <li>Click a card or arrow to edit it here; <span class="mkbd">Del</span> removes it</li>
        <li>Changes sync to the team automatically. <b>Export</b> to share the JSON</li>
      </ul></div>`;
  }

  /* ---- boot / bind (called on every renderMap) ---- */
  let keysBound = false;
  function init(){
    els = { wrap:$('pcmCanvasWrap'), world:$('pcmWorld'), edgeLayer:$('pcmEdgeLayer'), nodeLayer:$('pcmNodeLayer'), side:$('pcmSide') };
    sel = null; linkMode = false; pendingFrom = null;

    els.wrap.addEventListener('mousedown', e=>{
      if(e.target.closest('.node')) return;
      select(null);
      const sx = e.clientX, sy = e.clientY, ox = view.x, oy = view.y;
      const mv = ev=>{ view.x = ox + ev.clientX - sx; view.y = oy + ev.clientY - sy; applyView(); };
      const up = ()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); };
      window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
    });
    els.wrap.addEventListener('wheel', e=>{
      e.preventDefault();
      const r = els.wrap.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      let f;
      if(e.ctrlKey || e.metaKey){ let d = e.deltaMode===1 ? e.deltaY*16 : e.deltaY; d = Math.max(-40, Math.min(40, d)); f = Math.exp(-d*0.012); }
      else if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){ view.x -= e.deltaX; applyView(); return; }
      else { f = e.deltaY < 0 ? 1.10 : 1/1.10; }
      const ns = Math.min(2.2, Math.max(.22, view.s * f));
      view.x = mx - (mx - view.x) * (ns/view.s);
      view.y = my - (my - view.y) * (ns/view.s);
      view.s = ns; applyView();
    }, {passive:false});
    els.wrap.addEventListener('dblclick', e=>{
      if(e.target.closest('.node')) return;
      const p = toWorld(e);
      addNode(p.x - NODE_W/2, p.y - 30);
    });

    $('pcmAddNodeBtn').onclick = ()=>{
      const r = els.wrap.getBoundingClientRect();
      const p = {x:(r.width/2 - view.x)/view.s, y:(r.height/2 - view.y)/view.s};
      addNode(p.x - NODE_W/2, p.y - 30);
    };
    $('pcmLinkBtn').onclick = ()=> setLinkMode(!linkMode);
    $('pcmFitBtn').onclick = fitView;
    $('pcmExportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify(M,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'profit-cause-map.json'; a.click();
      URL.revokeObjectURL(a.href);
    };
    $('pcmImportBtn').onclick = ()=> $('pcmImportFile').click();
    $('pcmImportFile').addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{ try{
          const g = JSON.parse(rd.result);
          if(!g.nodes || !g.links) throw 0;
          M.nodes = g.nodes; M.links = g.links; sel = null; save(); render(); fitView();
          toast('Map imported');
        }catch(err){ toast('Not a valid map file'); } };
      rd.readAsText(f);
      e.target.value = '';
    });
    $('pcmResetBtn').onclick = ()=>{
      if(!confirm('Replace the current map with the built-in example? Your edits will be lost (Export first to keep them).')) return;
      const g = defaultGraph(); M.nodes = g.nodes; M.links = g.links; sel = null; save(); render(); fitView();
    };
    document.querySelectorAll('#pcmFilterChips .mchip').forEach(ch=>{
      ch.addEventListener('click', ()=>{
        document.querySelectorAll('#pcmFilterChips .mchip').forEach(c=>c.classList.remove('on'));
        ch.classList.add('on');
        filter = ch.dataset.ws;
        render();
      });
    });

    if(!keysBound){
      keysBound = true;
      document.addEventListener('keydown', e=>{
        if(state.page!=='map') return;
        if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
        if(e.key==='Escape'){ pendingFrom=null; if($('pcmLinkBtn')) setLinkMode(false); select(null); }
        if((e.key==='Delete' || e.key==='Backspace') && sel){ e.preventDefault(); deleteSelection(); }
      });
    }

    render();
    fitView();
  }
  return { init, render, fitView };
})();

   AI ASSISTANT — third column (prototype: simulated brain, real actions)
   Real build: Claude API + tool access to Supabase (read metrics, write
   tasks/creators), learnings table for taught context.

const AI = { open:false, started:false, unread:0, msgs:[], learnings:[], previews:{}, pv:0 };
function toggleAI(force){
  AI.open = force!==undefined?force:!AI.open;
  document.body.classList.toggle('ai-open', AI.open);
  if(AI.open){
    AI.unread=0; $('aiBadge').style.display='none';
    aiCtxUpdate();
    if(!AI.started){ AI.started=true; aiIntro(); }
    setTimeout(()=>$('aiInput').focus(),300);
  }
}
function aiCtxUpdate(){
  const p=PAGES.find(x=>x.id===state.page);
  const el=$('aiCtx'); if(el) el.textContent=`Watching: ${p?p.label:'Overview'} · ${brandInfo(state.brand).name}`;
}
function aiPush(who, html){ AI.msgs.push({who,html}); aiRender(); }
function aiRender(){
  $('aiBody').innerHTML = AI.msgs.map(m=> m.who==='card' ? m.html :
    `<div class="msg ${m.who}">${m.html}</div>`).join('');
  $('aiLearn').innerHTML = `<span style="width:11px;display:inline-flex">${ICONS.grad}</span> ${AI.learnings.length} learnings stored · <button class="link-btn" style="font-size:.66rem" onclick="aiShowLearnings()">view</button>`;
  $('aiChips').innerHTML = AI.msgs.length<=2 ? [
    'How is GMV tracking?','Which retainer is underperforming?','Create a task','What needs my attention today?'
  ].map(c=>`<button class="ai-chip" onclick="aiAsk('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('') : '';
  const b=$('aiBody'); b.scrollTop=b.scrollHeight;
}
function aiTyping(then, delay=650){
  $('aiBody').insertAdjacentHTML('beforeend','<div class="ai-typing" id="aiTy"><i></i><i></i><i></i></div>');
  const b=$('aiBody'); b.scrollTop=b.scrollHeight;
  setTimeout(()=>{ $('aiTy')?.remove(); then(); }, delay);
}
function aiIntro(){
  aiPush('ai',`Hi ${USERS[ME].short} — I watch the account and read the numbers in pairs, not in isolation.`);
  if(aiHasData()) aiInsightCard();
  else aiPush('ai',"The account is empty right now, so there's nothing to read yet. Add creators, retainers and tasks — or connect the TikTok Shop and Revolut feeds in <b>Settings → API Connections</b> — and I'll start surfacing divergences as the data lands.<br><br>In the meantime I can still do things for you: <i>\"create a task to…\"</i>, <i>\"add creator @handle\"</i>, or teach me context with <i>\"remember…\"</i>.");
}
/* Is there anything in the account worth analysing yet? */
function aiHasData(){ return CREATORS.length||RETAINERS.length||state.tasks.length||PROFIT_BANK.length; }
const aiNoData = what => `Nothing to report on ${what} yet — the account has no data in it. Once creators, retainers and the TikTok Shop / bank feeds are in, I'll read this as a pairing rather than a single number.`;
function aiInsightCard(){
  const worst=[...RETAINERS].filter(r=>r.promised>0).sort((a,b)=>(b.amount/Math.max(b.delivered,1))-(a.amount/Math.max(a.delivered,1)))[0];
  if(!worst){ aiPush('ai',aiNoData('retainer efficiency')); return; }
  const best=[...RETAINERS].filter(r=>r.promised>0&&r.delivered>0).sort((a,b)=>(a.amount/a.delivered)-(b.amount/b.delivered))[0];
  const cpv=Math.round(worst.amount/Math.max(worst.delivered,1)), bestCpv=best?Math.round(best.amount/best.delivered):cpv;
  const totalRet=RETAINERS.reduce((n,r)=>n+r.amount,0);
  AI.msgs.push({who:'card', html:`
    <div class="ai-card">
      <div class="ac-tag">✦ Insight · paired metrics</div>
      <div class="ac-t">Retainer spend and output are diverging</div>
      <div class="ac-b">Total retainer spend is <b>${money(totalRet)}/mo</b>. Read against delivery, one pairing stands out: <b>${esc(worst.person)}</b> delivered ${worst.delivered} of ${worst.promised} promised videos — cost per video <b>${money(cpv)}</b>${best&&best!==worst?` vs ${esc(best.person)}'s ${money(bestCpv)}`:''}.</div>
      <div class="ac-kv">
        <div><div class="k">Cost / video</div><div class="v">${money(cpv)}${bestCpv&&cpv>bestCpv?` <span style="font-size:.68rem;color:var(--crit-ink)">▲ ${(cpv/bestCpv).toFixed(1)}× best</span>`:''}</div></div>
        <div><div class="k">Delivered</div><div class="v">${worst.delivered} / ${worst.promised}</div></div>
        <div><div class="k">GMV / £</div><div class="v">${(worst.gmv/Math.max(worst.amount,1)).toFixed(1)}×</div></div>
      </div>
      <div class="ac-b" style="font-weight:600;color:var(--ink)">Is this what you intended with their retainer?</div>
      <div class="msg-btns">
        <button class="msg-btn" onclick="aiInsightAnswer(true,'${esc(worst.person)}')">Yes — intentional</button>
        <button class="msg-btn ghost" onclick="aiInsightAnswer(false,'${esc(worst.person)}')">No — flag it</button>
      </div>
    </div>`});
  aiRender();
}
function aiInsightAnswer(good, who){
  aiPush('me', good?'Yes — intentional':'No — flag it');
  const soon=isoOf(new Date(TODAY.getTime()+2*864e5));
  aiTyping(()=>{
    if(good){
      AI.learnings.push(`${who} under-delivery accepted as intentional (${TODAY.toLocaleDateString('en-GB',{month:'short',year:'numeric'})})`);
      aiPush('ai',`Saved as a learning — I'll stop flagging ${esc(who)} unless delivery drops below 50%, and I'll re-check the GMV-per-video pairing in two weeks.`);
    } else {
      aiPush('ai',"Then two actions make sense. I've drafted them — tap to create (they'll land in <b>Not Started</b>):");
      aiTaskPreview(`Review ${who}'s retainer before renewal`, ME, 'High', soon);
      aiTaskPreview(`Hold ${who}'s next payment until review call`, teammates()[0]||ME, 'High', soon);
    }
  });
}

function aiCommit(id){
  const p=AI.previews[id]; if(!p) return;
  delete AI.previews[id];

    state.tasks.unshift({ id:'t'+(state.tasks.length+200), name:p.name, desc:'Created by Assistant', brand:state.brand==='all'?'all':state.brand,
      assignee:p.who, priority:p.prio, due:p.due, status:'Not Started', creator:'', product:'', campaign:'', notes:'', link:'', comments:[] });

    aiPush('ai',`Done — <b>“${esc(p.name)}”</b> is in ${USERS[p.who].short}'s Not Started column. <button class="link-btn" onclick="navTo('tasks',{taskView:'kanban'})">Open board →</button>`);

    CREATORS.unshift({ id:'c'+(CREATORS.length+200), name:p.name, handle:p.handle, av:'av-c'+(1+CREATORS.length%6), email:'—', phone:'—',
      brand:state.brand==='all'?'lytes':state.brand, followers:0, avgViews:0, videos:0, samples:0, commission:0, retainer:0,
      gmv:0, units:0, cvr:0, lastContact:TODAY_ISO, stage:'Prospect', quality:0, reliability:0, notes:'Added by Assistant', links:[] });

/* ---- message handling ---- */
function aiAsk(q){ $('aiInput').value=q; aiSend(); }
function aiSend(){
  const inp=$('aiInput'); const q=inp.value.trim(); if(!q) return;
  inp.value=''; $('aiSend').classList.remove('ready');
  aiPush('me', esc(q));
  if(AI.cloud!==false){ aiCloudRespond(q); }
  else aiTyping(()=>aiRespond(q));
}

/* =====================================================================
   ASSISTANT CLOUD BRAIN — real Claude via the 'assistant' Edge Function.
   The function holds the Anthropic key; the browser only ever sees the
   Supabase session. Falls back to the local pattern matcher when the
   function isn't deployed or has no key yet.
   ===================================================================== */
function aiSnapshot(){
  /* Compact, current view of the account — enough context to reason with,
     small enough to send on every message. */
  const t=state.tasks, k=BRAND_KPIS[defaultBrand()]||{};
  /* The assistant is asked to decompose ratios, so give it the parts as well as
     the ratios — and both the current and previous window, or it has nothing to
     compare against and will just describe today back at us. */
  const cur=rangeMetrics(state.dateRange), prevW=cur.window;
  const prev=prevW.days?metricsIn(prevW.prevFrom,prevW.prevTo):null;
  const sc=stockCover(), be=dailyBreakEven();
  const part=m=>m?{ gmv:+m.gmv.toFixed(2), grossProfit:+m.net.toFixed(2), fees:+m.fees.toFixed(2),
    cogs:+m.cogs.toFixed(2), adSpend:+m.ads.toFixed(2), orders:m.orders,
    marginPct:m.gmv>0?+(m.net/m.gmv*100).toFixed(1):null,
    feeDragPct:m.gmv>0?+(m.fees/m.gmv*100).toFixed(1):null }:null;
  return {
    today: TODAY_ISO, brand: brandInfo(defaultBrand()).name,
    me: { id:ME, name:USERS[ME]?.name, role:USERS[ME]?.role },
    team: Object.values(USERS).map(u=>({id:u.id,name:u.name,role:u.role,pending:!!u.pending})),
    dateRange: state.dateRange,
    current: part(cur), previousEquivalentWindow: part(prev),
    breakEven: { dailyGrossProfitNeeded:+be.toFixed(2), monthlyOverheads:+monthlyOverheads().toFixed(2),
      actualDailyGrossProfit: prevW.days?+(cur.net/prevW.days).toFixed(2):null },
    stock: { unitsOnHand:sc.onHand, source:sc.source, tiktokUnits:sc.tiktok, shopifyUnits:sc.shopify,
      unitsPerDay:+sc.perDay.toFixed(2), daysOfCover:sc.days, unitsBought:sc.bought, unitsSold:sc.sold,
      avgSellingPrice:sc.asp!=null?+sc.asp.toFixed(2):null, aspBasis:sc.aspBasis,
      retailValue:sc.retail!=null?+sc.retail.toFixed(2):null,
      costValue:sc.cost!=null?+sc.cost.toFixed(2):null,
      driftVsBatches:sc.drift },
    costCoverage: { ordersInRange:cur.orders, ordersWithACostBatch:cur.costed,
      note: cur.orders>cur.costed?'orders without a cost batch count COGS as zero, so gross profit reads HIGH':null },
    kpis: { gmv:k.gmv||0, net:k.net||0, videos:k.videos||0, activeCreators:k.creators||0 },
    tasks: t.slice(0,40).map(x=>({id:x.id,name:x.name,assignee:x.assignee,priority:x.priority,due:x.due,status:x.status,overdue:isOverdue(x)})),
    creators: CREATORS.slice(0,40).map(c=>({id:c.id,name:c.name,handle:c.handle,stage:c.stage,followers:c.followers,gmv:c.gmv,videos:c.videos,retainer:c.retainer,notes:(c.notes||'').slice(0,140)})),
    retainers: RETAINERS.map(r=>({person:r.person,role:r.role,amount:r.amount,promised:r.promised,delivered:r.delivered,gmv:r.gmv,payStatus:r.payStatus,renewal:r.renewal})),
    profit: hasProfitData()? { contribution:PNL.contribution, period:PNL.period, operating:pnlActive().op } : null,
    pendingSamples: SAMPLE_REQS.filter(x=>x.status==='pending').length,
    unreadMessages: CHATS.reduce((n,c)=>n+c.unread,0),
    memory: AI.learnings
  };
}
function aiHistory(){
  /* last few turns, tags stripped, cards skipped */
  return AI.msgs.slice(-12).filter(m=>m.who==='me'||m.who==='ai').map(m=>({
    role: m.who==='me'?'user':'assistant',
    content: m.html.replace(/<[^>]+>/g,'').slice(0,1200) }));
}
async function aiCloudRespond(q, toolResults, prior){
  if(!toolResults){ $('aiBody').insertAdjacentHTML('beforeend','<div class="ai-typing" id="aiTy"><i></i><i></i><i></i></div>'); $('aiBody').scrollTop=$('aiBody').scrollHeight; }
  try{
    const body={ snapshot:aiSnapshot(), history:aiHistory().slice(0,-1), question:q };
    if(toolResults){ body.continue={ prior, toolResults }; }
    const r=await tikiFetch('/functions/v1/assistant',{ method:'POST', body:JSON.stringify(body) });
    if(r.status===404 || r.status===501){ AI.cloud=false; $('aiTy')?.remove(); aiRespond(q); if(r.status===501) aiPush('ai','<i>(Cloud brain is deployed but has no API key yet — running in basic mode. Add the ANTHROPIC_API_KEY secret in Supabase to switch me on.)</i>'); return; }
    if(!r.ok) throw new Error('assistant call failed');
    const j=await r.json();
    $('aiTy')?.remove();
    let pendingTools=[];
    (j.content||[]).forEach(blk=>{
      if(blk.type==='text' && blk.text.trim()) aiPush('ai', aiMd(blk.text));
      if(blk.type==='tool_use') pendingTools.push(blk);
    });
    if(pendingTools.length && j.stop_reason==='tool_use'){
      const results=pendingTools.map(t=>({ tool_use_id:t.id, content:aiRunTool(t.name,t.input) }));
      await aiCloudRespond(q, results, j);
      return;
    }
  }catch(e){
    $('aiTy')?.remove();
    AI.cloud=false;
    aiRespond(q);
  }
}
/* minimal markdown → safe html for assistant replies */
function aiMd(t){
  return esc(t)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/^### (.*)$/gm,'<b>$1</b>')
    .replace(/^[-•] (.*)$/gm,'· $1')
    .replace(/\n/g,'\n');
}
function aiRunTool(name, inp){
  try{
    if(name==='create_task'){
      const id='t'+Date.now();
      state.tasks.unshift({ id, name:(inp.title||'Untitled task').slice(0,120), desc:(inp.description||'').slice(0,400),
        brand:defaultBrand(), assignee:USERS[inp.assignee]?inp.assignee:ME,
        priority:['Low','Medium','High','Urgent'].includes(inp.priority)?inp.priority:'Medium',
        due:/^\d{4}-\d{2}-\d{2}$/.test(inp.due||'')?inp.due:isoOf(new Date(TODAY.getTime()+3*864e5)),
        status:'Not Started', creator:'', product:'', campaign:'', notes:'Created by Assistant', link:'', comments:[] });
      renderSidebar(); if(state.page==='tasks') renderTasks();
      tikiPush();
      return JSON.stringify({ ok:true, id, summary:'task created' });
    }
    if(name==='add_creator'){
      const id='c'+Date.now();
      CREATORS.unshift({ id, name:inp.name||'Unknown', handle:inp.handle||'@unknown', av:'av-c'+(1+CREATORS.length%6),
        email:inp.email||'—', phone:'—', brand:defaultBrand(), followers:+inp.followers||0, avgViews:0, videos:0, samples:0,
        commission:+inp.commission||0, retainer:0, gmv:0, units:0, cvr:0, lastContact:TODAY_ISO,
        stage:CREATOR_STAGES.includes(inp.stage)?inp.stage:'Prospect', quality:0, reliability:0,
        notes:(inp.notes||'Added by Assistant').slice(0,300), links:[] });
      if(state.page==='creators') renderCreators();
      tikiPush();
      return JSON.stringify({ ok:true, id });
    }
    if(name==='save_memory'){
      const m=(inp.memory||'').slice(0,300);
      if(m && !AI.learnings.includes(m)){ AI.learnings.push(m); tikiPush(); }
      return JSON.stringify({ ok:true, memories:AI.learnings.length });
    }
    if(name==='complete_task'){
      const t=state.tasks.find(x=>x.id===inp.id || x.name.toLowerCase()===String(inp.id||'').toLowerCase());
      if(!t) return JSON.stringify({ ok:false, error:'task not found' });
      t.status='Completed'; renderSidebar(); if(state.page==='tasks') renderTasks(); tikiPush();
      return JSON.stringify({ ok:true });
    }
    return JSON.stringify({ ok:false, error:'unknown tool' });
  }catch(e){ return JSON.stringify({ ok:false, error:String(e.message||e) }); }
}

function aiRespond(raw){
  const q=raw.toLowerCase();
  const a=pnlActive?pnlActive():null;
  /* teach */
  if(q.startsWith('remember')||q.startsWith('learn')){
    AI.learnings.push(raw.replace(/^(remember|learn)( that)?\s*/i,''));
    aiPush('ai','Learned. I\'ll factor that into future analysis and stop raising anything it explains.'); aiRender(); return;
  }
  /* create task */
  if(/(create|add|make|new).{0,20}task|task for (rod|me|lewis)/.test(q)){
    let who=ME;
    for(const u of teammates()){ const n=USERS[u].short.toLowerCase(); if(new RegExp(`for ${n}|${n} to|${n}'s`).test(q)) who=u; }
    const names=Object.values(USERS).map(u=>u.short.toLowerCase()).concat('me').join('|');
    let title=raw.replace(new RegExp(`^(can you |please |hey |)?(create|add|make|new)( a| another)? task( for (${names}))?( to| called| titled|:)?\\s*`,'i'),'').trim();
    if(!title||title.length<3) title=(who!==ME?'Follow up with creators':'Review this week\'s numbers');
    title=title[0].toUpperCase()+title.slice(1);
    aiPush('ai',`Here's the draft — confirm and it goes straight into <b>Not Started</b>:`);
    aiTaskPreview(title, who, /urgent/.test(q)?'Urgent':'Medium', isoOf(new Date(TODAY.getTime()+4*864e5)));
    return;
  }
  /* add creator */
  if(/(add|create|new).{0,15}creator/.test(q)){
    const h=raw.match(/@[\w.\-]+/); const handle=h?h[0]:'@newcreator';
    let name=raw.match(/creator (called |named )?([a-z]+ [a-z]+)/i);
    name=name?name[2].replace(/\b\w/g,c=>c.toUpperCase()):handle.slice(1).replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    aiPush('ai','Draft ready:');
    aiCreatorPreview(name, handle);
    return;
  }
  /* analysis intents */
  if(/gmv|revenue|sales/.test(q)){
    const k=BRAND_KPIS[state.brand]||BRAND_KPIS[defaultBrand()];
    if(!k||!k.gmv){ aiPush('ai',aiNoData('GMV')+'<br><br>Connect <b>TikTok Shop — Finance & Settlement</b> in Settings → API Connections and this fills in on the next sync.'); return; }
    const spend=RETAINERS.reduce((n,r)=>n+r.amount,0);
    aiPush('ai',`<b>GMV ${money(k.gmv)} (${k.gmvDelta}) — the pairing that matters:</b>\n\n· Retainer spend ${money(spend)}/mo → ${(k.gmv/Math.max(spend,1)).toFixed(1)}× return on retained people\n· ${k.videos} videos → ${money(Math.round(k.gmv/Math.max(k.videos,1)))} GMV per video\n· ${k.creators} active creators\n\nRead the delta against spend, not on its own: growth that costs proportionally more isn't growth.`);
    return;
  }
  if(/retainer|underperform|spend/.test(q)){
    if(!RETAINERS.length){ aiPush('ai',aiNoData('retainers')+'<br><br>Add them on the <b>Retainers</b> page and I\'ll rank them by GMV per £ as soon as there are two to compare.'); return; }
    const ranked=[...RETAINERS].sort((a,b)=>(b.gmv/Math.max(b.amount,1))-(a.gmv/Math.max(a.amount,1)));
    const rows=ranked.map(r=>`· ${esc(r.person)} — ${money(r.amount)} → ${money(r.gmv)} GMV · ${money(Math.round(r.amount/Math.max(r.delivered,1)))}/video · ${r.delivered}/${r.promised} delivered`).join('\n');
    const worst=ranked[ranked.length-1];
    aiPush('ai',`<b>Retainer efficiency, ranked by GMV per £:</b>\n\n${rows}\n\n${ranked.length>1?`<b>${esc(worst.person)}</b> is the outlier on both pairings — cost-out and revenue-in. Want me to draft a review task?`:'Only one retainer on the books — nothing to rank against yet.'}`);
    if(ranked.length>1) aiTaskPreview(`Review ${worst.person}'s retainer before renewal`, ME, 'High', isoOf(new Date(TODAY.getTime()+2*864e5)));
    return;
  }
  if(/video/.test(q)){
    const k=BRAND_KPIS[state.brand]||BRAND_KPIS[defaultBrand()];
    if(!k||!k.videos){ aiPush('ai',aiNoData('video output')); return; }
    const spend=RETAINERS.reduce((n,r)=>n+r.amount,0);
    const quiet=CREATORS.filter(c=>c.stage==='Paused').length;
    aiPush('ai',`<b>${k.videos} videos (${k.vidDelta}) against ${money(spend)}/mo retainer spend.</b>\n\nCost per retained video: ${money(Math.round(spend/Math.max(k.videos,1)))}. The question is always whether extra spend bought proportional output — if videos rise while spend holds, that's an efficiency gain rather than bought growth.${quiet?`\n\nFlag: ${quiet} creator${quiet===1?' has':'s have'} gone quiet — the pipeline needs replacements to hold this rate.`:''}`);
    return;
  }
  if(/attention|today|priorit|what.*(need|should)/.test(q)){
    const wl=state.tasks.filter(t=>t.status==='Waiting on Lewis').length;
    const od=state.tasks.filter(isOverdue).length;
    const due=RETAINERS.filter(r=>['Due Soon','Overdue'].includes(r.payStatus)).length;
    const samples=SAMPLE_REQS.filter(x=>x.status==='pending').length;
    const items=[];
    if(wl) items.push(`<b>${wl} approval${wl===1?'':'s'}</b> waiting on you <button class="link-btn" onclick="goNeedsLewis()">open queue →</button>`);
    if(od) items.push(`${od} overdue task${od===1?'':'s'}`);
    if(due) items.push(`${due} retainer payment${due===1?'':'s'} due or overdue`);
    if(samples) items.push(`${samples} sample request${samples===1?'':'s'} awaiting a decision`);
    aiPush('ai', items.length
      ? `<b>Today, in order:</b>\n\n${items.map((t,i)=>`${i+1}. ${t}`).join('\n')}\n\nEverything else can wait.`
      : `<b>Nothing needs you right now.</b>\n\nNo approvals queued, nothing overdue, no payments due. Once the TikTok Shop and Revolut feeds are connected I'll start flagging divergences here without being asked.`);
    return;
  }
  if(/profit|p&l|loss/.test(q)){
    if(!PROFIT_BANK.length && !PNL.gross){ aiPush('ai',aiNoData('profit')+'<br><br>Connect <b>Revolut Business — Transactions</b> and <b>TikTok Shop — Finance & Settlement</b> in Settings → API Connections, and the P&L builds itself from the feed.'); return; }
    const a=pnlActive();
    aiPush('ai',`<b>Operating result ${m2(a.op)} — read it in layers:</b>\n\n· Contribution ${m2(PNL.contribution)} — that's the trading engine, after fees, COGS and ads\n· One-offs ${m2(a.one)} — launch costs, not run-rate\n· Monthlies ${m2(a.mon)} vs contribution ${m2(PNL.contribution)} → ${m2(Math.abs(a.mon-PNL.contribution))}/mo ${a.mon>PNL.contribution?'from':'clear of'} run-rate breakeven\n\nOne-offs distort the headline. The pairing that matters is monthlies against contribution.`);
    return;
  }
  if(/hi|hello|hey|thanks|what can you/.test(q)){
    aiPush('ai',`I can analyse any pairing in the account (ask about GMV, retainers, videos, profit), watch for divergences and raise them, and do things for you — "create a task to…", "add creator @handle". Teach me context with "remember…" and I'll stop flagging what you've explained.\n\nIn the full build I run on your live Supabase data via the API — everything here works the same way, just against real numbers.`);
    return;
  }
  aiPush('ai',`I don't have a live model in this prototype, so I only understand a few patterns — try asking about <b>GMV</b>, <b>retainers</b>, <b>videos</b>, <b>profit</b>, or <b>what needs attention</b>, or tell me to <b>create a task</b> / <b>add a creator</b>. In the full build this is a real model with access to everything in the account.`);
}

/* tiny colour helpers so every layer shades off one picked colour */
function shade(hex, pct){
  const n=parseInt(hex.slice(1),16);
  const f=(c)=>Math.max(0,Math.min(255, Math.round(c + (pct<0 ? c : 255-c) * (pct/100))));
  return '#'+[f(n>>16&255),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

  if(style==='neutral') return `<path d="M75 76c6-4 13-4 18-1M125 76c-6-4-13-4-18-1" stroke="${col}" stroke-width="3.4" stroke-linecap="round" fill="none"/>`;
  return `<path d="M73 78c6-7 15-8 21-4l-1 4c-6-3-13-2-20 2zM127 78c-6-7-15-8-21-4l1 4c6-3 13-2 20 2z" fill="${col}"/>`;
}
function beardPath(style, c){
  switch(style){
    case 'stubble':   return `<path d="M62 92c0 27 17 47 38 47s38-20 38-47c0 36-15 53-38 53s-38-17-38-53z" fill="${c}" opacity=".3"/>
                              <path d="M86 108c4-4 9-3 14-1 5-2 10-3 14 1-4 5-9 6-14 4-5 2-10 1-14-4z" fill="${c}" opacity=".45"/>`;
    case 'goatee':    return `<path d="M88 112c4 4 20 4 24 0 2 8 1 18-4 22-5 4-11 4-16 0-5-4-6-14-4-22z" fill="${c}"/>
                              <path d="M86 106c4-4 9-3 14-1 5-2 10-3 14 1-4 5-9 6-14 4-5 2-10 1-14-4z" fill="${c}"/>`;
    case 'beard':     return `<path d="M63 88c1 12 3 22 6 30 4 11 9 18 15 21 5 2 10 3 16 3s11-1 16-3c6-3 11-10 15-21 3-8 5-18 6-30-1 20-4 32-9 39-4 6-9 8-14 8-4 0-8-3-14-3s-10 3-14 3c-5 0-10-2-14-8-5-7-8-19-9-39z" fill="${c}"/>
                              <path d="M86 106c4-4 9-3 14-1 5-2 10-3 14 1-4 5-9 6-14 4-5 2-10 1-14-4z" fill="${c}"/>
                              <path d="M84 124c5 7 27 7 32 0-3 10-11 15-16 15s-13-5-16-15z" fill="${c}" opacity=".55"/>`;
    default:          return '';
  }
}
function glassPath(style){
  if(style==='none') return '';
  if(style==='shades') return `<g><path d="M66 82h30c3 0 4 2 4 5 0 9-5 14-13 14s-15-5-17-13c-1-4-1-6-4-6z" fill="#1b1f26" opacity=".92"/>
    <path d="M134 82h-30c-3 0-4 2-4 5 0 9 5 14 13 14s15-5 17-13c1-4 1-6 4-6z" fill="#1b1f26" opacity=".92"/>
    <path d="M96 87h8" stroke="#1b1f26" stroke-width="4"/><path d="M66 83l-6-3M134 83l6-3" stroke="#1b1f26" stroke-width="3.4" fill="none"/>
    <path d="M72 88c3-3 8-4 12-3" stroke="rgba(255,255,255,.4)" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>`;
  const st='stroke="#2b2f36" stroke-width="3" fill="rgba(255,255,255,.3)"';
  if(style==='round') return `<g><circle cx="85" cy="91" r="12.5" ${st}/><circle cx="115" cy="91" r="12.5" ${st}/>
    <path d="M97.5 90h5" stroke="#2b2f36" stroke-width="3"/><path d="M72 88l-9-3M128 88l9-3" stroke="#2b2f36" stroke-width="3" fill="none"/></g>`;
  return `<g><rect x="71" y="81" width="27" height="20" rx="5" ${st}/><rect x="102" y="81" width="27" height="20" rx="5" ${st}/>
    <path d="M98 90h4" stroke="#2b2f36" stroke-width="3"/><path d="M71 86l-8-2M129 86l8-2" stroke="#2b2f36" stroke-width="3" fill="none"/></g>`;
}
function outfitPath(fit, c, d, l){
  const base = `<path d="M2 200c1-30 14-44 33-51l65 0 65 0c19 7 32 21 33 51z" fill="${c}"/>`;
  switch(fit){
    case 'tee':    return base + `<path d="M84 149c5 11 27 11 32 0l9 3c-7 15-43 15-50 0z" fill="${d}"/>`;
    case 'collar': return base + `<path d="M84 149l16 20 16-20 10 4-26 30-26-30z" fill="#fff" opacity=".95"/>
                                  <path d="M100 169l-4 8 4 6 4-6-4-8z" fill="${d}"/>`;
    case 'suit':   return base + `<path d="M84 149l16 22 16-22 8 4-24 33-24-33z" fill="#fff" opacity=".95"/>
                                  <path d="M100 171l-7 10 7 19 7-19-7-10z" fill="${d}"/>
                                  <path d="M60 154c-9 5-15 12-18 22l14 24 10-40zM140 154c9 5 15 12 18 22l-14 24-10-40z" fill="${d}" opacity=".55"/>`;
    default:       return base + `<path d="M68 152c-6 3-9 8-9 15 0 3 3 5 6 4l8-3zM132 152c6 3 9 8 9 15 0 3-3 5-6 4l-8-3z" fill="${d}"/>
                                  <path d="M78 150c5 13 39 13 44 0l7 3c-4 12-13 18-29 18s-25-6-29-18z" fill="${d}"/>
                                  <path d="M92 176c0 8 16 8 16 0" stroke="${l}" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".6"/>`;
  }
}
function accPath(acc, hairCol){
  switch(acc){
    case 'stud':  return `<circle cx="61" cy="99" r="3.4" fill="#e8c86a"/><circle cx="60" cy="98" r="1.2" fill="#fff8dc"/>`;
    case 'chain': return `<path d="M76 146c6 14 16 21 24 21s18-7 24-21" stroke="#e8c86a" stroke-width="4" fill="none" stroke-linecap="round"/>
                          <path d="M76 146c6 14 16 21 24 21s18-7 24-21" stroke="rgba(255,255,255,.5)" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
    case 'cap':   return `<path d="M60 78c0-24 18-40 40-40s40 16 40 40c0 4-3 6-7 6H67c-4 0-7-2-7-6z" fill="${shade(hairCol,-30)}"/>
                          <path d="M60 78h34c-2 8-10 14-22 15-8 1-12-4-12-9z" fill="${shade(hairCol,-45)}"/>
                          <path d="M60 80c-12 1-22 5-22 9s10 5 22 5z" fill="${shade(hairCol,-45)}"/>
                          <circle cx="100" cy="40" r="4" fill="${shade(hairCol,-45)}"/>
                          <path d="M74 52c8-8 20-11 30-9-11 1-22 4-30 9z" fill="rgba(255,255,255,.18)"/>`;
    default:      return '';
  }
}

let avSeq = 0;
function avatarSvg(a){
  const u = 'g'+(++avSeq);
  const skinD=shade(a.skin,-16), skinL=shade(a.skin,14), skinS=shade(a.skin,-30);
  const hairD=shade(a.hairCol,-26), hairL=shade(a.hairCol,30);
  const shirtD=shade(a.shirt,-20), shirtL=shade(a.shirt,25);
  const bgD=shade(a.bg,-16), bgL=shade(a.bg,14);
  const capHair = a.acc==='cap';
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${bgL}"/><stop offset="1" stop-color="${bgD}"/></linearGradient>
      <linearGradient id="sk${u}" x1=".3" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="${skinL}"/><stop offset=".55" stop-color="${a.skin}"/><stop offset="1" stop-color="${skinD}"/></linearGradient>
      <linearGradient id="sh${u}" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="${shirtL}"/><stop offset="1" stop-color="${shirtD}"/></linearGradient>
      <radialGradient id="gl${u}" cx=".5" cy=".38" r=".62">
        <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>

    <rect width="200" height="200" fill="url(#bg${u})"/>
    <circle cx="100" cy="76" r="72" fill="url(#gl${u})"/>

    <!-- neck sits behind the clothing; the outfit supplies the shoulders -->
    <path d="M81 104h38v56c0 9-38 9-38 0z" fill="${skinD}"/>
    <path d="M84 104h32v54c0 8-32 8-32 0z" fill="url(#sk${u})"/>
    <path d="M84 132c5 6 27 6 32 0v10c0 8-32 8-32 0z" fill="${skinS}" opacity=".22"/>
    <ellipse cx="100" cy="116" rx="23" ry="10" fill="${skinS}" opacity=".32"/>
    <path d="M91 128c4 5 14 5 18 0" stroke="${skinS}" stroke-width="2" fill="none" opacity=".38"/>

    ${outfitPath(a.outfit, `url(#sh${u})`, shirtD, shirtL)}

    <ellipse cx="61" cy="98" rx="6.5" ry="9.5" fill="${skinD}"/>
    <ellipse cx="139" cy="98" rx="6.5" ry="9.5" fill="${skinD}"/>
    <path d="M60 95c3-1 4 2 3 5" stroke="${skinS}" stroke-width="1.6" fill="none" opacity=".5"/>
    <path d="M140 95c-3-1-4 2-3 5" stroke="${skinS}" stroke-width="1.6" fill="none" opacity=".5"/>

    ${hairBack(a.hair, hairD)}

    <path d="${facePath(a.face)}" fill="url(#sk${u})"/>
    <path d="M69 96c-2 12 2 24 9 32-10-6-14-20-9-32z" fill="${skinS}" opacity=".22"/>
    <ellipse cx="79" cy="107" rx="8" ry="5" fill="${skinS}" opacity=".14"/>
    <ellipse cx="121" cy="107" rx="8" ry="5" fill="${skinS}" opacity=".14"/>

    ${beardPath(a.beard, hairD)}
    ${capHair ? '' : hairFront(a.hair, a.hairCol, hairL)}
    ${browPath(a.brow, hairD)}

    <!-- eyes -->
    <g>
      <ellipse cx="85" cy="91" rx="8.5" ry="6" fill="#fff"/>
      <ellipse cx="115" cy="91" rx="8.5" ry="6" fill="#fff"/>
      <circle cx="85.5" cy="91" r="5" fill="${a.eye}"/>
      <circle cx="115.5" cy="91" r="5" fill="${a.eye}"/>
      <circle cx="85.5" cy="91" r="2.4" fill="#16181c"/>
      <circle cx="115.5" cy="91" r="2.4" fill="#16181c"/>
      <circle cx="87.4" cy="89" r="1.7" fill="#fff"/>
      <circle cx="117.4" cy="89" r="1.7" fill="#fff"/>
      <path d="M76.5 89.5c3-4 14-4 17 0M106.5 89.5c3-4 14-4 17 0" stroke="${shade(a.hairCol,-30)}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <path d="M100 96v9c0 2.5-2.5 4-5 3.5" stroke="${skinS}" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".7"/>
    <path d="M88 116c4 5 20 5 24 0-3 7-9 10-12 10s-9-3-12-10z" fill="#a8524e"/>
    <path d="M88 116c4 4 20 4 24 0" stroke="${shade('#a8524e',-25)}" stroke-width="1.6" fill="none"/>

    ${glassPath(a.glasses)}
    ${accPath(a.acc, a.hairCol)}
  </svg>`;
}

const ONB = { open:false, needsPw:false, step:0, password:'',
  name:'', short:'', role:'', picMode:'avatar', photo:null,
  avatar:{ skin:'#e8b98d', face:'oval', hair:'fade', hairCol:'#241a15', brow:'sharp',
           eye:'#5b3a21', beard:'stubble', glasses:'none', acc:'none',
           outfit:'hoodie', shirt:'#111418', bg:'#1f2937' } };

function onbSteps(){ return (ONB.needsPw?['Password']:[]).concat(['Name','Picture','Welcome']); }
function onbInitials(n){ const p=(n||'').trim().split(/\s+/).filter(Boolean);
  return p.length?(p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase():''; }
function onbPreview(){
  if(ONB.picMode==='photo' && ONB.photo) return `<img src="${ONB.photo}" style="width:100%;height:100%;object-fit:cover">`;
  if(ONB.picMode==='avatar') return avatarSvg(ONB.avatar);
  const i=onbInitials(ONB.name); return `<span class="ph">${i||'?'}</span>`;
}
function onbPicDataUri(){
  if(ONB.picMode==='photo' && ONB.photo) return ONB.photo;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(avatarSvg(ONB.avatar).replace(/\n\s*/g,''));
}
function openOnboarding(needsPw){
  const u=USERS[ME]||{};
  ONB.open=true; ONB.needsPw=!!needsPw; ONB.step=0;
  ONB.name=(u.name&&!u.name.includes('@'))?u.name:''; ONB.short=u.short&&!u.short.includes('@')?u.short:'';
  ONB.role=u.role&&u.role!=='Team member'?u.role:(u.role||'');
  $('onbOv').classList.add('open');
  document.querySelector('.app').classList.add('onb-blur');
  renderOnb();
}
function onbPwScore(p){ let n=0; if(p.length>=8)n++; if(/[A-Z]/.test(p)&&/[a-z]/.test(p))n++; if(/[0-9]/.test(p)||/[^\w\s]/.test(p))n++; return n; }
const onbPwValid=()=>ONB.password.length>=8 && onbPwScore(ONB.password)>=2;

function renderOnb(){
  const steps=onbSteps();
  $('onbSteps').innerHTML=steps.map((_,i)=>`<i class="${i<=ONB.step?'done':''}"></i>`).join('');
  $('onbBox').classList.toggle('wide', steps[ONB.step]==='Picture');
  ({Password:onbPassword, Name:onbName, Picture:onbPicture, Welcome:onbWelcome})[steps[ONB.step]]();
}
function onbGo(i){ ONB.step=Math.max(0,Math.min(onbSteps().length-1,i)); renderOnb(); }

function onbPassword(){
  const n=onbSteps().length-1;
  $('onbEyebrow').textContent=`Step 1 of ${n}`;
  $('onbTitle').textContent='Create your password';
  $('onbSub').textContent=`You were invited to the ${brandInfo(defaultBrand()).name} workspace. Set a password and this email becomes your login.`;
  const sc=onbPwScore(ONB.password);
  $('onbBody').innerHTML=`
    <div class="onb-invited"><span class="ic">✉</span>
      <div class="tx"><b>${esc(tikiSession?.email||'')}</b><br>This address is fixed and can't be changed here.</div></div>
    <div class="field"><label>Choose a password</label>
      <input id="onbPw" type="password" placeholder="At least 8 characters" autocomplete="new-password" value="${esc(ONB.password)}">
      <div class="pw-meter"><i class="${sc>=1?'a':''}"></i><i class="${sc>=2?'b':''}"></i><i class="${sc>=3?'c':''}"></i></div>
      <div class="pw-rules">
        ${[[ONB.password.length>=8,'8 characters or more'],
           [/[A-Z]/.test(ONB.password)&&/[a-z]/.test(ONB.password),'Upper and lower case'],
           [/[0-9]/.test(ONB.password)||/[^\w\s]/.test(ONB.password),'A number or symbol']]
          .map(([ok,t])=>`<div class="pw-rule ${ok?'ok':''}"><span class="m">${ok?'✓':''}</span>${t}</div>`).join('')}
      </div></div>`;
  $('onbFoot').innerHTML=`<span class="onb-note">Your password is held by Supabase Auth, never in Tiki itself.</span><span class="sp"></span>
    <button class="btn btn-primary" id="onbNext" ${onbPwValid()?'':'disabled'} onclick="onbSetPassword()">Continue</button>`;
  const el=$('onbPw');
  el.oninput=e=>{ ONB.password=e.target.value; const v=e.target.selectionStart; renderOnb(); const x=$('onbPw'); x.focus(); x.setSelectionRange(v,v); };
  el.onkeydown=e=>{ if(e.key==='Enter'&&onbPwValid()) onbSetPassword(); };
  setTimeout(()=>el.focus(),60);
}
async function onbSetPassword(){
  if(!onbPwValid()) return;
  $('onbNext').textContent='Saving…'; $('onbNext').disabled=true;
  try{
    const r=await tikiFetch('/auth/v1/user',{ method:'PUT', body:JSON.stringify({ password:ONB.password }) });
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.msg||j.error_description||'Could not set password'); }
    ONB.needsPw=false; ONB.password=''; onbGo(0);
  }catch(e){ toast(e.message||'Could not set password'); renderOnb(); }
}

function onbName(){
  const steps=onbSteps(), n=steps.length-1, idx=steps.indexOf('Name');
  $('onbEyebrow').textContent=`Step ${idx+1} of ${n}`;
  $('onbTitle').textContent='What should we call you?';
  $('onbSub').textContent='Your name shows on tasks you own, comments you leave and briefs you share with creators.';
  $('onbBody').innerHTML=`
    <div class="field"><label>Full name</label><input id="onbNm" value="${esc(ONB.name)}" placeholder="e.g. Rod Smith" autocomplete="name"></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>Display name</label><input id="onbSh" value="${esc(ONB.short)}" placeholder="Rod"></div>
      <div class="field"><label>Role</label><input id="onbRl" value="${esc(ONB.role)}" placeholder="e.g. TikTok Shop Lead"></div>
    </div>`;
  $('onbFoot').innerHTML=`${ONB.needsPw?'<button class="btn btn-ghost" onclick="onbGo(0)">← Back</button>':''}<span class="sp"></span>
    <button class="btn btn-primary" id="onbNext" ${ONB.name.trim()?'':'disabled'} onclick="onbGo(${idx+1})">Continue</button>`;
  $('onbNm').oninput=e=>{ ONB.name=e.target.value; ONB.short=ONB.short||ONB.name.trim().split(' ')[0]||'';
    $('onbNext').disabled=!ONB.name.trim(); if($('onbSh').value==='') $('onbSh').value=ONB.name.trim().split(' ')[0]||''; };
  $('onbSh').oninput=e=>ONB.short=e.target.value;
  $('onbRl').oninput=e=>ONB.role=e.target.value;
  setTimeout(()=>$('onbNm').focus(),60);
}

function onbPicture(){
  const steps=onbSteps(), n=steps.length-1, idx=steps.indexOf('Picture');
  $('onbEyebrow').textContent=`Step ${idx+1} of ${n}`;
  $('onbTitle').textContent='Add your picture';
  $('onbSub').textContent='Build a cartoon avatar or upload a photo. This is required — it makes tasks and comments readable at a glance.';
  const a=ONB.avatar;
  const swat=(list,key)=>list.map(c=>`<span class="sw ${a[key]===c?'on':''}" style="background:${c}" onclick="onbAv('${key}','${c}')"></span>`).join('');
  const chip=(list,key)=>list.map(([v,l])=>`<button class="avchip ${a[key]===v?'on':''}" onclick="onbAv('${key}','${v}')">${l}</button>`).join('');
  const g=(label,inner)=>`<div class="opt-group"><div class="gl">${label}</div>${inner}</div>`;
  const ctl = ONB.picMode==='avatar' ? `
    ${g('Face shape',`<div class="avchips">${chip(FACES,'face')}</div>`)}
    ${g('Skin',`<div class="swatches">${swat(SKINS,'skin')}</div>`)}
    ${g('Hair',`<div class="avchips">${chip(HAIRS,'hair')}</div>`)}
    ${g('Hair colour',`<div class="swatches">${swat(HAIRC,'hairCol')}</div>`)}
    ${g('Brows',`<div class="avchips">${chip(BROWS,'brow')}</div>`)}
    ${g('Eye colour',`<div class="swatches">${swat(EYES,'eye')}</div>`)}
    ${g('Facial hair',`<div class="avchips">${chip(BEARDS,'beard')}</div>`)}
    ${g('Glasses',`<div class="avchips">${chip(GLASS,'glasses')}</div>`)}
    ${g('Extras',`<div class="avchips">${chip(ACCS,'acc')}</div>`)}
    ${g('Outfit',`<div class="avchips">${chip(FITS,'outfit')}</div>`)}
    ${g('Outfit colour',`<div class="swatches">${swat(SHIRTS,'shirt')}</div>`)}
    <div class="opt-group" style="margin-bottom:4px"><div class="gl">Background</div><div class="swatches">${swat(BGS,'bg')}</div></div>
    <button class="avchip" style="margin-top:2px" onclick="onbRandom()">🎲 Surprise me</button>`
  : `
    <div class="onb-drop" onclick="document.getElementById('onbFile').click()">
      <div style="font-size:1.5rem;margin-bottom:7px">📷</div>
      <div style="font-size:.83rem;font-weight:600">${ONB.photo?'Choose a different photo':'Choose a photo'}</div>
      <div style="font-size:.72rem;color:var(--ink-3);margin-top:4px">JPG or PNG · resized to 256px before it's saved</div>
    </div>
    <input type="file" id="onbFile" accept="image/*" style="display:none" onchange="onbPhoto(this)">
    <div style="margin-top:14px;font-size:.74rem;color:var(--ink-3);line-height:1.5">
      Made a Bitmoji or Memoji elsewhere? Export it as a PNG and upload it here — it works the same way.</div>`;
  $('onbBody').innerHTML=`
    <div class="pic-tabs">
      <button class="${ONB.picMode==='avatar'?'on':''}" onclick="ONB.picMode='avatar';renderOnb()">Build an avatar</button>
      <button class="${ONB.picMode==='photo'?'on':''}" onclick="ONB.picMode='photo';renderOnb()">Upload a photo</button>
    </div>
    <div class="pic-stage">
      <div class="pic-prev"><div class="avatar-ring">${onbPreview()}</div>
        <div class="cap">${esc(ONB.short||ONB.name.split(' ')[0]||'You')} — how you'll appear</div></div>
      <div class="pic-ctl">${ctl}</div>
    </div>`;
  const ready = ONB.picMode==='avatar' || !!ONB.photo;
  $('onbFoot').innerHTML=`<button class="btn btn-ghost" onclick="onbGo(${idx-1})">← Back</button><span class="sp"></span>
    <button class="btn btn-primary" ${ready?'':'disabled'} onclick="onbFinish()">Finish setup</button>`;
}
function onbAv(k,v){ ONB.avatar[k]=v; renderOnb(); }
function onbRandom(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  ONB.avatar={ skin:pick(SKINS), face:pick(FACES)[0], hair:pick(HAIRS)[0], hairCol:pick(HAIRC),
    brow:pick(BROWS)[0], eye:pick(EYES), beard:pick(BEARDS)[0], glasses:pick(GLASS)[0],
    acc:pick(ACCS)[0], outfit:pick(FITS)[0], shirt:pick(SHIRTS), bg:pick(BGS) };
  renderOnb();
}
function onbPhoto(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image();
    img.onload=()=>{ const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S;
      const ctx=cv.getContext('2d'); const side=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
      ONB.photo=cv.toDataURL('image/jpeg',0.86); renderOnb(); };
    img.src=e.target.result; };
  rd.readAsDataURL(f);
}
function onbFinish(){
  const u=USERS[ME]||{}; const name=ONB.name.trim();
  USERS[ME]={ ...u, id:ME, name, short:(ONB.short||name.split(' ')[0]).trim(),
    initials:onbInitials(name), role:ONB.role.trim()||u.role||'Team member',
    email:u.email||tikiSession?.email, av:u.av||'av-c1',
    pic:onbPicDataUri(), onboarded:true };
  delete USERS[ME].pending;
  ONB.step=onbSteps().length-1; renderOnb();
  tikiPush();
}
function onbWelcome(){
  $('onbEyebrow').textContent=''; $('onbTitle').textContent=''; $('onbSub').textContent='';
  const first=(ONB.short||ONB.name.split(' ')[0]||'there').trim();
  $('onbBody').innerHTML=`

/* ---- Invite links -------------------------------------------------
   Supabase's invite email lands the user here with tokens in the URL
   hash. Capture them as the session, then run the wizard with the
   password step included. */
function tikiParseInviteHash(){
  const h=location.hash;
  if(!h.includes('access_token')) return null;
  const q=new URLSearchParams(h.slice(1));
  const at=q.get('access_token'), rt=q.get('refresh_token'), type=q.get('type');
  history.replaceState(null,'',location.pathname+location.search);
  if(!at) return null;
  let email='';
  try{ email=JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||''; }catch(e){}
  tikiStoreSession({ at, rt, exp:Date.now()+3300*1000, email });
  return { type: type||'invite' };
}

  if(r.status===401 && !retried && await tikiRefreshToken()) return tikiFetch(path, opts, true);
