          </div>
          <div class="seg">
            <button class="active">✏️ Edit</button>
            <button onclick="state.brf.present=true;renderBriefEditor()">▶ Present</button>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openBriefShare('${b.id}')">${ICONS.send} Share</button>
        </div>
      </div>
      <div class="brf-body">
        ${brfLayersPanel(b)}
        <div class="brf-viewport ${s.tool!=='select'?'adding':''}" id="brfViewport" onmousemove="brfTrackCursor(event)">
          <div class="brf-world" id="brfWorld" style="transform:translate(${s.panX}px,${s.panY}px) scale(${s.zoom});width:${brfWorldSize(b).w}px;height:${brfWorldSize(b).h}px">
            ${brfWorldHTML(b)}
          </div>
          <div class="brf-cursors" id="brfCursors" style="transform:translate(${s.panX}px,${s.panY}px) scale(${s.zoom})"></div>
          <div class="brf-dock">
            ${tools.map(([t,ic,tip])=>`<button class="dock-item ${s.tool===t?'active':''}" onclick="brfSetTool('${t}')"><span class="dk-ico">${ICONS[ic]}</span><span class="dk-tip">${tip.split(' (')[0]}</span></button>`).join('')}
          </div>
        </div>
        ${brfSidePanel(b)}
      </div>
    </div>
    <input type="file" id="brfImgInput" accept="image/*" multiple style="display:none" onchange="brfImageChosen(event)">`;
  brfBind(b);
  brfSyncTextBoxes();
  /* Reconnect only when the brief actually changes — a re-render happens on
     every drag frame and tearing the socket down each time would be absurd.
     A public viewer never joins: creators shouldn't see the team's cursors,
     and the team shouldn't see theirs. */
  if(!state.brf.publicView && RT.topic!=='realtime:tiki-brief-'+b.id) rtConnect(b.id);
  rtPaint(); rtRenderPeers();
}
function brfWorldSize(b){
  const xs=b.elements.map(e=>e.x+(e.w||320)), ys=b.elements.map(e=>e.y+(e.h||240));
  return { w:Math.max(2400, ...xs)+500, h:Math.max(1400, ...ys)+500 };
}
/* ===================================================================
   LIVE CURSORS — Supabase Realtime, spoken by hand
   ===================================================================
   Realtime is a Phoenix channel over a WebSocket, and Phoenix's wire format is
   small enough to speak directly: join a topic, heartbeat every 25s, and send
   or receive `broadcast` frames. That avoids pulling in supabase-js purely for
   this, which would break the app's no-dependency, single-file rule.

   Presence is deliberately NOT the Phoenix presence protocol. Cursors are
   ephemeral by nature, so a peer is "here" if we've heard from them in the last
   10 seconds and gone if we haven't. That survives a dropped tab, a closed
   laptop or a lost connection without any leave message arriving. */
const RT = { ws:null, topic:null, ref:0, joined:false, hb:null, sweep:null,
             peers:{}, retry:0, lastSent:0, closing:false };
const RT_COLOURS = ['#2a78d6','#1baf7a','#d1495b','#8b5cf6','#eda100','#0ea5e9','#ec4899'];
const rtColour = id => RT_COLOURS[[...String(id)].reduce((n,c)=>n+c.charCodeAt(0),0)%RT_COLOURS.length];
const rtRef = () => String(++RT.ref);
function rtSend(o){ try{ if(RT.ws&&RT.ws.readyState===1) RT.ws.send(JSON.stringify(o)); }catch(e){} }

function rtConnect(briefId){
  rtDisconnect();
  if(!tikiSession||!tikiSession.at) return;      // cursors are a signed-in feature
  RT.closing=false;
  const topic='realtime:tiki-brief-'+briefId;
  const url=`${TIKI_CFG.url.replace(/^http/,'ws')}/realtime/v1/websocket?apikey=${TIKI_CFG.key}&vsn=1.0.0`;
  let ws;
  try{ ws=new WebSocket(url); }catch(e){ return; }
  RT.ws=ws; RT.topic=topic; RT.joined=false;

  ws.onopen=()=>{
    RT.retry=0;
    rtSend({ topic, event:'phx_join', ref:rtRef(), payload:{
      config:{ broadcast:{ self:false, ack:false }, presence:{ key:ME }, private:false },
      access_token: tikiSession.at } });
    RT.hb=setInterval(()=>rtSend({topic:'phoenix',event:'heartbeat',ref:rtRef(),payload:{}}), 25000);
  };
  ws.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.event==='phx_reply'&&m.topic===topic){
      if(m.payload&&m.payload.status==='ok'){ RT.joined=true; rtRenderPeers(); }
      return;
    }
    if(m.event!=='broadcast'||!m.payload) return;
    const inner=m.payload.payload||{};
    if(!inner.id||inner.id===ME) return;
    if(m.payload.event==='cursor'){
      const isNew=!RT.peers[inner.id];
      RT.peers[inner.id]={ id:inner.id, name:inner.name||whoName(inner.id),
        x:inner.x, y:inner.y, at:Date.now() };
      rtPaint();
      /* Only redraw the "who's here" line when the roster actually changes —
         doing it on every cursor frame would thrash the DOM 20 times a second. */
      if(isNew) rtRenderPeers();
    } else if(m.payload.event==='bye'){
      delete RT.peers[inner.id]; rtPaint(); rtRenderPeers();
    }
  };
  ws.onclose=()=>{
    clearInterval(RT.hb);
    /* Distinguish "nobody else is here" from "we never got connected" — without
       this the feature fails silently and looks identical to working. */
    RT.everJoined = RT.everJoined || RT.joined;
    RT.joined=false;
    RT.peers={}; rtPaint(); rtRenderPeers();
    /* Reconnect with backoff, but only while a brief is actually open. */
    if(!RT.closing && state.briefId){
      const wait=Math.min(15000, 800*Math.pow(2,RT.retry++));
      setTimeout(()=>{ if(!RT.closing&&state.briefId) rtConnect(state.briefId); }, wait);
    }
  };
  ws.onerror=()=>{};   // onclose handles the retry; errors here are noise

  /* Drop peers we haven't heard from — see the note above on why this beats
     relying on a leave message. */
  RT.sweep=setInterval(()=>{
    const now=Date.now(); let changed=false;
    Object.keys(RT.peers).forEach(k=>{ if(now-RT.peers[k].at>10000){ delete RT.peers[k]; changed=true; } });
    if(changed){ rtPaint(); rtRenderPeers(); }
  }, 3000);
}
function rtDisconnect(){
  RT.closing=true;
  clearInterval(RT.hb); clearInterval(RT.sweep);
  if(RT.ws){
    if(RT.ws.readyState===1&&RT.topic)
      rtSend({ topic:RT.topic, event:'broadcast', ref:rtRef(),
        payload:{ type:'broadcast', event:'bye', payload:{ id:ME } } });
    try{ RT.ws.close(); }catch(e){}
  }
  RT.ws=null; RT.topic=null; RT.joined=false; RT.peers={};
}
/* Cursor positions are sent in WORLD coordinates, so everyone sees the pointer
   over the same element regardless of their own pan or zoom. */
function rtSendCursor(wx,wy){
  if(!RT.joined) return;
  const now=Date.now();
  if(now-RT.lastSent<45) return;    // ~22/sec is smooth and stays well inside rate limits
  RT.lastSent=now;
  rtSend({ topic:RT.topic, event:'broadcast', ref:rtRef(), payload:{
    type:'broadcast', event:'cursor',
    payload:{ id:ME, name:(USERS[ME]&&USERS[ME].short)||'Someone', x:Math.round(wx), y:Math.round(wy) } } });
}
function rtPaint(){
  const box=$('brfCursors'); if(!box) return;
  const inv=1/(state.brf.zoom||1);
  box.innerHTML=Object.values(RT.peers).map(p=>{
    const c=rtColour(p.id);
    return `<div class="rt-cur" style="left:${p.x}px;top:${p.y}px;transform:scale(${inv})">
      <svg viewBox="0 0 24 24" fill="${c}"><path d="M5 2l14 8.5-6.2 1.3L10 20z"/></svg>
      <span class="rt-name" style="background:${c}">${esc(p.name)}</span>
    </div>`;
  }).join('');
}
function rtRenderPeers(){
  const el=$('brfPeers'); if(!el) return;
  const list=Object.values(RT.peers);
  el.innerHTML=list.length
    ? `<span class="rt-dot"></span><span style="font-size:.7rem;color:var(--ink-2);font-weight:600">${
        esc(list.map(p=>p.name).join(', '))} here</span>`
    : RT.joined
      ? '<span style="font-size:.7rem;color:var(--ink-3)">Only you</span>'
      : (RT.retry>2
          ? '<span style="font-size:.7rem;color:var(--warn-ink)" title="Couldn\'t reach Supabase Realtime — everything else still works">Live cursors offline</span>'
          : '<span style="font-size:.7rem;color:var(--ink-3)">Connecting…</span>');
}

/* ===================================================================
   UNDO + CLIPBOARD
   ===================================================================
   Snapshots of the whole brief rather than a command log. A brief is small
   enough that copying it is free, and it means every operation — delete, move,
   restyle, paste — is undoable without each one having to describe its own
   inverse, which is where undo implementations usually rot. */
const BRF_UNDO_LIMIT=50;
let BRF_UNDO=[], BRF_REDO=[], BRF_CLIP=null;
function brfSnapshot(){
  const b=briefById(state.briefId); if(!b) return;
  BRF_UNDO.push(JSON.stringify({ elements:b.elements, comments:b.comments }));
  if(BRF_UNDO.length>BRF_UNDO_LIMIT) BRF_UNDO.shift();
  BRF_REDO.length=0;   // a fresh action forks the timeline
}
function brfRestore(json){
  const b=briefById(state.briefId); if(!b) return;
  const snap=JSON.parse(json);
  b.elements=snap.elements; b.comments=snap.comments;
  state.brf.sel=null; state.brf.selFrame=null; state.brf.editing=null;
  tikiPush(); renderBriefEditor();
}
function brfUndo(){
  const b=briefById(state.briefId); if(!b||!BRF_UNDO.length) return toast('Nothing to undo');
  BRF_REDO.push(JSON.stringify({ elements:b.elements, comments:b.comments }));
  brfRestore(BRF_UNDO.pop());
  toast('Undone');
}
function brfRedo(){
  const b=briefById(state.briefId); if(!b||!BRF_REDO.length) return toast('Nothing to redo');
  BRF_UNDO.push(JSON.stringify({ elements:b.elements, comments:b.comments }));
  brfRestore(BRF_REDO.pop());
  toast('Redone');
}
function brfCut(){
  const b=briefById(state.briefId); const id=state.brf.sel;
  const el=b&&b.elements.find(x=>x.id===id); if(!el) return;
  BRF_CLIP=JSON.parse(JSON.stringify(el));
  brfDelete(id);
  toast('Cut — ⌘V to paste it back');
}
function brfCopy(){
  const b=briefById(state.briefId); const el=b&&b.elements.find(x=>x.id===state.brf.sel);
  if(!el) return;
  BRF_CLIP=JSON.parse(JSON.stringify(el));
  toast('Copied');
}
function brfPaste(){
  const b=briefById(state.briefId); if(!b||!BRF_CLIP) return;
  brfSnapshot();
  const copy=JSON.parse(JSON.stringify(BRF_CLIP));
  copy.id=(copy.type[0]||'e')+Date.now()%100000+Math.floor(Math.random()*90+10);
  copy.x=(copy.x||0)+24; copy.y=(copy.y||0)+24;   // offset so it's visibly a new object
  b.elements.push(copy);
  state.brf.sel=copy.id;
  tikiPush(); renderBriefEditor(); toast('Pasted');
}
/* Keyboard. The rule that makes this feel right: while a text box is being
   edited the browser owns every key, so Backspace edits words and ⌘Z is the
   native text undo. Only when nothing is being typed into do these shortcuts
   act on the element itself. */
function brfKeydown(e){
  if(!state.briefId||state.brf.present) return;
  const t=e.target;
  const typing = state.brf.editing
    || (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)));
  const meta=e.metaKey||e.ctrlKey;

  if(meta && e.key.toLowerCase()==='z' && !typing){
    e.preventDefault(); e.shiftKey?brfRedo():brfUndo(); return;
  }
  if(typing) return;

  if(meta && e.key.toLowerCase()==='x'){ e.preventDefault(); brfCut(); return; }
  if(meta && e.key.toLowerCase()==='c'){ e.preventDefault(); brfCopy(); return; }
  if(meta && e.key.toLowerCase()==='v'){ e.preventDefault(); brfPaste(); return; }
  if((e.key==='Backspace'||e.key==='Delete') && state.brf.sel){
    e.preventDefault(); brfDelete(state.brf.sel); return;
  }
  if(e.key==='Escape'){
    brfCloseLayerMenu();
    state.brf.sel=null; state.brf.selFrame=null; renderBriefEditor(); return;
  }
  if(state.brf.sel && (e.key===']'||e.key==='[')){
    e.preventDefault();
    if(meta) brfLayerToEnd(state.brf.sel, e.key===']');
    else brfLayerMove(state.brf.sel, e.key===']'?1:-1);
    return;
  }
}

/* ===================================================================
   TEXT
   ===================================================================
   Text is stored as a tiny, strictly sanitised subset of HTML rather than as a
   plain string. That's what lets one word be bold inside a sentence, while the
   allowlist means nothing can arrive from a paste that we didn't intend to
   render. Anything outside the allowlist is unwrapped, keeping its words.

   The old model stored a plain string and kept the delete button INSIDE the
   editable node, so the ✕ leaked into the content and a re-render could destroy
   an uncommitted edit. Content is now committed on every keystroke, so there is
   no window in which typed text exists only in the DOM. */
const BRF_FONTS = [
  ['sans',   'Default',      "'Inter','Segoe UI',system-ui,-apple-system,sans-serif"],
  ['serif',  'Serif',        "Georgia,'Times New Roman',serif"],
  ['slab',   'Slab',         "'Rockwell','Courier Bold',Georgia,serif"],
  ['mono',   'Mono',         "'SF Mono','Consolas','Courier New',monospace"],
  ['round',  'Rounded',      "'Trebuchet MS','Segoe UI',Verdana,sans-serif"],
  ['impact', 'Display',      "Impact,'Haettenschweiler','Arial Black',sans-serif"],
];
const brfFontStack = key => (BRF_FONTS.find(f=>f[0]===key)||BRF_FONTS[0])[2];
/* Legacy elements carried a named size; map it once so old briefs keep working. */
const LEGACY_SIZE = { h1:26, body:15, small:12 };
const brfFontSize = e => Number(e.fontSize) || LEGACY_SIZE[e.size] || 15;

const TEXT_TAGS = { B:'b', STRONG:'b', I:'i', EM:'i', U:'u', S:'s', STRIKE:'s', DEL:'s' };
function brfSanitize(html){
  let doc;
  try{ doc=new DOMParser().parseFromString('<body><div id="r">'+html+'</div></body>','text/html'); }
  catch(err){ return esc(String(html||'')); }
  const root=doc.getElementById('r');
  if(!root) return esc(String(html||''));
  const out=[];
  const walk=node=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){ out.push(esc(n.nodeValue)); return; }
      if(n.nodeType!==1) return;
      const tag=n.tagName;
      if(tag==='BR'){ out.push('<br>'); return; }
      const keep=TEXT_TAGS[tag];
      if(keep){ out.push('<'+keep+'>'); walk(n); out.push('</'+keep+'>'); return; }
      if(tag==='DIV'||tag==='P'){
        /* Browsers wrap Enter in a div or p; turn that back into a hard break. */
        if(out.length && !/<br>$/.test(out[out.length-1])) out.push('<br>');
        walk(n); return;
      }
      /* Script and style carry code, not words — unwrapping them would paste
         "alert(1)" into the brief as if it were prose. Drop them whole. */
      if(tag==='SCRIPT'||tag==='STYLE'||tag==='NOSCRIPT'||tag==='TEMPLATE'||tag==='IFRAME'||tag==='OBJECT') return;
      walk(n);   // unwrap anything else, keep its words
    });
  };
  walk(root);
  return out.join('').replace(/(<br>\s*)+$/,'');
}
/* One source of truth for what a text box contains, migrating old plain-text
   elements on read so nothing has to be converted up front. */
function brfTextHTML(e){
  if(typeof e.html==='string') return e.html;
  return esc(e.text||'').replace(/\n/g,'<br>');
}
function brfTextStyle(e){
  const dec=[e.underline?'underline':'', e.strike?'line-through':''].filter(Boolean).join(' ')||'none';
  return `font-family:${brfFontStack(e.font)};font-size:${brfFontSize(e)}px;`
    + `font-weight:${e.bold?700:(e.font==='impact'?400:500)};`
    + `font-style:${e.italic?'italic':'normal'};text-decoration:${dec};`
    + `text-align:${e.align||'left'};color:${e.colour||'inherit'};`
    + `text-transform:${e.caps==='upper'?'uppercase':e.caps==='lower'?'lowercase':'none'};`
    + `line-height:${e.lineHeight||1.45};letter-spacing:${e.font==='impact'?'.01em':'-.005em'}`;
}
/* Commit on every keystroke. The old code only saved on blur, so a re-render
   between typing and clicking away threw the edit on the floor — the reported
   "text disappears then comes back" was exactly that. */
function brfTextInput(ev,id){
  const b=briefById(state.briefId); if(!b) return;
  const el=b.elements.find(x=>x.id===id); if(!el) return;
  el.html=brfSanitize(ev.currentTarget.innerHTML);
  delete el.text;                    // the migrated field is no longer the truth
  state.brf.dirtyText=true;
}
function brfEditText(ev,id){
  const node=ev.currentTarget;
  brfSnapshot();                     // so ⌘Z can undo the whole editing session
  state.brf.editing=id;              // blocks world rebuilds while typing
  node.contentEditable='true';
  node.classList.add('editing');
  node.focus();
  /* Canva highlights the existing text on double-click so you can just start
     typing over it. Safe to do now that every keystroke is committed and ⌘Z
     brings the old wording back. */
  setTimeout(()=>{ try{
    const r=document.createRange(); r.selectNodeContents(node);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(err){} },0);
}
function brfSaveText(ev,id){
  const node=ev.currentTarget;
  node.contentEditable='false';
  node.classList.remove('editing');
  const b=briefById(state.briefId); if(!b) return;
  const el=b.elements.find(x=>x.id===id);
  if(el){
    el.html=brfSanitize(node.innerHTML);
    delete el.text;
    /* An empty box is kept, not deleted and not filled with a placeholder —
       deleting on empty makes it impossible to clear a box and retype. */
    if(!el.html.replace(/<[^>]+>/g,'').trim()) el.html='';
  }
  state.brf.editing=null; state.brf.dirtyText=false;
  tikiPush(); renderBriefEditor();
}
/* Toolbar actions. While editing, they apply to the selection; otherwise they
   apply to the whole box — which is what you'd expect from clicking B with
   nothing selected. */
function brfTextFormat(id, what){
  const b=briefById(state.briefId); const el=b&&b.elements.find(x=>x.id===id); if(!el) return;
  const node=$('brfWorld')?.querySelector(`[data-el="${id}"]`);
  const editing=state.brf.editing===id && node && node.isContentEditable;
  const sel=window.getSelection();
  const hasSelection=editing && sel && !sel.isCollapsed;
  if(hasSelection){
    const cmd={bold:'bold',italic:'italic',underline:'underline',strike:'strikeThrough'}[what];
    if(cmd){ document.execCommand(cmd,false,null); el.html=brfSanitize(node.innerHTML); delete el.text; tikiPush(); renderBriefSidePanel(); return; }
  }
  brfSnapshot();
  el[what]=!el[what];
  tikiPush(); renderBriefEditor();
}
function brfTextSet(id, key, val){
  const b=briefById(state.briefId); const el=b&&b.elements.find(x=>x.id===id); if(!el) return;
  brfSnapshot();
  el[key]=val;
  tikiPush(); renderBriefEditor();
}

/* ---- TikTok video embeds --------------------------------------------
   One renderer for both surfaces, so the editor and Present can't drift:
   `live` swaps the poster for the real player, everything else is identical. */
const brfUrl = u => { const t=String(u||'').trim(); return /^https?:\/\//i.test(t)?t:'https://'+t.replace(/^\/+/,''); };
/* Full links carry the numeric id; short vm./vt. links must be resolved
   server-side because following the redirect from the browser is blocked. */
function brfVideoId(url){
  const m=/\/video\/(\d{6,})/.exec(String(url||''))||/^(\d{15,})$/.exec(String(url||'').trim());
  return m?m[1]:null;
}
/* TikTok's embed player lays itself out at a fixed internal size and refuses to
   reflow below it. Setting the iframe's width and height directly therefore
   CROPS the player rather than shrinking it — which is exactly the bug: drag the
   box wide and you'd get the top strip of a video. The fix is to render the
   iframe at its natural size and CSS-scale the whole thing, so every pixel of
   the player survives, just smaller. Portrait ratio is locked for the same
   reason: a landscape box can only ever crop a portrait player. */
const VID_RATIO = 16/9;          // height ÷ width — TikTok is 9:16
const VID_BASE_W = 325;          // the narrowest width the embed renders cleanly at
const VID_BASE_H = Math.round(VID_BASE_W*VID_RATIO);
const vidHeightFor = w => Math.round((w||200)*VID_RATIO);

function brfVideoHTML(e, opts){
  const live=opts&&opts.live;
  const w=e.w||200, h=vidHeightFor(w);   // height is always derived, never trusted
  const id=e.videoId||brfVideoId(e.url);
  if(live&&id){
    const k=w/VID_BASE_W;
    return `<div class="brf-embed-box" style="width:${w}px;height:${h}px">
      <iframe class="brf-embed" src="https://www.tiktok.com/embed/v2/${id}"
        style="width:${VID_BASE_W}px;height:${VID_BASE_H}px;transform:scale(${k.toFixed(4)})"
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen"
        frameborder="0" scrolling="no"></iframe></div>`;
  }
  const poster=e.thumb
    ? `background-image:url('${e.thumb}');background-size:cover;background-position:center`
    : 'background:linear-gradient(160deg,#1c2128,#101418)';
  return `<div class="brf-video" style="width:${w}px;height:${h}px">
      <div class="v-body" style="height:100%;aspect-ratio:auto;${poster}">
        ${e.thumb?'<div class="v-scrim"></div>':''}
        <div class="v-play">${ICONS.play}</div>
        ${e.views&&e.views!=='—'?`<span class="v-views">▶ ${esc(e.views)}</span>`:''}
        <div class="v-meta"><div class="v-handle">${esc(e.handle||'@paste-a-tiktok-link')}</div>
          <div class="v-cap">${esc(e.caption||(id?'ready to play in Present':'double-click to add the link'))}</div></div>
      </div></div>`;
}

/* All eight grips, so a photo can be pulled from any side or corner. Dragging
   a north or west grip moves the origin as well as the size — otherwise the
   opposite edge would walk across the page instead of staying put. */
const BRF_HANDLES=['nw','n','ne','w','e','sw','s','se'];
/* Text height follows the words, so vertical-only grips would be lying about
   what they do — corners and sides only, exactly like Canva. */
const BRF_TEXT_HANDLES=['nw','ne','w','e','sw','se'];
const brfHandlesFor = t => t==='text' ? BRF_TEXT_HANDLES : BRF_HANDLES;

/* Which page does this element belong to? Its centre decides, so dragging a
   photo mostly off a page hands it to whatever page now holds its middle —
   the same feel as Canva. Later frames win when pages overlap. */
function brfHostFrame(b, el){
  const cx=el.x+(el.w||0)/2, cy=el.y+(el.h||0)/2;
  let hit=null;
  b.elements.forEach(f=>{
    if(f.type!=='frame') return;
    if(cx>=f.x&&cx<=f.x+f.w&&cy>=f.y&&cy<=f.y+f.h) hit=f;
  });
  return hit;
}
function brfWorldHTML(b){
  const s=state.brf;
  let h='';

  let overlay='';      // unclipped handles layer
  b.elements.filter(e=>e.type==='frame').forEach(e=>{
    const fs=s.selFrame===e.id?'fsel':'';
    h+=`<div class="brf-frame ${fs}" data-frame="${e.id}" style="left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;background:${e.bg||'#ffffff'};border-color:${e.bg&&e.bg!=='#ffffff'?'transparent':'#dde1e7'}">
      <div class="fr-title" data-fdrag="${e.id}" ondblclick="brfEditFrameTitle('${e.id}')" title="Click to select this page · double-click to rename">${esc(e.title)}</div>
      <div class="fr-rs fr-rs-s" data-rs="${e.id}:s" title="Drag to make this sheet longer"></div>
      <div class="fr-rs fr-rs-se" data-rs="${e.id}:se" title="Drag to resize"></div></div>`;

         page, resizable from any grip, and rendered by the same code Present
         uses — the only way the two views can be guaranteed to match.
         Crucially the delete button and resize grips live on a separate overlay
         rather than inside the box. When they sat inside the text node they
         became part of its content, which is what made text vanish. */
      /* Height is derived, not stored opinion — this also repairs any video
         that was stretched out of shape before the ratio was locked. */

         Loose on the canvas: plain world coordinates, nothing to clip against. */
      const ix=host?e.x-host.x:e.x, iy=host?e.y-host.y:e.y;

          style="left:${ix}px;top:${iy}px;width:${e.w}px;${e.h?`min-height:${e.h}px;`:''}${brfTextStyle(e)}"

        ${brfHandlesFor(e.type).map(g=>`<span class="el-rs el-rs-${g}" data-ers="${e.id}:${g}" title="${
          e.type==='text'?'Drag to set the text width':g.length===2?'Drag to resize · Shift keeps proportions':'Drag to stretch'}"></span>`).join('')}

      </div>`;
    }

         would always float above everything else, and "layers" would be a lie. */
      const host=brfHostFrame(b,e);
      const ix=host?e.x-host.x:e.x, iy=host?e.y-host.y:e.y;
      const body=`<div class="brf-el ${sel}" data-el="${e.id}" style="left:${ix}px;top:${iy}px"><div class="brf-link" ondblclick="brfEditLink('${e.id}')">
        <span class="lk-ico">${ICONS.link}</span><span><div>${esc(e.label)}</div><div class="lk-url">${esc(e.url)}</div></span></div></div>`;
      if(host) clips[host.id]=(clips[host.id]||'')+body; else h+=body;
      if(sel) overlay+=`<div class="brf-ovl sel-box" data-ovl="${e.id}" style="left:${e.x}px;top:${e.y}px;width:1px;height:1px">
        <span class="del-h" style="display:flex;top:-13px;right:-13px" onmousedown="event.stopPropagation()" onclick="brfDelete('${e.id}')">✕</span></div>`;
    }
  });
  if(s.showComments) b.comments.forEach((c,i)=>{
    h+=`<div class="brf-pin ${c.resolved?'resolved':''}" data-pin="${c.id}" style="left:${c.x}px;top:${c.y}px;background:${c.thread[0]&&c.thread[0].who!==ME?'var(--aqua-ink)':'var(--accent)'}" onclick="event.stopPropagation();brfOpenThread('${c.id}')">${i+1}</div>`;
  });
  if(s.openThread){
    const c=b.comments.find(x=>x.id===s.openThread);
    if(c) h+=`<div class="brf-thread" style="left:${c.x+22}px;top:${c.y-8}px" onmousedown="event.stopPropagation()">
      <div class="th-h">Comment ${b.comments.indexOf(c)+1}
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn btn-ghost btn-xs" onclick="brfResolve('${c.id}')">${c.resolved?'Reopen':'✓ Resolve'}</button>
          <button class="btn btn-ghost btn-xs" onclick="state.brf.openThread=null;renderBriefEditor()">✕</button></span></div>
      <div class="th-msgs">
        ${c.thread.map(m=>`<div class="comment">${userAv(m.who,'sm')}<div class="c-body"><div class="c-who">${esc(whoName(m.who))}</div>${esc(m.text)}<div class="c-time">${m.time}</div></div></div>`).join('')||'<div style="font-size:.74rem;color:var(--ink-3);padding:8px 0">New comment — write the first message</div>'}
      </div>
      <div style="display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line-2)">
        <input id="brfReply" placeholder="Reply…" style="flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;outline:none;font-size:.78rem"
          onkeydown="if(event.key==='Enter')brfReply('${c.id}')" onmousedown="event.stopPropagation()">
        <button class="btn btn-primary btn-sm" onclick="brfReply('${c.id}')">${ICONS.send}</button>
      </div></div>`;
  }

     and the handle overlay goes last so it's above everything. */
  let clipHTML='';
  Object.entries(clips).forEach(([fid,inner])=>{
    const f=b.elements.find(x=>x.id===fid); if(!f) return;
    clipHTML+=`<div class="brf-clip" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px">${inner}</div>`;
  });

/* Pan and zoom move the world and the cursor layer together — they have to

function brfApplyTransform(){
  const s=state.brf, t=`translate(${s.panX}px,${s.panY}px) scale(${s.zoom})`;
  const w=$('brfWorld'); if(w) w.style.transform=t;
  const c=$('brfCursors'); if(c) c.style.transform=t;

}
function brfTrackCursor(ev){

}
function brfSetTool(t){ state.brf.tool=t; state.brf.sel=null; state.brf.openThread=null; state.brf.selFrame=null; renderBriefEditor(); }

function brfIsDark(hex){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex||''));
  if(!m) return false;

          if(ov){ ov.classList.add('sel-box'); ov.querySelector('.del-h')?.remove();

      if(s.sel||s.openThread||s.selFrame){ s.sel=null; s.openThread=null; s.selFrame=null; renderBriefEditor(); return; }
      if(s.editing) return;   // let the blur handler commit before anything else runs

  document.addEventListener('mouseup', onUp);

          if(n){ n.style.left=p.k.x+'px'; n.style.top=p.k.y+'px'; }

      } else {
        const w=$('brfWorld'); if(w) w.innerHTML=brfWorldHTML(b);
      }
    }
    else if(mode==='elresize'&&start){
      const dx=(e.clientX-start.mx)/s.zoom, dy=(e.clientY-start.my)/s.zoom;
      if(Math.abs(dx)+Math.abs(dy)>=2) moved=true;
      const el=start.el, edge=start.edge;
      const isVid=el.type==='video', isTxt=el.type==='text';
      const MIN=isVid?90:40;      // below this the embed's own controls stop being usable
      /* Photos are free-form and Shift locks them. Videos are ALWAYS locked to
         portrait: a landscape box can only crop the player, never fit it. */

      const north=edge.includes('n'), south=edge.includes('s');

      if(north){ hgt=Math.max(MIN*VID_RATIO, Math.round(start.h-dy)); ny=start.y+(start.h-hgt); }

      const host=brfHostFrame(b,el);
      const n=wl?.querySelector(`[data-el="${el.id}"]`);
      if(n){ n.style.width=el.w+'px';
        if(!isTxt) n.style.height=el.h+'px';

        ov.style.height=(isTxt&&n?n.getBoundingClientRect().height/(state.brf.zoom||1):el.h)+'px';   // rewrapped height

        let tag=ov.querySelector('.el-size-tag');
        if(!tag){ tag=document.createElement('div'); tag.className='el-size-tag'; ov.appendChild(tag); }
        tag.textContent=`${el.w} × ${el.h}${e.shiftKey?' · locked':''}`;
      }
    }
    else if(mode==='resize'&&start){
      const dx=(e.clientX-start.mx)/s.zoom, dy=(e.clientY-start.my)/s.zoom;
      if(Math.abs(dx)+Math.abs(dy)>=2) moved=true;
      const fr=start.fr;
      fr.h=Math.max(160, Math.round(start.h+dy));
      if(start.edge==='se') fr.w=Math.max(240, Math.round(start.w+dx));
      const fn=$('brfWorld')?.querySelector(`[data-frame="${fr.id}"]`);
      if(fn){ fn.style.width=fr.w+'px'; fn.style.height=fr.h+'px';
        fn.classList.add('resizing');
        let tag=fn.querySelector('.fr-size-tag');
        if(!tag){ tag=document.createElement('div'); tag.className='fr-size-tag'; fn.appendChild(tag); }

    }

/* ---- photos ----------------------------------------------------------

   raw phone photo (4-8 MB, and a third bigger again once base64'd) would bloat
   every single save for every user. Everything is downscaled and re-encoded on
   the way in — 1400px on the long edge is far more than a brief ever needs. */
const BRF_IMG_MAX=1400, BRF_IMG_Q=0.82;
function brfPickImage(x,y){
  state.brf.dropAt={x,y};

}
function brfImageChosen(ev){
  const files=[...(ev.target.files||[])];

  const at=state.brf.dropAt||{x:200,y:200};
  files.reduce((chain,f,i)=>chain.then(()=>brfAddImage(f, at.x+i*24, at.y+i*24)), Promise.resolve())
    .then(()=>{ state.brf.tool='select'; renderBriefEditor(); })

function brfAddImage(file, x, y){

        const w=380, h=Math.max(60,Math.round(380*ch/cw));
        const b=briefById(state.briefId);

        b.elements.push({id,type:'image',x:Math.round(x),y:Math.round(y),w,h,src,alt:file.name.replace(/\.[^.]+$/,''),natural:{w:cw,h:ch}});

/* A text box's height is whatever the words need, which is only knowable once
   the browser has laid them out. So the selection frame is measured from the
   rendered node after every render rather than guessed at render time —
   otherwise the violet frame floats above short text and clips tall text. */
/* ===================================================================
   LAYERS
   ===================================================================
   Position in b.elements IS the z-order — later entries paint on top. The panel
   shows that list reversed, because "top of the list" reading as "top of the
   stack" is what every design tool has trained people to expect.

   Frames are kept at the front of the array and out of the panel. They are the
   pages, not objects on a page, and letting them be reordered against their own
   contents would only ever be a mistake. */
const brfStackables = b => b.elements.filter(e=>e.type!=='frame');
function brfCommitOrder(b, stack){
  b.elements = b.elements.filter(e=>e.type==='frame').concat(stack);
}
function brfLayerLabel(e){
  if(e.type==='text'){
    const txt=brfTextHTML(e).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    return txt ? txt.slice(0,28) : 'Empty text';
  }
  if(e.type==='image') return e.alt ? String(e.alt).slice(0,24) : 'Photo';
  if(e.type==='video') return e.handle && !/paste/i.test(e.handle) ? e.handle : 'TikTok video';
  if(e.type==='link')  return e.label ? String(e.label).slice(0,24) : 'Link';
  return e.type;
}
function brfLayerIcon(e){
  if(e.type==='image'&&e.src) return `<img src="${e.src}" alt="">`;
  if(e.type==='video'&&e.thumb) return `<img src="${e.thumb}" alt="">`;
  return ICONS[{text:'type',image:'image',video:'video',link:'link'}[e.type]||'frame'];
}
/* Page order used to be implied by canvas position, which meant you could only
   change the reading order of a brief by physically dragging pages around the
   canvas. Pages now carry an explicit `ord`, falling back to position for any
   brief that predates it, so the layers panel and Present agree on the order and
   you can rearrange it without moving anything. */
function brfPageOrder(b){
  const frames=b.elements.filter(e=>e.type==='frame');
  const byPos=frames.slice().sort((a,c)=>(a.y-c.y)||(a.x-c.x));
  return frames.slice().sort((a,c)=>{
    const ao=a.ord!==undefined?a.ord:byPos.indexOf(a);
    const co=c.ord!==undefined?c.ord:byPos.indexOf(c);
    return ao-co;
  });
}
function brfSetPageOrder(b, ordered){
  ordered.forEach((f,i)=>{ f.ord=i; });
}
function brfMovePage(id, delta){
  const b=briefById(state.briefId); if(!b) return;
  const order=brfPageOrder(b);
  const i=order.findIndex(f=>f.id===id);
  const j=i+delta;
  if(i<0||j<0||j>=order.length) return toast(delta<0?'Already first':'Already last');
  brfSnapshot();
  const [f]=order.splice(i,1); order.splice(j,0,f);
  brfSetPageOrder(b,order);
  tikiPush(); renderBriefEditor();
}
/* Pages drag against each other only. Dropping a page onto a layer row, or a
   layer onto a page row, would be ambiguous — so the two lists stay separate. */
let BRF_PAGE_DRAG=null;
function brfPageDragStart(ev,id){
  BRF_PAGE_DRAG=id; BRF_LAYER_DRAG=null; ev.stopPropagation();
  ev.dataTransfer.effectAllowed='move';
  try{ ev.dataTransfer.setData('text/plain','page:'+id); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function brfPageDragEnd(ev){
  ev.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.lay-row').forEach(n=>n.classList.remove('drop-above','drop-below'));
  BRF_PAGE_DRAG=null;
}
function brfPageDragOver(ev,id){
  if(!BRF_PAGE_DRAG||BRF_PAGE_DRAG===id) return;
  ev.preventDefault(); ev.stopPropagation(); ev.dataTransfer.dropEffect='move';
  const r=ev.currentTarget.getBoundingClientRect();
  const above=(ev.clientY-r.top)<r.height/2;
  ev.currentTarget.classList.toggle('drop-above',above);
  ev.currentTarget.classList.toggle('drop-below',!above);
}
function brfPageDrop(ev,targetId){
  ev.preventDefault(); ev.stopPropagation();
  const d=brfDragKind(ev);
  document.querySelectorAll('.lay-row').forEach(n=>n.classList.remove('drop-above','drop-below'));
  if(d.kind!=='page') return;              // a layer dropped on a page row is a no-op
  const dragId=d.id;
  if(!dragId||dragId===targetId) return;
  const b=briefById(state.briefId); if(!b) return;
  const r=ev.currentTarget.getBoundingClientRect();
  const above=(ev.clientY-r.top)<r.height/2;
  const order=brfPageOrder(b);
  const from=order.findIndex(f=>f.id===dragId);
  if(from<0) return;
  brfSnapshot();
  const [f]=order.splice(from,1);
  const t=order.findIndex(x=>x.id===targetId);
  if(t<0){ order.splice(from,0,f); return; }
  /* Pages read top-to-bottom, so above in the panel is earlier in the order —
     the opposite of the layers list, where top means front of the stack. */
  order.splice(above?t:t+1, 0, f);
  brfSetPageOrder(b,order);
  tikiPush(); renderBriefEditor(); toast('Page moved');
}
function brfLayersPanel(b){
  /* Figma's shape: each page is a bold parent row you can collapse, with the
     things on it nested underneath in stacking order. Loose objects that aren't
     over any page get their own group at the end rather than being hidden. */
  const frames=brfPageOrder(b);
  const stack=brfStackables(b);
  const sel=state.brf.sel;
  const childrenOf=fr=>stack.filter(e=>{ const h=brfHostFrame(b,e); return h&&h.id===fr.id; }).reverse();
  const loose=stack.filter(e=>!brfHostFrame(b,e)).reverse();

  const row=e=>{
    const hidden=!!e.hidden, locked=!!e.locked;
    return `<div class="lay-row child ${sel===e.id?'on':''} ${hidden?'is-hidden':''}" data-layer="${e.id}"
      draggable="${locked?'false':'true'}"
      onclick="brfSelectLayer('${e.id}')"
      oncontextmenu="brfLayerMenu(event,'${e.id}')"

      <span class="lay-name">${esc(brfLayerLabel(e))}</span>
      <button class="lay-btn ${locked?'shown':''}" title="${locked?'Unlock':'Lock'}"
        onclick="event.stopPropagation();brfLayerToggle('${e.id}','locked')">${locked?ICONS.lock:ICONS.unlock}</button>
      <button class="lay-btn ${hidden?'shown':''}" title="${hidden?'Show':'Hide'}"
        onclick="event.stopPropagation();brfLayerToggle('${e.id}','hidden')">${hidden?ICONS.eyeOff:ICONS.eye}</button>
    </div>`;
  };
  const group=(fr)=>{
    const kids=childrenOf(fr);
    const open=!fr.collapsed;
    return `<div class="lay-row page ${state.brf.selFrame===fr.id?'on':''}" data-page="${fr.id}" draggable="true"
        onclick="brfSelectPageLayer('${fr.id}')" title="${esc(fr.title)} — drag to reorder pages"
        oncontextmenu="brfPageMenu(event,'${fr.id}')"
        ondragstart="brfPageDragStart(event,'${fr.id}')"
        ondragover="brfPageDragOver(event,'${fr.id}')"
        ondragleave="brfLayerDragLeave(event)"
        ondrop="brfPageDrop(event,'${fr.id}')"
        ondragend="brfPageDragEnd(event)">
        <button class="lay-chev ${open?'open':''}" onclick="event.stopPropagation();brfToggleGroup('${fr.id}')">${ICONS.chev}</button>
        <span class="lay-ico page-ico">${ICONS.frame}</span>
        <span class="lay-name">${esc(fr.title)}</span>
        <span class="lay-count">${kids.length}</span>
      </div>
      ${open?kids.map(row).join(''):''}`;
  };
  const total=stack.length;
  return `
    <div class="brf-layers">
      <div class="lay-h">Layers <span style="margin-left:auto;font-weight:600;text-transform:none;letter-spacing:0">${total}</span></div>
      <div class="lay-list" id="brfLayerList">
        ${frames.map(group).join('')}
        ${loose.length?`<div class="lay-row page" data-page="__loose" onclick="brfToggleGroup('__loose')">
            <button class="lay-chev ${state.brf.looseOpen===false?'':'open'}">${ICONS.chev}</button>
            <span class="lay-ico page-ico">${ICONS.canvas||ICONS.frame}</span>
            <span class="lay-name">Not on a page</span><span class="lay-count">${loose.length}</span>
          </div>${state.brf.looseOpen===false?'':loose.map(row).join('')}`:''}
        ${(!frames.length&&!loose.length)?`<div style="font-size:.75rem;color:var(--ink-3);padding:14px 10px;line-height:1.55">
          Nothing on the canvas yet. Add a page, then text, photos or videos from the dock below.</div>`:''}
      </div>
      <div style="padding:8px 12px 12px;font-size:.66rem;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--line-2)">
        Top of each page is the front of its stack. Drag to reorder, or right-click a layer.
      </div>
    </div>`;
}
function brfToggleGroup(id){
  if(id==='__loose'){ state.brf.looseOpen = state.brf.looseOpen===false; renderBriefEditor(); return; }
  const b=briefById(state.briefId); const fr=b&&b.elements.find(e=>e.id===id);

/* Hidden and locked are real, not decoration: a hidden layer doesn't render on
   the canvas or in Present, and a locked one can't be clicked or dragged. An
   icon that looked meaningful but did nothing would be worse than no icon. */
function brfLayerToggle(id, key){
  const b=briefById(state.briefId); const el=b&&b.elements.find(x=>x.id===id); if(!el) return;
  brfSnapshot();
  el[key]=!el[key];

function brfSelectLayer(id){

  renderBriefEditor();

/* Forwards means later in the array. */
function brfLayerMove(id, delta){
  const b=briefById(state.briefId); if(!b) return;
  const stack=brfStackables(b);
  const i=stack.findIndex(e=>e.id===id);
  const j=i+delta;
  if(i<0||j<0||j>=stack.length) return toast(delta>0?'Already at the front':'Already at the back');
  brfSnapshot();
  const [el]=stack.splice(i,1); stack.splice(j,0,el);
  brfCommitOrder(b,stack);
  tikiPush(); renderBriefEditor();
}
function brfLayerToEnd(id, front){
  const b=briefById(state.briefId); if(!b) return;
  const stack=brfStackables(b);
  const i=stack.findIndex(e=>e.id===id); if(i<0) return;
  brfSnapshot();
  const [el]=stack.splice(i,1);
  if(front) stack.push(el); else stack.unshift(el);
  brfCommitOrder(b,stack);
  tikiPush(); renderBriefEditor();

/* Drag to reorder. The list is reversed, so dropping ABOVE a row in the panel
   means going AFTER it in the array — getting this backwards is the classic
   layers-panel bug. */
let BRF_LAYER_DRAG=null;
function brfLayerDragStart(ev,id){
  BRF_LAYER_DRAG=id; BRF_PAGE_DRAG=null;   // only one drag can be in flight
  ev.dataTransfer.effectAllowed='move';
  try{ ev.dataTransfer.setData('text/plain','layer:'+id); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
/* Read the kind of thing being dragged from the payload rather than trusting a
   module-level variable. dragend is not guaranteed to fire — a cancelled drag
   can leave a stale id behind, and a page id left over from an earlier drag
   would otherwise be picked up by the next drop on a page row. */
function brfDragKind(ev){
  let raw='';
  try{ raw=ev.dataTransfer.getData('text/plain')||''; }catch(e){}
  if(raw.startsWith('page:')) return {kind:'page', id:raw.slice(5)};
  if(raw.startsWith('layer:')) return {kind:'layer', id:raw.slice(6)};
  if(BRF_PAGE_DRAG) return {kind:'page', id:BRF_PAGE_DRAG};
  if(BRF_LAYER_DRAG) return {kind:'layer', id:BRF_LAYER_DRAG};
  return {kind:null, id:null};
}
function brfLayerDragEnd(ev){
  ev.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.lay-row').forEach(n=>n.classList.remove('drop-above','drop-below'));
  BRF_LAYER_DRAG=null;
}
function brfLayerDragOver(ev,id){
  if(!BRF_LAYER_DRAG||BRF_LAYER_DRAG===id) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect='move';
  const r=ev.currentTarget.getBoundingClientRect();
  const above=(ev.clientY-r.top)<r.height/2;
  ev.currentTarget.classList.toggle('drop-above',above);
  ev.currentTarget.classList.toggle('drop-below',!above);
}
function brfLayerDragLeave(ev){ ev.currentTarget.classList.remove('drop-above','drop-below'); }
function brfLayerDrop(ev,targetId){
  ev.preventDefault();
  const d=brfDragKind(ev);
  document.querySelectorAll('.lay-row').forEach(n=>n.classList.remove('drop-above','drop-below'));
  if(d.kind!=='layer') return;             // a page dropped on a layer row is a no-op
  const dragId=d.id;
  if(!dragId||dragId===targetId) return;
  const b=briefById(state.briefId); if(!b) return;
  const r=ev.currentTarget.getBoundingClientRect();
  const above=(ev.clientY-r.top)<r.height/2;

  const stack=brfStackables(b);
  const from=stack.findIndex(e=>e.id===dragId);
  if(from<0) return;
  brfSnapshot();
  const [el]=stack.splice(from,1);
  let t=stack.findIndex(e=>e.id===targetId);
  if(t<0){ stack.splice(from,0,el); return; }
  /* Panel is top-first; array is bottom-first. Above in the panel = after in
     the array, hence the +1 on "above" rather than on "below". */
  stack.splice(above?t+1:t, 0, el);
  brfCommitOrder(b,stack);
  tikiPush(); renderBriefEditor();
}

async function brfSaveVideo(id){
  const b=briefById(state.briefId); const el=b.elements.find(x=>x.id===id); if(!el) return;
  const url=$('bvUrl').value.trim();
  const st=$('bvStatus'), btn=$('bvSave');
  el.handle=$('bvHandle').value.trim()||el.handle;
  el.caption=$('bvCap').value.trim()||el.caption;
  el.views=$('bvViews').value.trim()||el.views;

  if(!url){ el.url=''; el.videoId=null; el.thumb=null; closeModal(); renderBriefEditor(); return; }
  el.url=url;

  /* Resolve through the edge function: it follows short links and pulls the
     thumbnail, neither of which the browser can do on its own. */
  if(st) st.textContent='Looking that video up…';
  if(btn){ btn.disabled=true; btn.textContent='Loading…'; }
  try{
    const r=await tikiFetch('/functions/v1/tiktok-oembed',{ method:'POST', body:JSON.stringify({url}) });
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.videoId){
      el.videoId=j.videoId;
      el.thumb=j.thumb||el.thumb||null;
      el.url=j.url||url;
      if(!$('bvHandle').value.trim()&&j.handle) el.handle=j.handle;
      if(!$('bvCap').value.trim()&&j.caption) el.caption=j.caption;
      closeModal(); renderBriefEditor(); tikiPush();
      toast(el.thumb?'Video loaded — preview on the canvas, plays in Present':'Video linked — it will play in Present');
      return;
    }
    /* A local id parse is a decent fallback: the embed still plays even when
       oEmbed is unreachable, we just lose the thumbnail. */
    const local=brfVideoId(url);
    if(local){
      el.videoId=local; closeModal(); renderBriefEditor(); tikiPush();
      toast('Linked — thumbnail unavailable, but it will play in Present');
      return;
    }
    if(st) st.innerHTML=`<span style="color:var(--crit-ink)">${esc(j.error||'Could not read that link.')}</span>`;
  }catch(e){
    const local=brfVideoId(url);
    if(local){ el.videoId=local; closeModal(); renderBriefEditor(); toast('Linked (offline) — will play in Present'); return; }
    if(st) st.innerHTML='<span style="color:var(--crit-ink)">Couldn\u2019t reach the lookup service. Paste the full /video/ link.</span>';
  }
  if(btn){ btn.disabled=false; btn.textContent='Load video'; }
}

function renderBriefPresent(b){
  const s=state.brf;
  const frames=brfPageOrder(b);   // same order the layers panel shows
  /* Present is now a true rendering of the canvas rather than a reflowed
     document. Each page is drawn at its real pixel size with everything
     absolutely positioned exactly where it sits in the editor, then the whole
     page is scaled down to fit. Scaling — not reflowing — is what makes phone
     and desktop identical to each other and to the editor: same layout, fewer
     pixels. Anything hanging off a page crops here just as it does on canvas. */
  const PV_W = s.device==='phone' ? 320 : 660;
  const pageHTML=fr=>{
    const k=PV_W/fr.w;
    const bg=fr.bg||'#ffffff';
    const dark=brfIsDark(bg);
    const mine=b.elements.filter(e=>e.type!=='frame'&&!e.hidden&&brfHostFrame(b,e)&&brfHostFrame(b,e).id===fr.id);
    /* Same paint order as the canvas: photos under text and links. */
    const ordered=mine.filter(e=>e.type==='image').concat(mine.filter(e=>e.type!=='image'));
    const body=ordered.map(e=>{
      const x=e.x-fr.x, y=e.y-fr.y;
      if(e.type==='image')
        return `<img class="brf-img" src="${e.src}" alt="${esc(e.alt||'')}" style="position:absolute;left:${x}px;top:${y}px;width:${e.w}px;height:${e.h}px">`;
      if(e.type==='text')
        return `<div class="brf-text" style="position:absolute;left:${x}px;top:${y}px;width:${e.w}px;${
          e.h?`min-height:${e.h}px;`:''}${brfTextStyle(e)}${
          (!e.colour&&dark)?';color:#fff':''}">${brfTextHTML(e)}</div>`;
      if(e.type==='link')
        return `<div style="position:absolute;left:${x}px;top:${y}px"><a class="brf-link" href="${esc(brfUrl(e.url))}" target="_blank" rel="noopener" style="text-decoration:none">
          <span class="lk-ico">${ICONS.link}</span><span><div>${esc(e.label)}</div><div class="lk-url">${esc(e.url)}</div></span></a></div>`;
      if(e.type==='video')
        return `<div style="position:absolute;left:${x}px;top:${y}px">${brfVideoHTML(e,{live:true})}</div>`;
      return '';
    }).join('');
    return `<div class="pv-wrap" style="width:${(fr.w*k).toFixed(2)}px;height:${(fr.h*k).toFixed(2)}px">
        <div class="pv-page" style="width:${fr.w}px;height:${fr.h}px;background:${bg};transform:scale(${k})">${body}</div>
      </div>
      <div class="pv-cap"${dark?'':''}>${esc(fr.title)}</div>`;
  };
  const inner=`
    <div style="padding:${s.device==='phone'?'14px 10px 26px':'24px 22px 36px'};max-width:${PV_W+44}px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px">
        <div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2a78d6,#4a3aa7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.75rem">P</div>
        <span style="font-size:.72rem;font-weight:700;color:var(--ink-3)">${brandInfo(b.brand).name} · Content Brief</span>
      </div>
      <h2 style="font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:16px">${esc(b.name)}</h2>
      ${frames.map(pageHTML).join('')||'<div class="empty">This brief has no pages yet</div>'}
      <div style="text-align:center;font-size:.7rem;color:var(--ink-3);padding-top:6px">Questions? Message us · This brief is read-only</div>
    </div>`;
  $('page-briefs').innerHTML=`
    <div class="brf-editor">
      <div class="brf-top">
        ${s.publicView?'':`<button class="sb-toggle-btn" onclick="document.body.classList.toggle('sb-hidden')" title="Collapse / expand sidebar">${ICONS.panel}</button>
        <button class="tb-icon-btn" style="width:32px;height:32px" onclick="state.brf.present=false;renderBriefEditor()" title="Back to canvas">${ICONS.arrow.replace('M5 12h14M12 5l7 7-7 7','M19 12H5M12 19l-7-7 7-7')}</button>`}
        <div><div style="font-weight:700;font-size:.92rem">${esc(b.name)}</div>
        <div style="font-size:.7rem;color:var(--ink-3)">${s.publicView?'Content brief · read-only':'Affiliate preview — read-only, exactly what they\'ll see'}</div></div>
        <div style="margin-left:auto;display:flex;gap:9px;align-items:center">
          <div class="seg">
            <button class="${s.device==='desktop'?'active':''}" onclick="state.brf.device='desktop';renderBriefEditor()">🖥 Desktop</button>
            <button class="${s.device==='phone'?'active':''}" onclick="state.brf.device='phone';renderBriefEditor()">📱 Phone</button>
          </div>
          ${s.publicView?'':`<div class="seg">
            <button onclick="state.brf.present=false;renderBriefEditor()">✏️ Edit</button>
            <button class="active">▶ Present</button>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openBriefShare('${b.id}')">${ICONS.send} Share</button>`}
        </div>
      </div>
      <div class="present-scroll" style="padding:${s.device==='phone'?'22px 10px':'0'}">
        ${s.device==='phone'?`<div class="phone-frame"><div class="ph-notch"></div><div style="max-height:calc(100vh - 320px);overflow-y:auto">${inner}</div></div>`:inner}
      </div>
    </div>`;
}
/* ===================================================================
   SHARING
   ===================================================================
   A creator has no account, so the link has to work with nothing but the anon
   key. Publishing writes a read-only SNAPSHOT of the brief to brief_shares,
   addressed by an unguessable token, and the viewer reads it back through a
   security-definer function. It has to be a function rather than a table policy:
   any anon-readable policy would let someone with the public key list every
   shared brief, and the token would be protecting nothing.

   The link points at wherever this app is actually hosted, taken from the
   current URL rather than hardcoded — the old link pointed at tiki.app, a
   domain nobody owns, which is why it landed on a GoDaddy sales page. */
const shareToken = () => {
  const a=new Uint8Array(16); crypto.getRandomValues(a);
  return [...a].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,24);
};
const shareUrlFor = tok => `${location.origin}${location.pathname}?b=${tok}`;

async function briefPublish(id, existingToken){
  const b=briefById(id); if(!b) return null;
  const token=existingToken||b.shareToken||shareToken();
  const row={ token, brief_id:b.id, brief_name:b.name,
    brief:{ ...b, comments:[] },       // comments are internal, never shared
    revoked:false, updated_at:new Date().toISOString() };
  const r=await tikiFetch('/rest/v1/brief_shares?on_conflict=token',{ method:'POST',
    headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(row) });
  if(!r.ok) throw new Error('Could not publish the link');
  b.shareToken=token; b.status='Shared'; b.sharedAt=new Date().toISOString();
  tikiPush();
  return token;
}
async function briefRevoke(id){
  const b=briefById(id); if(!b||!b.shareToken) return;
  await tikiFetch(`/rest/v1/brief_shares?token=eq.${encodeURIComponent(b.shareToken)}`,{
    method:'PATCH', body:JSON.stringify({ revoked:true, updated_at:new Date().toISOString() }) });
  b.shareToken=null; b.status='Draft';
  tikiPush();
}
function openBriefShare(id){
  const b=briefById(id); if(!b) return;
  const live=!!b.shareToken;
  openModal(modalShell('Share this brief',`
    <p style="font-size:.82rem;color:var(--ink-2);line-height:1.55;margin-bottom:14px">
      Anyone with the link can read the brief — no account, no sign-in. They see the same pages you see in
      Present, on any device. Comments stay private to the team.</p>
    <div class="field" style="margin-bottom:6px"><label>Share link</label>
      <div style="display:flex;gap:8px">
        <input id="shLink" readonly placeholder="Publish to create the link"
          value="${live?esc(shareUrlFor(b.shareToken)):''}"
          style="flex:1;font-family:monospace;font-size:.74rem">
        <button class="btn btn-primary btn-sm" id="shBtn" onclick="briefShareAction('${id}')">${live?'Copy':'Publish'}</button>
      </div></div>
    <div id="shNote" style="font-size:.75rem;color:var(--ink-3);line-height:1.5;min-height:18px">${
      live?`Published${b.sharedAt?' '+new Date(b.sharedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''} — press Update after you make changes.`
         :'The link is a snapshot, so nothing goes public until you publish it.'}</div>
    ${live?`<div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-soft btn-sm" onclick="briefShareUpdate('${id}')">Update with my latest changes</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--crit-ink);margin-left:auto" onclick="briefShareRevoke('${id}')">Turn off link</button>
    </div>`:''}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`));
}
async function briefShareAction(id){
  const b=briefById(id);
  const inp=$('shLink'), btn=$('shBtn'), note=$('shNote');
  if(b.shareToken){
    inp.select();
    try{ await navigator.clipboard.writeText(inp.value); toast('Link copied'); }
    catch(e){ document.execCommand&&document.execCommand('copy'); toast('Link copied'); }
    return;
  }
  btn.disabled=true; btn.textContent='Publishing…';
  try{
    const tok=await briefPublish(id);
    inp.value=shareUrlFor(tok);
    btn.disabled=false; btn.textContent='Copy';
    note.textContent='Published. Anyone with this link can read the brief.';
    try{ await navigator.clipboard.writeText(inp.value); toast('Link published and copied'); }
    catch(e){ toast('Link published'); }
    openBriefShare(id);
    if(state.briefId) renderBriefEditor(); else renderBriefs();
  }catch(e){
    btn.disabled=false; btn.textContent='Publish';
    note.innerHTML='<span style="color:var(--crit-ink)">'+esc(e.message||'Publish failed')+'</span>';
  }
}
async function briefShareUpdate(id){
  const b=briefById(id);
  try{ await briefPublish(id, b.shareToken); toast('Shared copy updated'); openBriefShare(id); }
  catch(e){ toast(e.message||'Update failed'); }
}
async function briefShareRevoke(id){
  if(!confirm('Turn off this link? Anyone holding it will stop being able to open the brief.')) return;
  try{
    await briefRevoke(id);
    toast('Link turned off'); closeModal();
    if(state.briefId) renderBriefEditor(); else renderBriefs();

   ===================================================================== */
/* Logins vault — client-side AES-GCM encryption. The database only ever sees ciphertext. */
let LOGINS=[];   // decrypted in memory only while vault is open
const TIKI_VAULT={ blob:null, cryptoKey:null };
state.vaultOpen=false;
const revealedPw=new Set();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function vaultDeriveKey(pw, salt){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km,
    {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function vaultEncrypt(){
  if(!TIKI_VAULT.cryptoKey) return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=await crypto.subtle.encrypt({name:'AES-GCM', iv}, TIKI_VAULT.cryptoKey, new TextEncoder().encode(JSON.stringify(LOGINS)));
  TIKI_VAULT.blob={ salt:TIKI_VAULT.blob.salt, iv:b64(iv), data:b64(data) };
  tikiDirty();
}
async function vaultTryUnlock(){
  const inp=$('vaultPw'); const pw=inp.value;
  if(!pw || pw.length<6){ toast('Vault password needs 6+ characters'); return; }
  try{
    if(!TIKI_VAULT.blob){
      // first run — this password BECOMES the vault password
      const salt=crypto.getRandomValues(new Uint8Array(16));
      TIKI_VAULT.blob={ salt:b64(salt) };
      TIKI_VAULT.cryptoKey=await vaultDeriveKey(pw, salt);
      LOGINS=[];
      await vaultEncrypt();
      state.vaultOpen=true; revealedPw.clear(); renderSettings();
      toast('Vault created — this password now protects your logins');
    } else {
      const key=await vaultDeriveKey(pw, unb64(TIKI_VAULT.blob.salt));
      const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(TIKI_VAULT.blob.iv)}, key, unb64(TIKI_VAULT.blob.data));
      LOGINS=JSON.parse(new TextDecoder().decode(plain));
      TIKI_VAULT.cryptoKey=key;
      state.vaultOpen=true; revealedPw.clear(); renderSettings(); toast('Vault unlocked');
    }
  } catch(e){
    inp.value=''; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); toast('Wrong vault password');
  }
}
function vaultLock(){ state.vaultOpen=false; revealedPw.clear(); LOGINS=[]; TIKI_VAULT.cryptoKey=null; renderSettings(); toast('Vault locked'); }
function togglePw(i){ revealedPw.has(i)?revealedPw.delete(i):revealedPw.add(i); renderSettings(); }
function copyPw(i){ toast(`Password for ${LOGINS[i].app} copied`); }
function deleteLogin(i){ const l=LOGINS.splice(i,1)[0]; vaultEncrypt(); renderSettings(); toast(`${l.app} login removed`); }

   PAGE: OUTREACH — creator onboarding hub
   Samples → official Affiliate API (approve/reject sample applications)
   Auto-invites → official Target Collaboration API (thresholds, caps)
   Recommender → Apify TikTok scrape (leaderboards/niche), daily
   Messages → mirrored from Seller Center (no public creator-IM API yet)
   ===================================================================== */
const SAMPLE_REQS = [];
const OUTREACH_RECS = [];
const OUTREACH_FLOWS = [];
let PERSONAL_OUTREACH = [];
const CHATS = [];
state.outreachTab='samples'; state.chatOpen='ch1';
/* ============================================================================
   VIDEOS
   Reads tiktok_video_daily — one row per video per DAY. That shape is the whole
   point: TikTok reports a video's GMV *for the window you ask about*, so a video
   posted in February can earn in July. Storing days means any range is a local
   SUM, and "earned in range" vs "posted in range" are two separate, both-correct
   questions (the basis toggle).
   ========================================================================== */

let VIDEO_DAILY = [];
const VID_THUMBS = new Map();   /* video_id -> {thumb, handle} — session cache */
let VID_THUMB_RUN = false;

async function videosLoad(){
  try{
    /* 180 days of history is ~38k rows and climbing, so: ask for only the
       columns the grid actually needs (hash_tags, currency, avg_customers and
       synced_at are dead weight here) and raise the cap well clear of the row
       count. The old 20,000 cap silently truncated the OLDEST data — the table
       is ordered newest-first — which is why history looked like it stopped
       part-way through April when the database already held February. */
    const cols='video_id,stat_date,username,title,account_type,gmv,items_sold,sku_orders,views,gpm,click_through_rate,duration,posted_at,products';
    const rows = await tikiFetchAll(`/rest/v1/tiktok_video_daily?select=${cols}&order=stat_date.desc`, 200000);
    if(Array.isArray(rows)) VIDEO_DAILY = rows;
  }catch(e){ /* offline / not signed in — page shows its empty state */ }
}

const vIso = d => d.toISOString().slice(0,10);
function vidCoverage(){
  if(!VIDEO_DAILY.length) return null;
  let lo=VIDEO_DAILY[0].stat_date, hi=VIDEO_DAILY[0].stat_date;
  for(const r of VIDEO_DAILY){ if(r.stat_date<lo) lo=r.stat_date; if(r.stat_date>hi) hi=r.stat_date; }
  return {lo,hi};
}
function vidEnsureRange(){
  if(state.videoFrom && state.videoTo) return;
  const cov=vidCoverage();
  const hi = cov? cov.hi : vIso(new Date());
  const wanted = vIso(new Date(new Date(hi).getTime()-29*86400000));
  state.videoTo = hi;
  state.videoFrom = cov && wanted<cov.lo ? cov.lo : wanted;
}
function vidSetPreset(p, after){
  const cov=vidCoverage();
  const hi = cov? cov.hi : vIso(new Date());
  state.videoPreset=p;
  if(p==='all'){ state.videoFrom = cov? cov.lo : hi; state.videoTo=hi; }
  else {
    const days=Number(p);
    const from=vIso(new Date(new Date(hi).getTime()-(days-1)*86400000));
    state.videoFrom = cov && from<cov.lo ? cov.lo : from;
    state.videoTo = hi;
  }
  (window[after]||renderVideos)();
}
function vidSetDate(which,val,after){
  if(!val) return;
  if(which==='from') state.videoFrom=val; else state.videoTo=val;
  state.videoPreset='custom';
  (window[after]||renderVideos)();
}

/* One period control, shared by Videos and Creators, driving one window in
   state. Change it on either page and both agree — which is the point: the
   Creators GMV column and the Videos grid should never disagree about "when". */
function vidPeriodBar(after, showBasis){
  vidEnsureRange();
  const cov=vidCoverage();
  const presets=[['7','7 days'],['30','30 days'],['90','90 days'],['all','All time']];
  return `<div class="vperiod" style="margin-bottom:4px">
    <span class="plab">Period</span>
    ${presets.map(([k,l])=>`<button class="vchip ${state.videoPreset===k?'on':''}" onclick="vidSetPreset('${k}','${after}')">${l}</button>`).join('')}
    ${showBasis?`<span class="plab" style="margin-left:10px">Count by</span>
    <span class="vbasis">
      <button class="${state.videoBasis==='earned'?'on':''}" onclick="state.videoBasis='earned';${after}()">Earned in period</button>
      <button class="${state.videoBasis==='posted'?'on':''}" onclick="state.videoBasis='posted';${after}()">Posted in period</button>
    </span>`:''}
    <span class="vdates">
      <input type="date" value="${state.videoFrom}" ${cov?`min="${cov.lo}" max="${cov.hi}"`:''} onchange="vidSetDate('from',this.value,'${after}')">
      <span>→</span>
      <input type="date" value="${state.videoTo}" ${cov?`min="${cov.lo}" max="${cov.hi}"`:''} onchange="vidSetDate('to',this.value,'${after}')">
    </span>
  </div>`;
}

/* Per-creator totals for the chosen window, straight out of the daily rows.
   Keyed on lowercased handle so it survives @ prefixes and casing. */
function creatorPeriodMap(){
  vidEnsureRange();
  const from=state.videoFrom, to=state.videoTo, m=new Map();
  for(const r of VIDEO_DAILY){
    if(r.stat_date<from || r.stat_date>to) continue;
    const u=String(r.username||'').trim().toLowerCase(); if(!u) continue;
    let s=m.get(u);
    if(!s){ s={gmv:0,views:0,items:0,_v:new Set()}; m.set(u,s); }
    s.gmv+=Number(r.gmv)||0; s.views+=Number(r.views)||0; s.items+=Number(r.items_sold)||0;
    s._v.add(r.video_id);
  }
  m.forEach(s=>{ s.videos=s._v.size; s.gpm=s.views? s.gmv/s.views*1000 : 0; delete s._v; });
  return m;
}

/* Aggregate the daily rows into one object per video for the chosen window. */
function vidAgg(){
  vidEnsureRange();
  const from=state.videoFrom, to=state.videoTo;
  const byId=new Map();
  for(const r of VIDEO_DAILY){
    if(r.stat_date<from || r.stat_date>to) continue;
    let v=byId.get(r.video_id);
    if(!v){
      v={ id:r.video_id, username:r.username||'', title:r.title||'', posted:r.posted_at||'',
          duration:Number(r.duration)||0, account:r.account_type||'', products:r.products||[],
          gmv:0, views:0, items:0, orders:0, ctrSum:0, ctrN:0, days:[] };
      byId.set(r.video_id,v);
    }
    v.gmv  += Number(r.gmv)||0;
    v.views += Number(r.views)||0;
    v.items += Number(r.items_sold)||0;
    v.orders+= Number(r.sku_orders)||0;
    const c=Number(r.click_through_rate)||0; if(c){ v.ctrSum+=c; v.ctrN++; }
    v.days.push({d:r.stat_date, views:Number(r.views)||0, gmv:Number(r.gmv)||0});
    if(!v.title && r.title) v.title=r.title;
    if(!v.username && r.username) v.username=r.username;
    if(!v.posted && r.posted_at) v.posted=r.posted_at;
  }
  let list=[...byId.values()];
  list.forEach(v=>{
    v.ctr = v.ctrN? v.ctrSum/v.ctrN : 0;
    v.gpm = v.views? v.gmv/v.views*1000 : 0;
    v.days.sort((a,b)=>a.d<b.d?-1:1);
  });

  /* basis toggle */
  if(state.videoBasis==='posted')
    list=list.filter(v=>v.posted && v.posted.slice(0,10)>=from && v.posted.slice(0,10)<=to);

  /* account filter */
  if(state.videoAccount==='affiliate') list=list.filter(v=>v.account!=='OFFICIAL_ACCOUNTS');
  else if(state.videoAccount==='own')  list=list.filter(v=>v.account==='OFFICIAL_ACCOUNTS');

  if(state.videoCreator!=='all') list=list.filter(v=>v.username===state.videoCreator);

  const q=state.videoSearch.trim().toLowerCase();
  if(q) list=list.filter(v=>(v.title+' '+v.username).toLowerCase().includes(q));

  const S=state.videoSort;
  list.sort((a,b)=>
    S==='views' ? b.views-a.views :
    S==='gpm'   ? b.gpm-a.gpm :
    S==='ctr'   ? b.ctr-a.ctr :
    S==='items' ? b.items-a.items :
    S==='newest'? (a.posted<b.posted?1:-1) :
                  b.gmv-a.gmv);
  return list;
}

const vShort = n => n>=1e6? (n/1e6).toFixed(1).replace('.0','')+'M'
                : n>=1e3? (n/1e3).toFixed(1).replace('.0','')+'K' : String(n||0);
const vDur = s => s? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : '';
const vDate = s => s? new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—';
const vLongDate = s => s? new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : '—';
const vEsc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Play in place, one click.
   embed/v2 (what the brief canvas uses) renders a card you then have to click a
   SECOND time to start, and it refuses to reflow below its natural size so it
   needs the CSS-scale trick. player/v1 is TikTok's plain player: it fills its
   iframe properly AND accepts autoplay. Browsers only allow autoplay when muted,
   so it starts muted — the player's own control unmutes.
   Clicks inside an iframe don't bubble, so the card's onclick stops firing once
   the player is in. */
const vidPlayerSrc = id =>
  `https://www.tiktok.com/player/v1/${id}?autoplay=1&muted=1&controls=1&description=0&music_info=0&rel=0`;

function vidPlay(ev,id){
  ev.stopPropagation();
  const host=$('vt-'+id); if(!host || host.dataset.playing) return;
  host.dataset.playing='1';
  host.innerHTML=`<iframe class="vplayer" src="${vidPlayerSrc(id)}"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen"
      frameborder="0" scrolling="no"></iframe>`;
}

/* Thumbnails come from TikTok oEmbed via the existing edge function. The signed
   URLs expire after ~2 days, so we never store them — fetched per session,
   cached in memory, and quietly skipped if oEmbed is unreachable. */
async function vidThumbs(list){
  if(VID_THUMB_RUN) return;
  const todo=list.filter(v=>v.id && v.username && !VID_THUMBS.has(v.id)).slice(0,40);
  if(!todo.length) return;
  VID_THUMB_RUN=true;
  for(const v of todo){
    try{
      const url=`https://www.tiktok.com/@${v.username}/video/${v.id}`;
      const r=await tikiFetch('/functions/v1/tiktok-oembed',{ method:'POST', body:JSON.stringify({url}) });
      const j=await r.json().catch(()=>({}));
      VID_THUMBS.set(v.id,{ thumb:j.thumb||null, handle:j.handle||v.username });
      const host=$('vt-'+v.id);
      if(host && j.thumb){
        const ph=host.querySelector('.vph');
        if(ph) ph.outerHTML=`<img src="${vEsc(j.thumb)}" alt="" loading="lazy">`;
      }
    }catch(e){ VID_THUMBS.set(v.id,{thumb:null}); }
  }
  VID_THUMB_RUN=false;
}

/* Parks the video on the brief shelf. The brief editor picks these up as a

function vidToBrief(id){
  const v=vidAgg().find(x=>x.id===id); if(!v) return;
  BRIEF_SHELF = BRIEF_SHELF.filter(x=>x.id!==v.id);
  BRIEF_SHELF.unshift({ id:v.id, username:v.username, title:v.title,
    url:`https://www.tiktok.com/@${v.username}/video/${v.id}`,
    thumb:(VID_THUMBS.get(v.id)||{}).thumb||null, gmv:v.gmv, views:v.views, added:new Date().toISOString() });
  BRIEF_SHELF=BRIEF_SHELF.slice(0,60);

  btns.forEach(b=>{ b.dataset.l=b.textContent; b.textContent='Syncing…'; b.disabled=true; });
  try{

const CAMP_MONEY_RANGES = ['','£0–50','£50–250','£250–1K','£1K–5K','£5K+'];

function campDefaults(){
  return {
    id:uid('cm-'), title:'', status:'Draft', step:1,
    audience:'outreach', sequence:'tc_dm',
    schedule:{ enabled:true, from:'08:00', to:'22:00', tz:'Europe/London', limitOn:false, perDay:200 },
    query:{}, selected:[], excluded:[],
    invite:{ title:'', message:'', expiryValue:6, expiryUnit:'Weeks',
      products:[], freeSamples:true, autoApprove:false, contentType:'none',
      contactEmail:'', conflict:'all' },
    dm:{ additional:[], followups:[] },
    createdAt:new Date().toISOString()
  };
}
const campById = id => CAMPAIGNS.find(c=>c.id===id);
function campNew(){
  const c=campDefaults(); CAMPAIGNS.unshift(c); tikiPush();
  state.campEdit=c.id; state.campStep=1; renderOutreach();
}
function campDelete(id){
  const i=CAMPAIGNS.findIndex(c=>c.id===id); if(i<0) return;
  CAMPAIGNS.splice(i,1); state.campEdit=null; tikiPush(); renderOutreach(); toast('Campaign deleted');
}
function campGo(step){
  const c=campById(state.campEdit); if(!c) return;
  c.step=Math.max(1,Math.min(4,step)); state.campStep=c.step; tikiPush(); renderOutreach();
  window.scrollTo({top:0,behavior:'smooth'});
}
function campSet(path,val){
  const c=campById(state.campEdit); if(!c) return;
  const parts=path.split('.'); let o=c;
  for(let i=0;i<parts.length-1;i++){ o[parts[i]]=o[parts[i]]||{}; o=o[parts[i]]; }
  o[parts[parts.length-1]]=val; tikiPush();
}
function campPickThen(path,val){ campSet(path,val); renderOutreach(); }

/* ---- list view ---- */
function outCampaigns(){
  if(state.campEdit && campById(state.campEdit)) return campWizard();
  return `
    ${flowGateNote()}
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
      <button class="btn btn-primary btn-sm" onclick="campNew()">${ICONS.plus} New campaign</button>
    </div>
    ${CAMPAIGNS.map(c=>{
      const aud=CAMP_AUDIENCE[c.audience], seq=CAMP_SEQUENCE[c.sequence];
      return `<div class="card" style="margin-bottom:12px"><div class="card-b" style="display:flex;gap:15px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:230px">
          <div style="display:flex;align-items:center;gap:9px">
            <span style="font-weight:700">${esc(c.title||'Untitled campaign')}</span>
            <span class="badge ${c.status==='Armed'?'bg-violet':''}">${c.status}</span>
          </div>
          <div style="font-size:.75rem;color:var(--ink-2);margin-top:5px">
            ${aud.t} · ${seq.t} · ${c.selected.length} affiliate${c.selected.length===1?'':'s'} selected
            ${c.invite.products.length?` · ${c.invite.products.length} product${c.invite.products.length===1?'':'s'}`:''}
          </div>
          <div style="font-size:.7rem;color:var(--ink-3);margin-top:5px">Step ${c.step} of 4 complete</div>
        </div>
        <div style="display:flex;gap:7px">
          <button class="btn btn-ghost btn-sm" onclick="campDelete('${c.id}')" style="color:var(--crit-ink)">Delete</button>
          <button class="btn btn-ghost btn-sm" onclick="state.campEdit='${c.id}';state.campStep=${c.step};renderOutreach()">Open</button>
        </div>
      </div></div>`;
    }).join('')||`<div class="card"><div class="empty">No campaigns yet — build your first creator outreach campaign.</div></div>`}`;
}

/* ---- wizard shell ---- */
function campWizard(){
  const c=campById(state.campEdit);
  const step=state.campStep||c.step||1;
  const titles=['Campaign Setup','Affiliate Query','Invite Details','DM Messages'];
  const body=[campStep1,campStep2,campStep3,campStep4][step-1](c);
  const lastStep = c.sequence==='dm'||c.sequence==='tc_dm' ? 4 : 3;
  return `
    <div class="wz">
      <div class="bar"><i style="width:${Math.round(step/4*100)}%"></i></div>
      <div class="st">Step ${step} of 4 · ${titles[step-1]}</div>
    </div>
    ${body}
    <div class="wzfoot">
      <button class="btn btn-ghost btn-sm" style="margin-right:auto" onclick="state.campEdit=null;renderOutreach()">← All campaigns</button>
      ${step>1?`<button class="btn btn-ghost" onclick="campGo(${step-1})">Back</button>`:''}
      <button class="btn btn-ghost" onclick="tikiPush();toast('Campaign saved')">Save</button>
      ${step<4
        ? `<button class="btn btn-primary" onclick="campGo(${step+1})">Next</button>`
        : `<button class="btn btn-primary" disabled title="Sending is blocked until the Affiliate Seller scope is granted">Launch — locked</button>`}
    </div>`;
}

/* ---- step 1 ---- */
function campStep1(c){
  const opt=(map,key,cur,path)=>Object.entries(map).map(([k,v])=>`
    <div class="op ${cur===k?'on':''}" onclick="campPickThen('${path}','${k}')">
      ${v.rec?`<span class="rec">✦ Recommended</span>`:''}
      <div class="ico" style="background:${v.bg};color:${v.fg}">${v.ico}</div>
      <div class="t">${v.t}</div><div class="s">${v.s}</div>
