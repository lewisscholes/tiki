<script>
'use strict';
/* =====================================================================
   PONG — TikTok Operations Hub · HTML Prototype
   Single-file prototype. All data below is sample data.
   ===================================================================== */

/* ============ SAMPLE DATA ============ */
/* One brand on the account. Add more via Settings → Brands; the switcher in the
   sidebar appears automatically as soon as there is more than one. */
const BRANDS = {
  lytes: { name:'Lytes', color:'#2a78d6', solid:'#2a78d6' }
};
const BRAND_IDS = () => Object.keys(BRANDS);
/* <option> list for any brand picker. "All Brands" only appears once there is
   more than one brand, otherwise it is meaningless. */
const brandOptions = (sel, allLabel) => BRAND_IDS().map(k=>`<option value="${k}" ${sel===k?'selected':''}>${BRANDS[k].name}</option>`).join('')
  + (BRAND_IDS().length>1 && allLabel ? `<option value="all" ${sel==='all'?'selected':''}>${allLabel}</option>` : '');
const defaultBrand = () => BRAND_IDS()[0];
/* The brand the Profit tracker is wired to (one Shop + bank feed at a time). */
const PROFIT_BRAND = 'lytes';

/* Team. Lewis only until members are invited from Settings → Team.
   Everything member-driven (assignee pickers, per-person task views and
   dashboards) is generated from this object — nobody is hard-coded. */
const USERS = {
  lewis: { id:'lewis', name:'Lewis Scholes', short:'Lewis', initials:'LS', role:'Founder & Growth Lead',
           av:'av-lewis', admin:true, email:'lewisscholes2@gmail.com', onboarded:false }
};
/* Resolved from the signed-in email after the cloud pull — 'lewis' is only the
   pre-auth default. Every "who am I" check in the app reads this. */
let ME = 'lewis';
function resolveMe(){
  const em=(tikiSession?.email||'').toLowerCase();
  const hit=Object.values(USERS).find(u=>(u.email||'').toLowerCase()===em);
  if(hit){ ME=hit.id; return; }
  if(em){
    /* Signed in but not on the team list (edge case: invite record lost) — create a bare entry. */
    const id=em.split('@')[0].replace(/[^a-z0-9]/g,'')||('u'+Date.now());
    USERS[id]={ id, name:em.split('@')[0], short:em.split('@')[0], initials:em.slice(0,2).toUpperCase(),
      role:'Team member', av:AV_POOL[Object.keys(USERS).length%AV_POOL.length], email:em, onboarded:false };
    ME=id;
  }
}
const teammates = () => Object.keys(USERS).filter(u=>u!==ME);
const AV_POOL = ['av-rod','av-c1','av-c2','av-c3','av-c4','av-c5','av-c6'];

const TASK_STATUSES = ['Not Started','In Progress','Waiting on Creator','Waiting on Lewis','Waiting on Stock','Blocked','Completed'];
const PRIORITIES = ['Low','Medium','High','Urgent'];
/* Live clock — a fresh account runs on the real date, not a demo date. */
const TODAY = (()=>{ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY_ISO = isoOf(TODAY);
const fmtLongToday = () => TODAY.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

const CREATORS = [];
const CREATOR_STAGES = ['Prospect','Contacted','Interested','Sample Requested','Sample Sent','Content Pending','Content Live','Active Creator','Retainer Creator','Paused','Rejected'];

const PRODUCTS = [];

const CAMPAIGNS = [];

const TASKS = [];


const RETAINERS = [];

const NOTIFICATIONS = [];

const ACTIVITY = [];

/* GMV weekly series (last 8 weeks, w/c dates) */
/* Rolling 8 weeks ending with the current week (Mon-dated). */
const WEEKS = (()=>{ const out=[], n=new Date(), mon=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  for(let i=7;i>=0;i--){ const d=new Date(mon); d.setDate(d.getDate()-i*7);
    out.push(d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})); }
  return out; })();
const GMV_SERIES   = { lytes: [0,0,0,0,0,0,0,0] };
const VIDEO_SERIES = { lytes: [0,0,0,0,0,0,0,0] };


/* ============ EXPLICIT KPI BASE (per brand, "This Month") ============ */
/* KPI base per brand. Zeroed for a fresh account — these fill from the TikTok Shop
   + Shopify feeds once the API connections in Settings are live. */
const BRAND_KPIS = {
  lytes: { gmv:0, net:0, videos:0, creators:0, approvals:0, gmvDelta:'—', netDelta:'—', vidDelta:'—', crDelta:'—' }
};
/* Real ranges — every metric is computed from the synced orders inside the
   window, and the delta compares against the previous window of equal length. */
const DATE_RANGES = ['Today','Last 3 Days','Last 7 Days','Last 14 Days','Last 30 Days','Last 90 Days','All Time'];
const RANGE_DAYS  = { 'Today':1, 'Last 3 Days':3, 'Last 7 Days':7, 'Last 14 Days':14, 'Last 30 Days':30, 'Last 90 Days':90, 'All Time':0 };
function rangeWindow(range){
  const days=RANGE_DAYS[range]??30;
  if(!days) return { from:null, to:null, prevFrom:null, prevTo:null, days:0 };
  const to=new Date(TODAY); to.setDate(to.getDate()+1);            // exclusive end: tomorrow 00:00
  const from=new Date(to); from.setDate(from.getDate()-days);
  const prevTo=from, prevFrom=new Date(from); prevFrom.setDate(prevFrom.getDate()-days);
  return { from, to, prevFrom, prevTo, days };
}
/* Sum live TikTok orders + settlements + batch COGS inside a window. */
function metricsIn(from, to){
  /* Gross profit: GMV minus every TikTok fee, minus ad spend, minus COGS.
     Overheads and one-offs are NOT deducted here — they belong to Operating
     profit on the Profit tab. Two different questions, two different numbers. */
  const apo=adPerOrder();
  let gmv=0, net=0, orders=0, costed=0, fees=0, cogs=0, ads=0;
  (TIKTOK_ORDERS||[]).forEach(o=>{
    if(!o.created_at) return;
    const d=new Date(o.created_at);
    if(from&&d<from) return; if(to&&d>=to) return;
    orders++;
    const iso=o.created_at.slice(0,10);
    const gross=Number(o.total)||0; gmv+=gross;
    const st=TIKTOK_SETTLEMENTS[o.order_id];
    const settle=st?Number(st.settlement_amount)||0:gross*0.86;
    fees += Math.max(0, gross-settle);
    const ad=apo[iso]||0; ads+=ad;
    const unit=cogsUnitInc(iso,null);
    const c = unit!=null ? unit*(o.item_count||1) : 0;
    if(unit!=null) costed++;
    cogs+=c;
    net += settle - ad - c;
  });
  return { gmv, net, orders, costed, fees, cogs, ads };
}
function rangeMetrics(range){
  const w=rangeWindow(range);
  const cur=metricsIn(w.from,w.to);
  const prev=w.days?metricsIn(w.prevFrom,w.prevTo):{gmv:0,net:0,orders:0};
  const pct=(a,b)=>b>0?Math.round((a-b)/b*100):null;
  /* Fee drag is a share, so compare it in percentage POINTS. A drag going
     18% -> 20% is "up 2 points", not "up 11%" — the latter sounds alarming
     and tells you nothing about the money. */
  const drag=m=>m.gmv>0?m.fees/m.gmv*100:null;
  const curDrag=drag(cur), prevDrag=drag(prev);
  return { ...cur, dGmv:pct(cur.gmv,prev.gmv), dNet:pct(cur.net,prev.net), dOrders:pct(cur.orders,prev.orders),
    drag:curDrag, dDrag: curDrag!=null&&prevDrag!=null ? +(curDrag-prevDrag).toFixed(1) : null, window:w };
}
/* Chart buckets that follow the date picker instead of being stuck on 8 weeks.
   Granularity adapts so the shape stays readable: a 3-day range plots 3 days,
   a 90-day range plots weeks, all-time plots months. Each bucket carries GMV and
   gross profit, because the gap between those two lines IS the story — GMV
   climbing while profit flatlines is the single most expensive thing to miss. */
function rangeBuckets(range){
  const w=rangeWindow(range);
  const orders=(TIKTOK_ORDERS||[]).filter(o=>o.created_at).map(o=>o.created_at.slice(0,10)).sort();
  if(!orders.length) return { labels:[], gmv:[], net:[], margin:[], unit:'day' };

  let start, end=new Date(TODAY); end.setDate(end.getDate()+1);
  if(w.days) start=new Date(w.from); else start=new Date(orders[0]);
  if(isNaN(start)) start=new Date(orders[0]);

  const span=Math.max(1,Math.round((end-start)/864e5));
  const unit = span<=16 ? 'day' : span<=95 ? 'week' : 'month';

  /* Bucket edges, oldest first. */
  const edges=[];
  if(unit==='day'){
    for(let d=new Date(start); d<end; d.setDate(d.getDate()+1)) edges.push(new Date(d));
  } else if(unit==='week'){
    const m=new Date(start); m.setDate(m.getDate()-((m.getDay()+6)%7));
    for(let d=new Date(m); d<end; d.setDate(d.getDate()+7)) edges.push(new Date(d));
  } else {
    const m=new Date(start.getFullYear(), start.getMonth(), 1);
    for(let d=new Date(m); d<end; d.setMonth(d.getMonth()+1)) edges.push(new Date(d));
  }
  if(!edges.length) edges.push(new Date(start));

  const labels=[], gmv=[], net=[], margin=[], drag=[], days=[];
  edges.forEach((from,i)=>{
    const to=i+1<edges.length?edges[i+1]:end;
    const m=metricsIn(from,to);
    gmv.push(+m.gmv.toFixed(2));
    net.push(+m.net.toFixed(2));
    margin.push(m.gmv>0?+(m.net/m.gmv*100).toFixed(1):0);
    drag.push(m.gmv>0?+(m.fees/m.gmv*100).toFixed(1):0);
    days.push(Math.max(1,Math.round((to-from)/864e5)));
    labels.push(unit==='month'
      ? from.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})
      : from.toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
  });
  return { labels, gmv, net, margin, drag, days, unit };
}

/* ---- DECISION METRICS ----------------------------------------------
   Each of these exists to answer a question you'd act on, not to be looked at.
   Stock cover -> reorder now or not. Fee drag -> is the platform quietly taking
   more. Break-even -> is today paying for itself. */

/* Monthly overhead RUN RATE, not total spend. A vendor's stored total is
   everything we've ever paid them, so it has to be divided by the number of
   months we've actually observed or a 6-month history reads as a 6x bill. */
function monthlyOverheads(){
  return PROFIT_VENDORS
    .filter(v=>v.freq!=='one-off'&&!v.excl)
    .reduce((s,v)=>s+(Number(v.total)||0)/Math.max(1,Number(v.months)||1),0);
}
function dailyBreakEven(){ return monthlyOverheads()/30.44; }

/* Units sold and GMV taken over the last N days — the basis for both velocity
   and average selling price. Uses real orders, so discounts and promotions are
   already baked into the price rather than assumed away. */
function salesWindow(days){
  const since=new Date(TODAY); since.setDate(since.getDate()-days);
  let units=0, gmv=0, orders=0;
  (TIKTOK_ORDERS||[]).forEach(o=>{
    if(!o.created_at||new Date(o.created_at)<since) return;
    units+=Number(o.item_count)||1; gmv+=Number(o.total)||0; orders++;
  });
  return { units, gmv, orders, days };
}
/* Average selling price, actual not listed. Widens the window if 14 days is too
   quiet to be meaningful, and only falls back to list price as a last resort —
   list price ignores every discount you've ever run. */
function avgSellingPrice(){
  for(const d of [14,30,90]){
    const w=salesWindow(d);
    if(w.units>=3) return { asp:w.gmv/w.units, basis:`${d}-day average`, units:w.units };
  }
  const w=salesWindow(90);
  if(w.units>0) return { asp:w.gmv/w.units, basis:'90-day average (thin data)', units:w.units };
  const live=PRODUCTS.filter(p=>p.price>0);
  if(live.length) return { asp:live.reduce((n,p)=>n+p.price,0)/live.length, basis:'list price — no sales to average', units:0 };
  return { asp:null, basis:'no price data', units:0 };
}

/* Real stock on hand, per channel.
   TikTok reports actual warehouse inventory, which is the truth — it accounts
   for returns, damages, samples and manual adjustments that a
   bought-minus-sold calculation silently gets wrong. That derived figure is
   kept only as a fallback for before the first product sync. */
const SHOPIFY_STOCK=null;   // set once the Shopify API/webhook is connected
function stockCover(){
  const tiktokProducts=PRODUCTS.filter(p=>p.channel==='tiktok'&&p.status!=='DELETED');
  const hasFeed=tiktokProducts.length>0;
  const tiktok=hasFeed?tiktokProducts.reduce((n,p)=>n+(Number(p.stock)||0),0):null;
  const shopify=SHOPIFY_STOCK;

  const bought=COGS_BATCHES.reduce((n,b)=>n+(+b.qty||0),0);
  const sold=(TIKTOK_ORDERS||[]).reduce((n,o)=>n+(Number(o.item_count)||1),0);

  const onHand = hasFeed ? (tiktok||0)+(shopify||0) : (bought?bought-sold:null);
  const source = hasFeed ? 'live' : (bought?'derived':'none');

  const perDay=salesWindow(14).units/14;
  const { asp, basis }=avgSellingPrice();
  const unitCost=cogsUnitInc(TODAY_ISO,null);

  return {
    onHand, source, tiktok, shopify, bought, sold, perDay,
    days: onHand!=null&&perDay>0 ? Math.round(onHand/perDay) : null,
    asp, aspBasis: basis,
    retail: onHand!=null&&asp!=null ? onHand*asp : null,   // what it's worth if it all sells
    cost:   onHand!=null&&unitCost!=null ? onHand*unitCost : null,  // what it's worth on the balance sheet
    unitCost,
    /* A live feed that disagrees with bought-minus-sold is worth surfacing:
       it usually means samples, returns or a batch that was never entered. */
    drift: hasFeed&&bought ? (tiktok||0)-(bought-sold) : null,
  };
}
/* Weekly GMV + order buckets for the charts, built from real orders. */
function weeklyBuckets(){
  const mon=new Date(TODAY); mon.setDate(mon.getDate()-((TODAY.getDay()+6)%7));
  const starts=[...Array(8)].map((_,i)=>{ const d=new Date(mon); d.setDate(d.getDate()-(7-i)*7); return d; });
  const gmv=Array(8).fill(0), vids=Array(8).fill(0);
  (TIKTOK_ORDERS||[]).forEach(o=>{
    if(!o.created_at) return;
    const t=new Date(o.created_at);
    for(let i=7;i>=0;i--){ if(t>=starts[i]){ const end=new Date(starts[i]); end.setDate(end.getDate()+7);
      if(t<end){ gmv[i]+=Number(o.total)||0; vids[i]++; } break; } }
  });
  return { labels:starts.map(d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})), gmv, orders:vids };
}

    'Account Issue':'bg-crit','Opportunity':'bg-good','Urgent Decision':'bg-crit','Performance Update':'bg-magenta'};
  return `<span class="badge ${map[c]||'bg-neutral'}">${c}</span>`;
};
const progBar = (pct,color) => {
  const c = color || (pct>=80?'var(--good)':pct>=50?'var(--accent)':pct>=25?'var(--warn)':'var(--crit)');
  return `<div class="prog"><div style="width:${Math.min(100,pct)}%;background:${c}"></div></div>`;
};
const progRow = (label,cur,target,fmt) => {
  const pct = target? Math.round(cur/target*100) : 0;
  return `<div class="prog-row"><div class="pr-top"><span class="l">${label}</span><span class="v">${fmt(cur)} <span style="color:var(--ink-3);font-weight:500">/ ${fmt(target)}</span> · ${pct}%</span></div>${progBar(pct)}</div>`;
};
const scoreRing = (score,max=10) => {
  const pct=score/max, r=21, c=2*Math.PI*r;
  const col = score>=8?'var(--good)':score>=6?'var(--warn)':'var(--crit)';
  return `<div class="score-ring"><svg width="52" height="52"><circle cx="26" cy="26" r="${r}" stroke="var(--neutral-soft)" stroke-width="5" fill="none"/><circle cx="26" cy="26" r="${r}" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/></svg><span class="sv">${score.toFixed(1)}</span></div>`;
};

  t.innerHTML=`${ICONS.check}<span>${esc(msg)}</span>`;
  $('toastWrap').appendChild(t);

}

document.addEventListener('keydown', e=>{

    closeModal(); toggleNotifs(false); closeAllDD(); closeSpotlight();

/* ============ SPOTLIGHT SEARCH (⌘K) ============ */
let spotItems=[], spotSel=0;
function openSpotlight(){
  closeAllDD(); toggleNotifs(false);
  $('spotOv').classList.add('open');
  const inp=$('spotInput'); inp.value=''; spotSel=0;
  buildSpotResults('');
  setTimeout(()=>inp.focus(),20);
}
function closeSpotlight(){ $('spotOv').classList.remove('open'); }
function buildSpotResults(q){
  q=q.trim().toLowerCase();
  const items=[];
  const add=(group,icon,title,sub,run)=>items.push({group,icon,title,sub,run});
  if(!q){
    add('Suggestions','home','Go to Overview','Page',()=>navTo('overview'));
    teammates().forEach(u=>add('Suggestions','tasks',`${USERS[u].short}'s Dashboard`,'Tasks',()=>navTo('tasks',{taskView:'dash:'+u})));
    add('Suggestions','flag','Approvals waiting on you', state.tasks.filter(t=>t.status==='Waiting on Lewis').length+' items', ()=>goNeedsLewis());
    add('Actions','plus','New task','',()=>openTaskModal());
    add('Actions','canvas','New brief','',()=>newBrief());
    add('Actions','users','Add creator','',()=>openCreatorModal());
  } else {
    /* Hidden pages (Profit, Courses, the cause map) stay searchable — they're
       out of the sidebar, not out of the app. Spotlight is how you reach them
       quickly without going via Settings. */
    PAGES.filter(p=>p.label.toLowerCase().includes(q)).forEach(p=>add('Pages',p.icon,p.label,p.hidden?'Back office':'Page',()=>navTo(p.id)));
    state.tasks.filter(t=>t.name.toLowerCase().includes(q)).slice(0,5).forEach(t=>add('Tasks','tasks',t.name,t.status,()=>{navTo('tasks');openTaskDetail(t.id);}));
    CREATORS.filter(c=>(c.name+' '+c.handle).toLowerCase().includes(q)).slice(0,5).forEach(c=>add('Creators','users',c.name,c.handle,()=>{navTo('creators');openCreatorDetail(c.id);}));
    BRIEFS.filter(b=>b.name.toLowerCase().includes(q)).slice(0,4).forEach(b=>add('Briefs','canvas',b.name,b.status,()=>openBriefEditor(b.id)));
    COURSES.filter(c=>c.title.toLowerCase().includes(q)).slice(0,4).forEach(c=>add('Courses','grad',c.title,c.duration,()=>{navTo('courses');openCourseDetail(c.id);}));
    RETAINERS.filter(r=>r.person.toLowerCase().includes(q)).slice(0,4).forEach(r=>add('Retainers','card',r.person,money(r.amount)+'/mo',()=>{navTo('retainers');openRetainerDetail(r.id);}));
    ['task','brief','creator','retainer'].filter(x=>('new '+x).includes(q)||x.startsWith(q)).forEach(x=>{
      const runs={task:()=>openTaskModal(),brief:()=>newBrief(),creator:()=>openCreatorModal(),retainer:()=>openRetainerModal()};
      add('Actions','plus','New '+x,'',runs[x]);
    });
  }
  spotItems=items;
  spotSel=Math.min(spotSel, Math.max(0,items.length-1));
  const groups=[...new Set(items.map(i=>i.group))];
  $('spotResults').innerHTML = items.length ? groups.map(g=>
    `<div class="spot-group">${g}</div>` + items.map((it,idx)=>it.group!==g?'':
      `<div class="spot-item ${idx===spotSel?'sel':''}" data-si="${idx}" onmouseenter="spotSel=${idx};paintSpotSel()" onclick="runSpot(${idx})">
        ${ICONS[it.icon]||ICONS.doc}<span class="st">${esc(it.title)}</span>${it.sub?`<span class="ss">${esc(it.sub)}</span>`:''}</div>`).join('')
  ).join('') : `<div class="empty" style="padding:22px">Nothing found for “${esc(q)}”</div>`;
}
function paintSpotSel(){
  document.querySelectorAll('.spot-item').forEach(n=>n.classList.toggle('sel', +n.dataset.si===spotSel));
}
function runSpot(i){ const it=spotItems[i]; if(!it) return; closeSpotlight(); it.run(); }
document.addEventListener('DOMContentLoaded', ()=>{
  $('spotInput').addEventListener('input', e=>{ spotSel=0; buildSpotResults(e.target.value); });
  $('spotInput').addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); spotSel=Math.min(spotItems.length-1,spotSel+1); paintSpotSel(); scrollSpotSel(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); spotSel=Math.max(0,spotSel-1); paintSpotSel(); scrollSpotSel(); }
    else if(e.key==='Enter'){ e.preventDefault(); runSpot(spotSel); }
    else if(e.key==='Escape'){ closeSpotlight(); }
  });
});
function scrollSpotSel(){ document.querySelector(`.spot-item[data-si="${spotSel}"]`)?.scrollIntoView({block:'nearest'}); }

  let list = state.notifs;
  if(state.notifFilter==='unread') list=list.filter(n=>!n.read);
  if(state.notifFilter==='urgent') list=list.filter(n=>n.type==='urgent');
  const iconBg={urgent:'background:var(--crit-soft);color:var(--crit-ink)',warn:'background:var(--warn-soft);color:var(--warn-ink)',good:'background:var(--good-soft);color:var(--good-ink)',neutral:'background:var(--neutral-soft);color:var(--neutral-ink)'};
  $('npBody').innerHTML = list.length? list.map(n=>`
    <div class="np-item ${n.read?'':'unread'}" onclick="notifClick('${n.id}')">
      <div class="ni-ico" style="${iconBg[n.type]}">${ICONS[n.icon]||ICONS.alert}</div>
      <div style="flex:1;min-width:0">
        <div class="ni-t">${n.type==='urgent'?'<span class="badge bg-crit" style="margin-right:6px">Urgent</span>':''}${esc(n.title)}</div>
        <div class="ni-d">${esc(n.desc)}</div>
        <div class="ni-time">${n.time}</div>
      </div>${n.read?'':'<span class="un-dot"></span>'}
    </div>`).join('') : `<div class="empty"><div class="e-ico">🔔</div>No notifications here</div>`;
}
function notifClick(id){
  const n=state.notifs.find(x=>x.id===id); n.read=true;
  renderNotifs(); toggleNotifs(false); navTo(n.page);
}
function markAllRead(){ state.notifs.forEach(n=>n.read=true); renderNotifs(); toast('All notifications marked as read'); }

function renderOverview(){
  const k=BRAND_KPIS[state.brand] || (state.brand==='all'
    ? BRAND_IDS().reduce((acc,id)=>{ const x=BRAND_KPIS[id]||{}; ['gmv','net','videos','creators','approvals'].forEach(f=>acc[f]=(acc[f]||0)+(x[f]||0)); return acc; },
        { gmvDelta:'—', netDelta:'—', vidDelta:'—', crDelta:'—' })
    : { gmv:0,net:0,videos:0,creators:0,approvals:0,gmvDelta:'—',netDelta:'—',vidDelta:'—',crDelta:'—' });
  const rm=rangeMetrics(state.dateRange);
  const myTasks=state.tasks.filter(inBrand);
  const overdue=myTasks.filter(isOverdue).length;
  const retSpend=RETAINERS.filter(r=>state.brand==='all'||r.brand===state.brand||r.brand==='all').reduce((s,r)=>s+r.amount,0);
  const needsLewis=myTasks.filter(t=>t.status==='Waiting on Lewis');
  /* Charts follow the date picker, so say what you're actually looking at. */
  const bk=rangeBuckets(state.dateRange);
  const chartSub = !bk.labels.length ? 'no orders in this period'
    : `${state.dateRange} · by ${bk.unit}`;
  const sc=stockCover();
  const be=dailyBreakEven();
  /* Average drag across the buckets that actually traded — including zero-GMV
     days would drag the mean down and make every real day look expensive. */
  const dragTraded=bk.drag?bk.drag.filter((d,i)=>bk.gmv[i]>0):[];
  const dragAvg=dragTraded.length?dragTraded.reduce((a,b)=>a+b,0)/dragTraded.length:null;
  /* Daily gross profit actually achieved over the selected window, so the
     break-even tile compares like with like. */
  const perDay = rm.window.days
    ? rm.net/rm.window.days
    : (bk.days.length ? rm.net/bk.days.reduce((a,b)=>a+b,0) : 0);
  const oldestSync=(TIKTOK_ORDERS||[]).length?TIKTOK_ORDERS[TIKTOK_ORDERS.length-1].created_at?.slice(0,10):null;
  const rangeNote = state.dateRange==='All Time'
    ? (oldestSync?`synced data since ${fmtDate(oldestSync)}`:'all time')
    : `vs previous ${rm.window.days} day${rm.window.days===1?'':'s'}`;

  const hasData = state.tasks.length||CREATORS.length||RETAINERS.length||k.gmv;
  const overallStatus = !hasData?'Getting Started':overdue>2?'Behind Target':needsLewis.length>3?'Needs Attention':'On Track';
  /* No history yet → show a flat marker rather than a green up-arrow against nothing. */
  /* Say plainly what's in the number, and warn if COGS coverage is partial. */
  /* Kept deliberately short — these sit on one line and get clipped otherwise. */
  const grossProfitNote=(m)=>{
    if(!m.orders) return 'no orders in range';
    const gap=m.orders-m.costed;
    const pct=m.gmv?Math.round(m.net/m.gmv*100):0;
    if(gap>0) return `<span style="color:var(--warn-ink)">${gap} uncosted</span>`;
    return `${pct}% margin`;
  };
  const delta=(d)=> d==null||d==='—' ? `<span class="delta flat">→ —</span>`
    : (typeof d==='number'
        ? (d===0?`<span class="delta flat">→ 0%</span>`:d>0?`<span class="delta up">↑ ${d}%</span>`:`<span class="delta down">↓ ${Math.abs(d)}%</span>`)
        : `<span class="delta up">↑ ${d}</span>`);
  const kpi=(label,val,icoName,icoStyle,foot)=>`
    <div class="kpi">
      <div class="k-top"><span class="k-ico" style="${icoStyle}">${ICONS[icoName]}</span><span class="k-label">${label}</span></div>
      <div class="k-val">${val}</div>
      <div class="k-foot">${foot}</div>
    </div>`;

  $('page-overview').innerHTML=`
    <div class="page-head">
      <div>
        <h1>Good morning, Lewis 👋</h1>
        <div class="desc">Here's what's happening across ${brandInfo(state.brand).name} · ${fmtLongToday()}</div>
      </div>
      <div class="actions">
        <div class="dd">
          <button class="btn btn-ghost btn-sm" onclick="toggleDD(event,'dateMenuOv')">
            ${ICONS.cal}<span>${state.dateRange}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:12px;height:12px"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dd-menu" id="dateMenuOv">
            <div class="dd-label">Date range</div>
            ${DATE_RANGES.map(r=>`<button class="dd-item ${state.dateRange===r?'sel':''}" onclick="setDateRange('${r}')">${ICONS.cal}${r}<span class="check">✓</span></button>`).join('')}
          </div>
        </div>
        <span class="status-lg ${overallStatus==='Getting Started'?'bg-neutral':overallStatus==='On Track'?'bg-good':overallStatus==='Needs Attention'?'bg-warn':'bg-crit'}">● ${overallStatus}</span>
      </div>
    </div>

    <div class="kpi-grid">
      ${kpi('GMV — '+state.dateRange, money(Math.round(rm.gmv)), 'chart','background:var(--accent-soft);color:var(--accent-ink)',
        `${delta(rm.dGmv)}<span>${rangeNote}</span>`)}
      ${kpi('Gross Profit',
        `<span style="color:${rm.net<0?'var(--crit-ink)':'var(--good-ink)'}">${money(Math.round(rm.net))}</span>`,
        'card', rm.net<0?'background:var(--crit-soft);color:var(--crit-ink)':'background:var(--good-soft);color:var(--good-ink)',
        `${delta(rm.dNet)}<span>${grossProfitNote(rm)}</span>`)}
      ${kpi('Active Creators', k.creators, 'users','background:var(--aqua-soft);color:var(--aqua-ink)',
        `${delta(k.crDelta)}<span>this month</span>`)}
      ${kpi('Monthly Retainer Spend', money(retSpend), 'card','background:var(--magenta-soft);color:var(--magenta-ink)',
        `<span>${retSpend&&rm.net>0?`${m2(rm.net/retSpend)} profit per £1`:'no return yet'}</span>`)}

      ${kpi('Fee Drag', rm.drag!=null?rm.drag.toFixed(1)+'%':'—', 'card','background:var(--warn-soft);color:var(--warn-ink)',
        rm.drag!=null
          ? `${rm.dDrag==null?'<span class="delta flat">→ —</span>':rm.dDrag===0?'<span class="delta flat">→ 0 pts</span>':rm.dDrag>0?`<span class="delta down">↑ ${rm.dDrag} pts</span>`:`<span class="delta up">↓ ${Math.abs(rm.dDrag)} pts</span>`}<span>${money(Math.round(rm.fees))} fees</span>`
          : `<span>no settled orders</span>`)}
      ${kpi('Stock Cover', sc.days!=null?sc.days+' days':(sc.onHand!=null?sc.onHand.toLocaleString()+' units':'—'), 'box',
        sc.days!=null&&sc.days<21?'background:var(--crit-soft);color:var(--crit-ink)':sc.days!=null&&sc.days<42?'background:var(--warn-soft);color:var(--warn-ink)':'background:var(--good-soft);color:var(--good-ink)',
        sc.onHand!=null
          ? `<span>${sc.onHand.toLocaleString()} units${sc.perDay>0?` · ${sc.perDay.toFixed(1)}/day`:' · no sales'}</span>`
          : `<span>sync TikTok for stock</span>`)}
      ${kpi('Stock Value', sc.retail!=null?money(Math.round(sc.retail)):'—', 'card','background:var(--violet-soft);color:var(--violet-ink)',

function chartSeries(){

  const zero=()=>WEEKS.map(()=>0);
  return BRAND_IDS()
    .filter(k=>state.brand==='all'||state.brand===k)

               gmv:GMV_SERIES[k]||zero(), vids:VIDEO_SERIES[k]||zero() }));
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v||1))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function drawCharts(){
  const b=rangeBuckets(state.dateRange);
  const money1=v=>'£'+(Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)%1000?1:0)+'k':Math.round(v));
  /* The overhead line, scaled to each bucket's length — so on a weekly chart it
     is a week of overheads, not a day's. Gross profit below this line means the
     period didn't pay for itself, which is the whole question. */
  const be=dailyBreakEven();
  const threshold = be>0 && b.days && b.days.length
    ? { data:b.days.map(d=>+(be*d).toFixed(2)), color:'#d1495b', label:'Break-even' }
    : null;
  drawLineChart('gmvChart', b.labels, [
      { label:'GMV', color:'#2a78d6', data:b.gmv },
      { label:'Gross profit', color:'#1baf7a', data:b.net },
    ], money1, v=>'£'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}), threshold);
  /* Margin, not volume. Volume tells you how busy you were; margin tells you
     whether being busy was worth it. */
  drawBarChart('marginChart', b.labels, [
      { label:'Margin %', color:'#1baf7a', data:b.margin },
    ], v=>v+'%');
  /* Fee drag, with a flat average line behind it. A single day at 22% means
     nothing on its own; 22% against a 17% average is a question worth asking. */
  const traded=b.drag?b.drag.filter((d,i)=>b.gmv[i]>0):[];
  const avg=traded.length?traded.reduce((x,y)=>x+y,0)/traded.length:null;
  drawLineChart('dragChart', b.labels, [
      { label:'Fee drag', color:'#eda100', data:b.drag||[] },
    ], v=>v.toFixed(0)+'%', v=>v.toFixed(1)+'%',
    avg!=null?{ data:(b.drag||[]).map(()=>+avg.toFixed(1)), color:'#98a2b3', label:'Average' }:null);
}
function drawLineChart(id, labels, series, tickFmt, tipFmt, threshold){
  const box=$(id); if(!box) return;
  /* Nothing to plot yet — show a placeholder rather than an SVG full of NaN. */
  if(!labels.length || !series.length || !series.some(x=>(x.data||[]).length)){
    box.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--ink-3)">No data for this period yet</div>`;
    return;
  }
  const W=680,H=250,padL=44,padR=10,padT=12,padB=26;
  /* The axis has to survive negatives — an unprofitable period is exactly when
     you most want to look at this chart, and a 0-to-max scale turns it into NaN. */
  const all=[...series.flatMap(s=>s.data), ...(threshold?threshold.data:[])].filter(Number.isFinite);
  const maxV=niceMax(Math.max(...all, 0)*1.15)||1;
  const minRaw=Math.min(...all, 0);
  const minV=minRaw<0?-niceMax(Math.abs(minRaw)*1.15):0;
  const span=(maxV-minV)||1;
  const x=i=>padL+(W-padL-padR)*(labels.length>1?i/(labels.length-1):0.5);
  const y=v=>padT+(H-padT-padB)*(1-(v-minV)/span);
  const ticks=[0,.25,.5,.75,1].map(t=>minV+t*span);
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">`;
  ticks.forEach(t=>{ svg+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="#e1e0d9" stroke-width="1"/>`; });
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(labels.length-1)},${y(0)}" fill="${s.color}" opacity="0.07"/>`;
    svg+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
  if(threshold&&threshold.data.length===labels.length){
    svg+=`<polyline points="${threshold.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none"
      stroke="${threshold.color}" stroke-width="1.5" stroke-dasharray="5,4" vector-effect="non-scaling-stroke"/>`;
  }
  svg+=`<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="#c3c2b7" stroke-width="1"/>`;
  svg+=`<line id="${id}-cross" x1="0" y1="${padT}" x2="0" y2="${y(0)}" stroke="#98a2b3" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>`;
  series.forEach((s,si)=>{ s.data.forEach((v,i)=>{ svg+=`<circle id="${id}-pt-${si}-${i}" cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2" style="display:none"/>`; }); });
  svg+='</svg>';
  const tickHtml=ticks.map(t=>`<span style="position:absolute;left:0;top:${(y(t)/H*100)}%;transform:translateY(-50%);font-size:.64rem;color:#898781">${tickFmt(t)}</span>`).join('');
  const labHtml=labels.map((l,i)=>`<span style="position:absolute;left:${(x(i)/W*100)}%;bottom:0;transform:translateX(-50%);font-size:.64rem;color:#898781;white-space:nowrap">${l}</span>`).join('');
  box.innerHTML=`<div style="position:absolute;inset:0">${svg}${tickHtml}${labHtml}
    <div id="${id}-tip" style="position:absolute;display:none;background:#101828;color:#fff;font-size:.72rem;padding:7px 10px;border-radius:8px;pointer-events:none;z-index:5;white-space:nowrap;box-shadow:var(--shadow-lg)"></div></div>`;
  const layer=box.firstElementChild;
  layer.style.cursor='crosshair';
  layer.onmousemove=e=>{
    const r=layer.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(labels.length-1,Math.round((mx-padL)/((W-padL-padR)/(labels.length-1)))));
    const cross=$(id+'-cross'); cross.style.display='block'; cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i));
    series.forEach((s,si)=>{ s.data.forEach((v,j)=>{ const pt=$(`${id}-pt-${si}-${j}`); if(pt) pt.style.display=j===i?'block':'none'; }); });
    const tip=$(id+'-tip');
    tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${labels[i]}</div>`+series.map(s=>`<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:${s.color}"></span>${s.label}: <b>${tipFmt(s.data[i])}</b></div>`).join('');
    tip.style.display='block';
    const tx=Math.min(Math.max(x(i)/W*r.width+10,4),r.width-150);
    tip.style.left=tx+'px'; tip.style.top='8px';
  };
  layer.onmouseleave=()=>{ $(id+'-cross').style.display='none'; $(id+'-tip').style.display='none';
    series.forEach((s,si)=>s.data.forEach((v,j)=>{ const pt=$(`${id}-pt-${si}-${j}`); if(pt) pt.style.display='none'; })); };
}
function drawBarChart(id, labels, series, tickFmt){
  const box=$(id); if(!box) return;
  /* Nothing to plot yet — show a placeholder rather than an SVG full of NaN. */
  if(!labels.length || !series.length || !series.some(x=>(x.data||[]).length)){
    box.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--ink-3)">No data for this period yet</div>`;
    return;
  }
  const W=680,H=250,padL=30,padR=10,padT=12,padB=26;
  const totals=labels.map((_,i)=>series.reduce((s,sr)=>s+(Number(sr.data[i])||0),0));
  /* Same negative-safe axis as the line chart — a loss-making week must be able
     to draw below the baseline instead of producing NaN geometry. */
  const maxV=niceMax(Math.max(...totals, 0)*1.15)||1;
  const minRaw=Math.min(...totals, 0);
  const minV=minRaw<0?-niceMax(Math.abs(minRaw)*1.15):0;
  const span=(maxV-minV)||1;
  const slot=(W-padL-padR)/labels.length, bw=slot*0.55;
  const y=v=>padT+(H-padT-padB)*(1-(v-minV)/span);
  const ticks=[0,.25,.5,.75,1].map(t=>minV+t*span);
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">`;
  ticks.forEach(t=>{ svg+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="#e1e0d9" stroke-width="1"/>`; });
  labels.forEach((_,i)=>{
    let acc=0; const cx=padL+slot*i+(slot-bw)/2;
    series.forEach((s,si)=>{
      const v=Number(s.data[i])||0; if(!v) { return; }
      const y1=Math.min(y(acc+v),y(acc)), y0=Math.max(y(acc+v),y(acc));
      const isTop=acc+v===totals[i];
      const h=Math.max(y0-y1,1.5);
      svg+=`<rect x="${cx}" y="${y1}" width="${bw}" height="${h}" fill="${s.color}" rx="${isTop?3:0}" data-i="${i}"/>`;
      acc+=v;
    });
  });
  svg+=`<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="#c3c2b7" stroke-width="1"/>`;
  svg+='</svg>';
  const tickHtml=ticks.map(t=>`<span style="position:absolute;left:0;top:${(y(t)/H*100)}%;transform:translateY(-50%);font-size:.64rem;color:#898781">${tickFmt(t)}</span>`).join('');
  const labHtml=labels.map((l,i)=>`<span style="position:absolute;left:${((padL+slot*i+slot/2)/W*100)}%;bottom:0;transform:translateX(-50%);font-size:.64rem;color:#898781;white-space:nowrap">${l}</span>`).join('');
  box.innerHTML=`<div style="position:absolute;inset:0">${svg}${tickHtml}${labHtml}
    <div id="${id}-tip" style="position:absolute;display:none;background:#101828;color:#fff;font-size:.72rem;padding:7px 10px;border-radius:8px;pointer-events:none;z-index:5;white-space:nowrap;box-shadow:var(--shadow-lg)"></div></div>`;
  const layer=box.firstElementChild;
  layer.onmousemove=e=>{
    const r=layer.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(labels.length-1,Math.floor((mx-padL)/slot)));
    const tip=$(id+'-tip');
    tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${labels[i]}</div>`+series.map(s=>`<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:${s.color}"></span>${s.label}: <b>${s.data[i]}</b></div>`).join('')+(series.length>1?`<div style="margin-top:3px;border-top:1px solid rgba(255,255,255,.2);padding-top:3px">Total: <b>${totals[i]}</b></div>`:'');
    tip.style.display='block';
    const tx=Math.min(Math.max((padL+slot*i+slot/2)/W*r.width+10,4),r.width-130);
    tip.style.left=tx+'px'; tip.style.top='8px';
  };
  layer.onmouseleave=()=>{ $(id+'-tip').style.display='none'; };
}

function applyTaskFilters(list){
  let l=list;
  if(state.taskView==='mine') l=l.filter(t=>t.assignee===ME&&t.status!=='Completed');
  if(state.taskView.startsWith('u:')){ const u=state.taskView.slice(2); l=l.filter(t=>t.assignee===u&&t.status!=='Completed'); }
  if(state.taskView==='overdue') l=l.filter(isOverdue);
  if(state.taskView==='completed') l=l.filter(t=>t.status==='Completed');
  if(state.taskView==='list') l=l.filter(t=>t.status!=='Completed');
  if(state.taskStatusFilter!=='All') l=l.filter(t=>t.status===state.taskStatusFilter);
  if(state.taskSearch) l=l.filter(t=>(t.name+' '+t.desc).toLowerCase().includes(state.taskSearch.toLowerCase()));
  return l.sort((a,b)=>a.due.localeCompare(b.due));

/* Creator GMV is never lifetime — tiktok-creators pulls a rolling 90-day window
   from TikTok's video analytics. Say so, rather than letting the page imply
   "ever". Falls back gracefully before any video data has loaded. */
function creatorGmvWindow(){
  const d=(typeof VIDEO_DAILY!=='undefined') && VIDEO_DAILY.length ? vidCoverage() : null;
  return d ? `· last 90 days (video-attributed, detail ${d.lo} → ${d.hi})` : '· last 90 days, not lifetime';
}
function creatorGmvWindowShort(){ return '<span style="font-weight:400;color:var(--ink-3)">(90d)</span>'; }

function renderCreators(){
  const all=CREATORS.filter(inBrand);
  /* Period-aware figures. When we hold daily video rows, every number in this
     table is recomputed for the chosen window rather than showing whatever the
     last sync happened to write. Falls back to the stored values otherwise. */
  const PM=creatorPeriodMap(), hasPeriod=PM.size>0;
  const cp=c=>PM.get(String(c.handle||'').replace(/^@/,'').trim().toLowerCase())||{gmv:0,views:0,items:0,videos:0,gpm:0};
  const cGmv=c=>hasPeriod?cp(c).gmv:c.gmv;
  const cVids=c=>hasPeriod?cp(c).videos:c.videos;
  const cGpm=c=>hasPeriod?cp(c).gpm:0;
  const cViews=c=>{ const s=cp(c); return hasPeriod ? (s.videos? Math.round(s.views/s.videos) : 0) : c.avgViews; };
  const smartFilters=[
    ['all','All creators',c=>true],
    ['gmv','Highest GMV',c=>cGmv(c)>0],
    ['videos','Most videos',c=>cVids(c)>0],
    ['cvr','Best conversion',c=>c.cvr>0],
    ['retainer','Retainer creators',c=>c.stage==='Retainer Creator'],
    ['stopped','Stopped posting',c=>c.stage==='Paused'],
    ['samples','Waiting for samples',c=>['Sample Requested','Sample Sent'].includes(c.stage)],
    ['followup','Need follow-up',c=>['Contacted','Interested','Sample Sent','Content Pending','Paused'].includes(c.stage)],
    ['new','New creators',c=>['Prospect','Contacted','Interested'].includes(c.stage)]
  ];
  const active=smartFilters.find(f=>f[0]===state.creatorFilter)||smartFilters[0];
  let list=all.filter(active[2]);
  if(state.creatorStage!=='All') list=list.filter(c=>c.stage===state.creatorStage);
  if(state.creatorSearch) list=list.filter(c=>(c.name+' '+c.handle).toLowerCase().includes(state.creatorSearch.toLowerCase()));
  if(state.creatorFilter==='gmv') list=[...list].sort((a,b)=>cGmv(b)-cGmv(a));
  else if(state.creatorFilter==='videos') list=[...list].sort((a,b)=>cVids(b)-cVids(a));
  else if(state.creatorFilter==='cvr') list=[...list].sort((a,b)=>b.cvr-a.cvr);
  else if(hasPeriod) list=[...list].sort((a,b)=>cGmv(b)-cGmv(a)||cVids(b)-cVids(a));
  else list=creatorRank(list);
  const totGmv=all.reduce((s,c)=>s+cGmv(c),0);

function retEff(r){
  // Efficiency score 0-10: cost vs delivery vs GMV vs quality/reliability
  const delivery = r.promised? (r.delivered/r.promised) : 1;
  const roi = r.amount? Math.min(1,(r.gmv/6)/ (r.amount*10)) : 0; // rough return signal
  const qual=(r.quality+r.reliability)/20;
  return Math.round((delivery*4 + roi*3 + qual*3)*10)/10;
}

let API_LOG=[];
async function apiLogWrite(source, action, ok, status, ms, records, message, meta){
  const row={ source, action, ok:!!ok, status:status||null, duration_ms:Math.round(ms)||null,
    records:records??null, message:message?String(message).slice(0,400):null, meta:meta||null };
  API_LOG.unshift({...row, ts:new Date().toISOString()});
  if(API_LOG.length>200) API_LOG.length=200;
  try{ await tikiFetch('/rest/v1/api_log',{method:'POST',body:JSON.stringify(row)}); }catch(e){}
}
async function apiLogLoad(){

    const r=await tikiFetch('/rest/v1/api_log?select=*&order=ts.desc&limit=200');
    if(r.ok) API_LOG=await r.json();
  }catch(e){}
}
/* Call an Edge Function and record the outcome either way. */
async function callFn(source, action, path, opts){
  const t0=performance.now();
  try{
    const r=await tikiFetch(path, opts||{method:'POST'});
    const j=await r.json().catch(()=>({}));
    const recs = j.orders!=null||j.products!=null||j.settlements!=null
      ? (j.orders||0)+(j.products||0)+(j.settlements||0) : null;
    const msg = r.ok ? (j.notes&&j.notes.length?j.notes.join(' | '):null) : (j.error||('HTTP '+r.status));
    await apiLogWrite(source, action, r.ok, r.status, performance.now()-t0, recs, msg, j.notes?{notes:j.notes}:null);
    if(!r.ok) throw new Error(j.error||'Request failed');
    return j;
  }catch(e){
    await apiLogWrite(source, action, false, 0, performance.now()-t0, null, e.message);
    throw e;
  }
}

let TIKTOK_ORDERS=[], TIKTOK_CANCELLED=0;

/* ---- AD SPEND ------------------------------------------------------
   GMV Max spend is NOT available from the TikTok Shop API. Thirteen candidate
   endpoints were probed across two rounds: /ad/* and /ads/* are not routed at
   all (the gateway answers with an HTML 404), and every /analytics/* and
   /marketing/* ad path answers "Invalid path". The one analytics endpoint that
   DOES work — /analytics/202405/shop/performance — returns gmv, orders, buyers,
   units, impressions and page views, and no spend field anywhere in the payload.
   Shop Ads spend lives in the TikTok Business (Marketing) API, behind a separate
   app and approval.

   So ad spend comes from two places we actually control:
     1. Xero — GMV Max is billed to the card, so it lands as spend from TikTok.
        Automatic, and it is the real invoiced number.
     2. A manual monthly figure typed from Seller Center, as a fallback and for
        the current month before the bill arrives.
   API rows still win where they exist, so this all keeps working unchanged if
   TikTok ever opens the endpoint up. */
let AD_SPEND={};    // 'YYYY-MM-DD' -> spend, straight from the API (authoritative)
let AD_MANUAL={};   // 'YYYY-MM'    -> spend, typed by hand (persisted in tiki_state)

async function adSpendLoad(){
  try{
    const r=await tikiFetch('/rest/v1/tiktok_ad_spend?select=day,spend&order=day.desc&limit=800');
    if(!r.ok) return;
    AD_SPEND={};
    (await r.json()).forEach(x=>AD_SPEND[x.day]=Number(x.spend)||0);
    recomputePnlFromLive();   // ads land after the other loaders — recompute or the P&L misses them
  }catch(e){}
}

const AD_PAYEE=/tiktok|bytedance|tt ?ads|gmv ?max/i;
const isAdSpendTx = t => t.type&&t.type.startsWith('SPEND')&&t.status!=='DELETED'
  && AD_PAYEE.test((t.contact||'')+' '+(t.reference||''));

/* Ad bills cover a period, not the single day they were charged on, so each one
   is spread evenly from the day after the previous ad bill up to its own date.
   Capped at 31 days so a first-ever invoice can't smear across the whole year. */
function adSpendFromXero(){
  const out={};
  const txs=(XERO_TX||[]).filter(isAdSpendTx)
    .sort((a,b)=>String(a.tx_date).localeCompare(String(b.tx_date)));
  let prev=null;
  txs.forEach(t=>{
    const end=new Date(t.tx_date); if(isNaN(end)) return;
    const amt=Number(t.total)||0; if(!amt) return;
    let days=prev?Math.round((end-prev)/864e5):1;
    days=Math.max(1,Math.min(days,31));
    const per=amt/days;
    for(let i=0;i<days;i++){
      const d=new Date(end); d.setDate(d.getDate()-i);
      const iso=isoOf(d);
      out[iso]=(out[iso]||0)+per;
    }
    prev=end;
  });
  return out;
}

/* The effective daily ad spend: API first, then Xero, then a manual month
   figure spread across that month — never stacked, so nothing double counts. */
function adSpendEffective(){
  const xero=adSpendFromXero();
  const eff={...xero, ...AD_SPEND};       // API wins day-for-day
  const covered=new Set(Object.keys(eff).map(d=>d.slice(0,7)));
  Object.entries(AD_MANUAL).forEach(([mo,amt])=>{
    const total=Number(amt)||0;
    if(!total || covered.has(mo)) return;  // a real source already covers this month
    const [y,m]=mo.split('-').map(Number);
    const dim=new Date(y,m,0).getDate();
    for(let d=1;d<=dim;d++) eff[`${mo}-${String(d).padStart(2,'0')}`]=total/dim;
  });
  return eff;
}
function adSpendSource(){
  if(Object.keys(AD_SPEND).length) return 'TikTok API';
  if(Object.keys(adSpendFromXero()).length) return 'Xero (TikTok bills)';
  if(Object.values(AD_MANUAL).some(v=>Number(v)>0)) return 'Entered by hand';
  return 'none yet';
}
/* Spread a day's ad spend across that day's orders, so per-order margin is fair. */
function adPerOrder(){
  const perDay={};
  (TIKTOK_ORDERS||[]).forEach(o=>{ const d=(o.created_at||'').slice(0,10); if(d) perDay[d]=(perDay[d]||0)+1; });
  const out={};
  Object.entries(adSpendEffective()).forEach(([d,spend])=>{ if(perDay[d]) out[d]=spend/perDay[d]; });
  return out;
}
function adManualSet(mo, val){
  const v=Number(val)||0;
  if(v>0) AD_MANUAL[mo]=+v.toFixed(2); else delete AD_MANUAL[mo];

        c.stage=c.gmv>0?'Active Creator':'Content Live';

/* Performance-first ordering: videos+GMV at the top, showcase-only at the bottom. */
function creatorRank(list){
  return [...list].sort((a,b)=>{
    const aShow=a.showcaseOnly||(!a.videos&&!a.gmv), bShow=b.showcaseOnly||(!b.videos&&!b.gmv);
    if(aShow!==bShow) return aShow?1:-1;
    if((b.gmv||0)!==(a.gmv||0)) return (b.gmv||0)-(a.gmv||0);
    if((b.videos||0)!==(a.videos||0)) return (b.videos||0)-(a.videos||0);
    return (b.followers||0)-(a.followers||0);
  });
}

/* Rebuild the overheads organiser from Xero SPEND transactions, grouped by
   payee — the old manual bank-statement workflow, driven by the API.
   Exclude-toggles and frequency overrides survive by label. */
/* Manual expenses (things the bank feed can't know) and per-vendor overrides
   (one-off vs monthly, include/exclude). Both persist via tiki_state, so a
   Xero re-sync never wipes your decisions. */
let OVERHEAD_MANUAL=[];      // [{label,total,pays,freq,excl,manual:true}]
let OVERHEAD_RULES={};       // label -> {freq, excl}
function overheadRule(label){ return OVERHEAD_RULES[label]||{}; }
function setOverheadRule(label, patch){
  OVERHEAD_RULES[label]={...(OVERHEAD_RULES[label]||{}), ...patch};
  tikiPush();
}
function xeroBuildOverheads(){
  /* TikTok ad bills are deliberately excluded here: they are already deducted
     as ad spend above gross profit. Leaving them in would charge them twice. */
  const spend=XERO_TX.filter(t=>t.type&&t.type.startsWith('SPEND')&&t.status!=='DELETED'&&!isAdSpendTx(t));
  if(!spend.length) return;
  const keep=Object.fromEntries(PROFIT_VENDORS.map(v=>[v.label,v]));
  const groups={};
  spend.forEach(t=>{
    const label=(t.contact||t.reference||'Uncategorised').trim()||'Uncategorised';
    (groups[label]=groups[label]||[]).push(t);
  });
  const built=Object.entries(groups).map(([label,txs])=>{
    const total=txs.reduce((n,t)=>n+(Number(t.total)||0),0);
    const months=new Set(txs.map(t=>String(t.tx_date||'').slice(0,7))).size;
    const guess = txs.length>=3&&months>=3 ? 'monthly' : txs.length>=2&&months>=2 ? 'quarterly' : 'one-off';
    const rule=overheadRule(label);
    return { label, total:+total.toFixed(2), pays:txs.length, months,
      freq: rule.freq || keep[label]?.freq || guess,
      excl: rule.excl!==undefined ? rule.excl : (keep[label]?.excl||false), xero:true };
  }).sort((a,b)=>b.total-a.total);
  replaceArr(PROFIT_VENDORS, built.concat(OVERHEAD_MANUAL.map(m=>({...m,
    freq: overheadRule(m.label).freq || m.freq,
    excl: overheadRule(m.label).excl!==undefined ? overheadRule(m.label).excl : m.excl }))));
}
/* TikTok payouts per statement vs money that landed in the bank
   (Xero RECEIVE lines from TikTok/Stripe — Stripe = TikTok's payer). */
function payoutRows(){
  const by={};
  Object.values(TIKTOK_SETTLEMENTS).forEach(st=>{
    if(!st.statement_id) return;
    const b=(by[st.statement_id]=by[st.statement_id]||{ id:st.statement_id, date:st.settled_at, amount:0, orders:0 });
    b.amount+=Number(st.settlement_amount)||0; b.orders++;
  });
  const payouts=Object.values(by).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const receipts=XERO_TX.filter(t=>t.type==='RECEIVE'&&/tiktok|stripe|bytedance/i.test((t.contact||'')+' '+(t.reference||'')));
  payouts.forEach(p=>{
    p.match=receipts.find(r=>Math.abs((Number(r.total)||0)-p.amount)<0.05
      && Math.abs(new Date(r.tx_date)-new Date(p.date))<12*864e5)||null;
  });
  return payouts;
}

/* =====================================================================
   COST OF GOODS — batch by batch.
   Unit costs are stored EX-VAT. An order is costed with the most recent
   batch received on or before that order's date (matching batch product
   first, then any all-product batch).
   ===================================================================== */
/* Rebuild the P&L headline from live orders + real settlements + batch costs,
   so "are we making money" answers itself instead of sitting at zero. */
function recomputePnlFromLive(){
  /* Stock is independent of the P&L date window — you can hold stock in a period
     with no orders — so value it before the early return, not after. */
  const sc=stockCover();
  PNL.stock = sc.cost!=null ? sc.cost : cogsStockValue();
  PNL.stockUnits = sc.onHand;
  PNL.stockRetail = sc.retail;
  PNL.stockSource = sc.source;
  PNL.stockAsp = sc.asp;
  PNL.stockAspBasis = sc.aspBasis;
  if(!PROFIT_ORDERS.length) return;
  const L=CALC_LEV;
  const w=rangeWindow(state.profitRange||'Last 90 Days');
  const inWin=o=>{ if(!w.from) return true; const d=new Date(o.iso+'T12:00:00'); return d>=w.from&&d<w.to; };
  let gross=0, fees=0, settle=0, cogs=0, ads=0, costed=0;
  const apo=adPerOrder();
  const fb={ plat:0, aff:0, ship:0, fulfil:0, other:0, adj:0, revenue:0, settle:0, settledOrders:0 };
  PROFIT_ORDERS.filter(inWin).forEach(o=>{
    const st=TIKTOK_SETTLEMENTS[o.fullId];
    gross+=o.gross||0;
    const s = st?Number(st.settlement_amount)||0 : (o.set||0);
    settle+=s;
    if(st){
      fb.settledOrders++;
      fb.settle+=s;
      fb.revenue+=Number(st.revenue_amount)||0;
      fb.plat+=Number(st.fee_platform)||0;
      fb.aff+=Number(st.fee_affiliate)||0;
      fb.ship+=(Number(st.fee_shipping)||0);
      fb.fulfil+=(Number(st.fee_fulfilment)||0)+(Number(st.fee_transaction)||0);
      fb.other+=Number(st.fee_other)||0;
      fb.adj+=Number(st.adjustment)||0;
      fees+=(Number(st.fee_platform)||0)+(Number(st.fee_affiliate)||0)+(Number(st.fee_other)||0)+(Number(st.fee_transaction)||0);
    } else fees += Math.max((o.gross||0)-(o.disc||0)-s,0);
    const unitInc=cogsUnitInc(o.iso,o.productId);
    if(unitInc!=null){ cogs+=unitInc*(o.qty||1); costed++; }
    ads+=(apo[o.iso]||o.ad||0);
  });
  PNL.fb=fb;
  PNL.gross=gross; PNL.discounts=0; PNL.netSales=gross;
  PNL.fees=fees; PNL.settlement=settle; PNL.cogs=cogs; PNL.ads=ads;
  PNL.contribution=settle-cogs-ads;
  PNL.nOrders=PROFIT_ORDERS.filter(inWin).length;
  /* Stock ASSET is what's still on the shelf, not everything ever purchased —
     valued at the top of this function, above the early return. */
  PNL.costedOrders=costed;
  const ds=PROFIT_ORDERS.filter(inWin).map(o=>o.iso).filter(Boolean).sort();
  PNL.period=ds.length?`${fmtDate(ds[0])} – ${fmtDate(ds[ds.length-1])}`:'No data yet';
  PNL.months=ds.length?Math.max(1,Math.round((new Date(ds[ds.length-1])-new Date(ds[0]))/2.63e9*10)/10):0;
  /* Keep the KPI tiles honest too. */
  const k=BRAND_KPIS[defaultBrand()];
  if(k){ k.gmv=Math.round(gross); k.net=Math.round(PNL.contribution); }
}
let COGS_BATCHES=[];
let TIKTOK_SETTLEMENTS={};

async function cogsLoad(){
  try{
    const r=await tikiFetch('/rest/v1/cogs_batches?select=*&order=received_date.desc');
    if(r.ok) COGS_BATCHES=await r.json();

  }catch(e){}
}
async function settlementsLoad(){

    TIKTOK_SETTLEMENTS={};

    recomputePnlFromLive();
  }catch(e){}

/* Ex-VAT unit cost in force for a given date + product. */
function cogsUnitFor(dateIso, productId){
  if(!COGS_BATCHES.length) return null;
  const d=dateIso||TODAY_ISO;
  const eligible=COGS_BATCHES.filter(b=>b.received_date<=d);
  const pool=eligible.filter(b=>b.product_id&&b.product_id===productId);
  const chosen=(pool.length?pool:eligible.filter(b=>!b.product_id));
  const list=chosen.length?chosen:eligible;
  if(!list.length) return null;
  return list.reduce((best,b)=>(!best||b.received_date>best.received_date)?b:best,null)?.unit_cost ?? null;
}
const cogsCurrent = pid => cogsUnitFor(TODAY_ISO, pid);
function cogsWeightedAvg(){
  const q=COGS_BATCHES.reduce((n,b)=>n+(+b.qty||0),0);
  if(!q) return null;
  return COGS_BATCHES.reduce((n,b)=>n+(+b.qty||0)*(+b.unit_cost||0),0)/q;
}
const vatMult = () => 1 + (CALC_LEV.vat||0)/100;
/* Landed cost per unit, VAT included — the figure that hits the P&L. */
const cogsUnitInc = (dateIso, productId) => { const u=cogsUnitFor(dateIso,productId); return u==null?null:u*vatMult(); };
/* Total spent on stock, VAT included (batches are entered ex VAT). */
const cogsStockValue = () => COGS_BATCHES.reduce((n,b)=>n+(+b.qty||0)*(+b.unit_cost||0),0) * vatMult();
const cogsStockValueEx = () => COGS_BATCHES.reduce((n,b)=>n+(+b.qty||0)*(+b.unit_cost||0),0);

function profitCogs(){
  const cur=cogsCurrent(), avg=cogsWeightedAvg(), vat=CALC_LEV.vat;
  const totalUnits=COGS_BATCHES.reduce((n,b)=>n+(+b.qty||0),0);
  const stat=(l,v,s)=>`<div class="mini-stat"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

/* Stock position across channels, valued two ways. Cost is the accounting
   figure; retail is the planning figure. Keeping them side by side stops the
   nice big retail number from quietly becoming a balance-sheet asset. */
function stockCard(){
  const s=stockCover();
  const chan=(name, units, note, live)=>`
    <tr>
      <td class="main-cell"><div class="t">${name}</div><div class="s">${note}</div></td>
      <td class="num" style="font-weight:${live?'700':'400'};color:${live?'inherit':'var(--ink-3)'}">${units!=null?units.toLocaleString():'—'}</td>
      <td class="num" style="color:var(--ink-3)">${units!=null&&s.asp!=null?m2(units*s.asp):'—'}</td>
      <td>${live?'<span class="badge bg-good">● Live</span>':'<span class="badge bg-neutral">○ Not connected</span>'}</td>
    </tr>`;
  return `
    <div class="card" style="margin-top:16px">
      <div class="card-h">
        <div><div class="t">Stock position</div>
          <div class="sub">${s.source==='live'?'Live warehouse levels from TikTok':s.source==='derived'?'Estimated from batches — sync TikTok for real levels':'No stock data yet'}</div></div>
        <div class="right">${s.days!=null
          ? `<span class="badge ${s.days<21?'bg-crit':s.days<42?'bg-warn':'bg-good'}">${s.days} days of cover</span>`
          : ''}</div>
      </div>
      <div class="card-b flush tbl-wrap">
        <table class="tbl"><thead><tr>
          <th>Channel</th><th class="num">Units on hand</th><th class="num">Retail value</th><th>Feed</th>
        </tr></thead><tbody>
          ${chan('TikTok Shop', s.tiktok, s.tiktok!=null?'warehouse inventory, all SKUs':'sync to read stock levels', s.tiktok!=null)}
          ${chan('Shopify', s.shopify, 'connect the API or webhook to include DTC stock', false)}
          <tr style="background:var(--bg-2)">
            <td style="font-weight:700">Total on hand</td>
            <td class="num" style="font-weight:800">${s.onHand!=null?s.onHand.toLocaleString():'—'}</td>
            <td class="num" style="font-weight:800">${s.retail!=null?m2(s.retail):'—'}</td>
            <td></td>
          </tr>
        </tbody></table>
      </div>
      <div class="card-b" style="padding-top:0">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
          <div class="mini-stat"><div class="l">Average selling price</div><div class="v">${s.asp!=null?m2(s.asp):'—'}</div><div class="s">${esc(s.aspBasis)}</div></div>
          <div class="mini-stat"><div class="l">Retail value</div><div class="v">${s.retail!=null?m2(s.retail):'—'}</div><div class="s">if every unit sells at that price</div></div>
          <div class="mini-stat"><div class="l">Cost value (the asset)</div><div class="v">${s.cost!=null?m2(s.cost):'—'}</div><div class="s">${s.unitCost!=null?`${m2(s.unitCost)}/unit inc VAT`:'add a cost batch'}</div></div>
          <div class="mini-stat"><div class="l">Sell-through</div><div class="v">${s.perDay>0?s.perDay.toFixed(1)+'/day':'—'}</div><div class="s">last 14 days</div></div>
        </div>
        ${s.drift!=null&&Math.abs(s.drift)>=5?`
        <div style="background:var(--warn-soft);border:1px solid #f3e2c0;border-radius:11px;padding:11px 14px;
          font-size:.78rem;color:var(--warn-ink);line-height:1.55;margin-top:12px">
          <b>TikTok says ${Math.abs(s.drift).toLocaleString()} units ${s.drift>0?'more':'fewer'} than your batches imply.</b>
          Batches say ${(s.bought-s.sold).toLocaleString()} should be left, TikTok reports ${s.tiktok.toLocaleString()}.
          Usually samples, returns or a delivery that was never entered as a batch — worth a look, because it also
          shifts your COGS.</div>`:''}
        <div style="font-size:.75rem;color:var(--ink-3);line-height:1.6;margin-top:12px">
          Retail value is what the stock is worth <b>if it all sells</b> at the current average price — useful for planning,
          but it is not what goes on the balance sheet. Inventory is carried at <b>cost</b>, which is the figure used as the
          stock asset in the P&L. The average price comes from real orders, so discounts and promotions are already in it.
        </div>
      </div>
    </div>`;
}

/* Advertising spend. Sits with cost of goods because it is the other number the
   API cannot tell us and you have to supply — see the AD SPEND note above for
   why GMV Max isn't fetchable. Auto-filled from Xero the moment TikTok's bill is
   reconciled; the hand-typed figure is only used for months Xero hasn't covered. */
function adSpendCard(){
  const xero=adSpendFromXero(), eff=adSpendEffective(), src=adSpendSource();
  const months=[];
  for(let i=0;i<6;i++){
    const d=new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  const sumFor=(obj,mo)=>Object.entries(obj).reduce((n,[d,v])=>n+(d.slice(0,7)===mo?v:0),0);
  const total=Object.values(eff).reduce((n,v)=>n+v,0);
  const badge = src==='none yet'
    ? `<span class="badge bg-warn">● No ad spend recorded</span>`
    : `<span class="badge bg-good">● ${esc(src)}</span>`;
  return `
    <div class="card" style="margin-top:16px">
      <div class="card-h">
        <div><div class="t">Advertising spend (GMV Max)</div>
          <div class="sub">Deducted above gross profit, spread across each day's orders</div></div>
        <div class="right">${badge}</div>
      </div>
      <div class="card-b flush tbl-wrap">
        <table class="tbl"><thead><tr>
          <th>Month</th><th class="num">From Xero</th><th class="num">Typed by hand</th>
          <th class="num">Used in the P&L</th><th>Source</th>
        </tr></thead><tbody>
        ${months.map(mo=>{
          const x=sumFor(xero,mo), man=Number(AD_MANUAL[mo])||0, used=sumFor(eff,mo);
          const label=new Date(mo+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
          const from = x>0.005 ? 'Xero bill' : man>0 ? 'Typed in' : '—';
          return `<tr>
            <td class="main-cell"><div class="t">${label}</div></td>
            <td class="num" style="color:var(--ink-3)">${x>0.005?m2(x):'—'}</td>
            <td class="num"><input class="inp" style="width:110px;text-align:right;padding:5px 8px"
              type="number" step="0.01" min="0" placeholder="0.00"
              value="${man||''}" onchange="adManualSet('${mo}', this.value)"></td>
            <td class="num" style="font-weight:700">${used>0.005?m2(used):'—'}</td>
            <td style="font-size:.78rem;color:var(--ink-2)">${from}</td>
          </tr>`;
        }).join('')}
        <tr style="background:var(--bg-2)"><td style="font-weight:700">Total (all time)</td>
          <td class="num">—</td><td class="num">—</td>
          <td class="num" style="font-weight:800">${m2(total)}</td><td></td></tr>
        </tbody></table>
      </div>
      <div class="card-b" style="font-size:.75rem;color:var(--ink-3);line-height:1.6;padding-top:0">
        TikTok's Shop API does not expose GMV Max spend — every ads endpoint was probed and none exist on the
        seller surface. So it comes from your Xero bills automatically, and anything Xero hasn't billed yet you can
        type from <b>Seller Center → Marketing → Shop Ads</b>. A month with a real Xero bill ignores the typed figure,
        so the two can never double count, and TikTok ad bills are kept out of the overheads list for the same reason.
      </div>
    </div>`;
}

function cogsEdit(id){
  const b=COGS_BATCHES.find(x=>x.id===id)||null;
  openModal(modalShell(b?'Edit cost batch':'Add cost batch',`
    <div class="form-grid">
      <div class="field"><label>Date received</label><input id="cbDate" type="date" value="${b?b.received_date:TODAY_ISO}"></div>
      <div class="field"><label>Batch name</label><input id="cbLabel" value="${b?esc(b.label||''):''}" placeholder="e.g. March run"></div>
      <div class="field"><label>Units received</label><input id="cbQty" type="number" min="0" value="${b?(+b.qty||0):''}" placeholder="e.g. 2000"></div>
      <div class="field"><label>Cost per unit (£, ex VAT)</label><input id="cbCost" type="number" step="0.01" min="0" value="${b?(+b.unit_cost||0):''}" placeholder="6.09"></div>
      <div class="field"><label>Applies to</label>
        <select id="cbProduct"><option value="">All products</option>
          ${PRODUCTS.map(p=>`<option value="${esc(p.id)}" ${b&&b.product_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label>Supplier</label><input id="cbSupplier" value="${b?esc(b.supplier||''):''}" placeholder="Optional"></div>
      <div class="field full"><label>Notes</label><input id="cbNotes" value="${b?esc(b.notes||''):''}" placeholder="Optional — MOQ, shipping terms, anything worth remembering"></div>
    </div>
    <div style="font-size:.76rem;color:var(--ink-3);line-height:1.55;margin-top:10px">
      Orders placed on or after this date will use this cost, unless a later batch overrides it.</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="cogsSave(${b?`'${b.id}'`:'null'})">${b?'Save changes':'Add batch'}</button>`));
}
async function cogsSave(id){
  const cost=parseFloat($('cbCost').value);
  if(!(cost>=0)||isNaN(cost)) return toast('Enter a cost per unit');
  const sel=$('cbProduct'), pid=sel.value||null;
  const row={ received_date:$('cbDate').value||TODAY_ISO, label:$('cbLabel').value.trim()||null,
    qty:parseInt($('cbQty').value)||0, unit_cost:cost, product_id:pid,
    product_name:pid?sel.options[sel.selectedIndex].text:null,
    supplier:$('cbSupplier').value.trim()||null, notes:$('cbNotes').value.trim()||null };
  try{
    const r=id
      ? await tikiFetch(`/rest/v1/cogs_batches?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(row)})
      : await tikiFetch('/rest/v1/cogs_batches',{method:'POST',body:JSON.stringify(row)});
    if(!r.ok) throw new Error('Could not save');
    await cogsLoad(); closeModal(); toast(id?'Batch updated':'Batch added'); recomputePnlFromLive(); rerenderAll();
  }catch(e){ toast(e.message||'Could not save the batch'); }
}
async function cogsDelete(id){
  const b=COGS_BATCHES.find(x=>x.id===id);
  if(!confirm(`Delete ${b&&b.label?`"${b.label}"`:'this batch'}? Orders will recost using the previous batch.`)) return;
  try{
    const r=await tikiFetch(`/rest/v1/cogs_batches?id=eq.${id}`,{method:'DELETE'});
    if(!r.ok) throw new Error('Could not delete');
    await cogsLoad(); toast('Batch deleted'); recomputePnlFromLive(); rerenderAll();
  }catch(e){ toast(e.message||'Could not delete'); }
}

/* ---- P&L (ACTUALS) ---- */
function profitPnl(){
  const _gap=cogsGapNote();
  const a=pnlActive();
  const fb=PNL.fb;
  const unsettledEst = fb ? Math.max(0, PNL.settlement - fb.settle) : 0;
  const wf= fb&&fb.settledOrders ? [
    ['Revenue (settled orders, incl. customer shipping)', fb.revenue, 'in'],
    ['Platform commission', -fb.plat, 'ded'],
    ['Affiliate commissions', -fb.aff, 'ded'],
    ['Shipping (seller-borne)', -fb.ship, 'ded'],
    ...(fb.fulfil>0.005?[['Fulfilment & transaction', -fb.fulfil, 'ded']]:[]),
    ['Other TikTok fees', -fb.other, 'ded'],
    ['Adjustments', fb.adj, fb.adj>=0?'in':'ded'],
    ['Settlement — paid out', fb.settle, 'sub'],
    ...(unsettledEst>0.005?[[`Awaiting settlement (${PNL.nOrders-fb.settledOrders} orders, est.)`, unsettledEst, 'in']]:[]),
    ['Total payout (paid + pending)', PNL.settlement, 'sub'],
    [`COGS (${m2(cogsUnitInc(TODAY_ISO,null)||0)}/unit inc VAT)`, -PNL.cogs, 'ded'],
    [`Per-order ad spend${PNL.ads?'':' — none recorded yet'}`, -PNL.ads, 'ded'],
    ['Gross profit', PNL.contribution, 'sub'],
    ['Monthlies & recurring', -a.mon, 'ded'],
    ['One-off costs', -a.one, 'ded'],
    ['Operating profit', a.op, 'total']
  ] : [
    ['Gross sales', PNL.gross, 'in'],
    ['Seller discounts', -PNL.discounts, 'ded'],
    ['Net sales', PNL.netSales, 'sub'],
    ['Platform fees', -PNL.fees, 'ded'],
    ['Settlement (payout)', PNL.settlement, 'sub'],
    [`COGS (${m2(cogsUnitInc(TODAY_ISO,null)||CALC_LEV.cost*vatMult())}/unit inc VAT)`, -PNL.cogs, 'ded'],
    [`Per-order ad spend${PNL.ads?'':' — none recorded yet'}`, -PNL.ads, 'ded'],
    ['Gross profit', PNL.contribution, 'sub'],
    ['Monthlies & recurring', -a.mon, 'ded'],
    ['One-off costs', -a.one, 'ded'],
    ['Operating profit', a.op, 'total']
  ];
  const maxAbs=Math.max(PNL.gross, (PNL.fb&&PNL.fb.revenue)||0);
  const wfRow=([l,v,t])=>{
    const w=Math.abs(v)/maxAbs*100;
    const col = t==='in'?'var(--accent)': t==='ded'?'var(--serious)': t==='total'?(v>=0?'var(--good)':'var(--crit)'):'#98a2b3';
    return `<div class="wf-row ${t==='total'?'total':''}"><span class="wl">${l}</span>
      <div class="wbar"><div style="left:0;width:${w}%;background:${col};opacity:${t==='sub'?.45:.9}"></div></div>
      <span class="wv ${v<0?'neg':t==='total'&&v>=0?'pos':''}">${m2(v)}</span></div>`;
  };
  const donutSegs=[
    ['Platform fees',PNL.fees,'#2a78d6'],['COGS',PNL.cogs,'#eb6834'],['Ad spend',PNL.ads,'#1baf7a'],
    ['Monthlies',a.mon,'#eda100'],['One-offs',a.one,'#e87ba4']
  ].filter(s=>s[1]>0);
  const orgGroup=(title,freqTest,note)=>{
    const rows=PROFIT_VENDORS.filter(v=>freqTest(v.freq));
    const tot=rows.filter(v=>!v.excl).reduce((s,v)=>s+v.total,0);
    return `<div class="card">
      <div class="card-h"><div><div class="t">${title}</div><div class="sub">${note}</div></div>
        <div class="right"><span style="font-weight:800">${m2(tot)}</span>
        <button class="btn btn-ghost btn-xs" onclick="orgAll(${freqTest===isOneOff},true)">Count all</button>
        <button class="btn btn-ghost btn-xs" onclick="orgAll(${freqTest===isOneOff},false)">Exclude all</button></div></div>
      <div class="card-b flush">
        ${rows.map(v=>{const i=PROFIT_VENDORS.indexOf(v);return `
        <div class="org-row ${v.excl?'off':''}">
          <label class="switch"><input type="checkbox" ${v.excl?'':'checked'} onchange="orgToggle(${i})"><span class="sl"></span></label>
          <span class="ol">${esc(v.label)}${v.manual?' <span class="badge bg-neutral" style="font-size:.58rem">manual</span>':''}</span>
          <span class="op">${v.pays} payment${v.pays>1?'s':''}</span>
          <select onchange="orgFreq(${i},this.value)">
            ${['one-off','monthly','quarterly','yearly'].map(f=>`<option ${v.freq===f?'selected':''}>${f}</option>`).join('')}
          </select>
          <span class="ov">${m2(v.total)}</span>
          ${v.manual?`<button class="btn btn-ghost btn-xs" style="color:var(--crit-ink)" onclick="orgDeleteManual('${esc(v.label).replace(/'/g,"\\'")}')">✕</button>`:''}
        </div>`;}).join('')||`<div style="padding:22px 18px;font-size:.8rem;color:var(--ink-3);line-height:1.55">
          Nothing here yet. ${XERO_STATUS&&XERO_STATUS.tenant_id?'Sync Xero to pull your bank spend, or':'Connect Xero to pull your bank spend, or'}
          <button class="link-btn" onclick="orgAddManual()">add one manually</button>.</div>`}
      </div></div>`;
  };
  return `
    ${_gap}
    <div class="card" style="border-left:3px solid ${a.op>=0?'var(--good)':'var(--crit)'};margin-bottom:16px">
      <div class="card-b" style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
        <div><div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)">Operating profit (actuals)</div>
          <div style="font-size:2rem;font-weight:800;letter-spacing:-.02em" class="${a.op<0?'neg':'pos'}">${m2(a.op)}</div>
          <div style="font-size:.74rem;color:var(--ink-3)">P&L = every bank line, one-offs included · organiser toggles below never affect the Calculator</div></div>
        <div class="divider-v"></div>
        <div class="mini-stat"><div class="l">Gross profit</div><div class="v ${PNL.contribution<0?'neg':'pos'}">${m2(PNL.contribution)}</div><div class="s">after TikTok fees, ads &amp; COGS — before overheads</div></div>
        <div class="mini-stat"><div class="l">Director loans (funding)</div><div class="v">${m2(PNL.loansTotal)}</div><div class="s">${PNL.loans.map(l=>l[0]+' '+money(l[1])).join(' · ')||'none recorded'}</div></div>
        <div class="mini-stat"><div class="l">Stock on hand (asset, at cost)</div><div class="v">${m2(PNL.stock)}</div><div class="s">${PNL.stockUnits!=null&&cogsUnitInc(TODAY_ISO,null)!=null
          ? `${PNL.stockUnits.toLocaleString()} units × ${m2(cogsUnitInc(TODAY_ISO,null))} inc VAT · ${PNL.stockSource==='live'?'live TikTok stock':'estimated from batches'}`
          : 'add a cost batch to value your stock'}</div></div>
        <div class="mini-stat"><div class="l">Stock retail value</div><div class="v">${PNL.stockRetail!=null?m2(PNL.stockRetail):'—'}</div><div class="s">${PNL.stockRetail!=null
          ? `${PNL.stockUnits.toLocaleString()} units × ${m2(PNL.stockAsp)} ${esc(PNL.stockAspBasis)} — what it's worth if it all sells, not a balance-sheet figure`
          : 'needs live stock and recent sales'}</div></div>
      </div>
    </div>
    <div class="grid g-23" style="margin-bottom:16px">
      <div class="card"><div class="card-h"><div class="t">P&L Waterfall</div><div class="sub">Sales → fees → COGS → ads → overheads</div></div>
        <div class="card-b">${wf.map(wfRow).join('')}</div></div>
      <div class="card"><div class="card-h"><div class="t">Cost Breakdown</div><div class="sub">Where the money goes</div></div>
        <div class="card-b"><div class="donut-wrap">
          <div>${donutSvg(donutSegs,150)}</div>
          <div class="donut-legend" style="flex:1">
            ${donutSegs.map(s=>`<div class="dl"><span class="sw" style="background:${s[2]}"></span>${s[0]}<span class="dv">${m2(s[1])}</span></div>`).join('')}
            <div class="dl" style="border-top:1px solid var(--line-2);padding-top:7px;font-weight:800">Total costs<span class="dv">${m2(donutSegs.reduce((s,x)=>s+x[1],0))}</span></div>
          </div>
        </div></div></div>
    </div>
    <div class="grid g-2" style="margin-bottom:16px">
      <div class="card"><div class="card-h"><div class="t">Net Sales by Month</div></div>
        <div class="card-b"><div class="chart-box sm" id="pfSalesChart"></div></div></div>
      <div class="card"><div class="card-h"><div class="t">Net Result by Month</div><div class="sub">One-offs land where they were paid</div></div>

function donutSvg(segs,size){
  const tot=segs.reduce((s,x)=>s+x[1],0), r=size/2-10, cx=size/2, cy=size/2, sw=20;
  if(!tot) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${sw}"/>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:13px;font-weight:800;fill:var(--ink-3)">£0.00</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" style="font-size:9px;fill:#898781;font-weight:600">NO COSTS YET</text></svg>`;
  let a0=-Math.PI/2, out='';
  segs.forEach(s=>{
    const frac=s[1]/tot, a1=a0+frac*2*Math.PI;
    const gap=0.03;
    const x0=cx+r*Math.cos(a0+gap), y0=cy+r*Math.sin(a0+gap);
    const x1=cx+r*Math.cos(a1-gap), y1=cy+r*Math.sin(a1-gap);
    const large=(a1-a0)>Math.PI?1:0;
    out+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${s[2]}" stroke-width="${sw}" stroke-linecap="butt"><title>${s[0]}: ${m2(s[1])}</title></path>`;
    a0=a1;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:15px;font-weight:800;fill:var(--ink)">${money(tot)}</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" style="font-size:9px;fill:#898781;font-weight:600">TOTAL COSTS</text></svg>`;
}

function drawSignedBarChart(id, labels, data){
  const box=$(id); if(!box) return;
  if(!labels.length || !data.length){
    box.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--ink-3)">No data for this period yet</div>`;
    return;
  }
  const W=680,H=190,padL=44,padR=10,padT=10,padB=24;
  const maxV=niceMax(Math.max(...data.map(Math.abs))*1.1);
  const slot=(W-padL-padR)/labels.length, bw=slot*0.55;
  const y=v=>padT+(H-padT-padB)*(1-(v+maxV)/(2*maxV));
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">`;
  [-maxV,-maxV/2,0,maxV/2,maxV].forEach(t=>{ svg+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="${t===0?'#c3c2b7':'#e1e0d9'}" stroke-width="1"/>`; });
  data.forEach((v,i)=>{
    const cx=padL+slot*i+(slot-bw)/2;
    const y0=y(0), y1=y(v);
    svg+=`<rect x="${cx}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(Math.abs(y0-y1),1.5)}" rx="3" fill="${v>=0?'#0ca30c':'#d03b3b'}"><title>${labels[i]}: ${m2(v)}</title></rect>`;
  });
  svg+='</svg>';
  const ticks=[-maxV,0,maxV].map(t=>`<span style="position:absolute;left:0;top:${(y(t)/H*100)}%;transform:translateY(-50%);font-size:.62rem;color:#898781">£${(t/1000).toFixed(1)}k</span>`).join('');
  const labs=labels.map((l,i)=>`<span style="position:absolute;left:${((padL+slot*i+slot/2)/W*100)}%;bottom:0;transform:translateX(-50%);font-size:.62rem;color:#898781">${l}</span>`).join('');
  box.innerHTML=`<div style="position:absolute;inset:0">${svg}${ticks}${labs}</div>`;
}

/* ---- folders ---------------------------------------------------------
   Folders are a flat list and a brief carries its folder id, rather than
   folders owning arrays of briefs. That way a brief can never end up in two
   places, and deleting a folder can't take briefs down with it. */
function newBriefFolder(){
  const name=prompt('Folder name','New folder');
  if(name===null) return;
  BRIEF_FOLDERS.push({ id:'fd'+Date.now()%1000000, name:name.trim()||'New folder' });
  tikiPush(); renderBriefs(); toast('Folder created');
}
function renameBriefFolder(id){
  const f=BRIEF_FOLDERS.find(x=>x.id===id); if(!f) return;
  const name=prompt('Folder name', f.name);
  if(name===null) return;
  f.name=name.trim()||f.name; tikiPush(); renderBriefs();
}
function deleteBriefFolder(id){
  const f=BRIEF_FOLDERS.find(x=>x.id===id); if(!f) return;
  const n=BRIEFS.filter(b=>b.folder===id).length;
  if(!confirm(n?`Delete “${f.name}”? The ${n} brief${n===1?'':'s'} inside will move back to All briefs — nothing is lost.`
                :`Delete the folder “${f.name}”?`)) return;
  BRIEFS.forEach(b=>{ if(b.folder===id) b.folder=null; });   // never delete work with the container
  BRIEF_FOLDERS.splice(BRIEF_FOLDERS.indexOf(f),1);
  if(state.briefFolder===id) state.briefFolder=null;
  tikiPush(); renderBriefs(); toast('Folder deleted — briefs kept');
}
function openBriefFolder(id){ state.briefFolder=id||null; renderBriefs(); }
function deleteBrief(id){
  const b=briefById(id); if(!b) return;
  if(!confirm(`Delete “${b.name}”? This can't be undone from here.`)) return;
  BRIEFS.splice(BRIEFS.indexOf(b),1);
  tikiPush(); renderBriefs(); toast('Brief deleted');
}
/* Drag and drop between folders. */
function brfDragStart(ev,id){
  ev.dataTransfer.setData('text/plain',id);
  ev.dataTransfer.effectAllowed='move';
  ev.currentTarget.classList.add('dragging');
}
function brfDragEnd(ev){ ev.currentTarget.classList.remove('dragging'); }
function brfFolderOver(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; ev.currentTarget.classList.add('drop-on'); }
function brfFolderLeave(ev){ ev.currentTarget.classList.remove('drop-on'); }
function brfDropInto(ev,folderId){
  ev.preventDefault(); ev.currentTarget.classList.remove('drop-on');
  const id=ev.dataTransfer.getData('text/plain');
  const b=briefById(id); if(!b) return;
  b.folder=folderId||null;
  tikiPush(); renderBriefs();
  const f=folderId?BRIEF_FOLDERS.find(x=>x.id===folderId):null;
  toast(f?`Moved to ${f.name}`:'Moved out of the folder');
}
