/* ---- state collect / apply ---- */
function collectTikiState(){
  /* v4 adds the team and brand lists so invites and new brands reach every device.
     v5 adds brief page colours and embedded photos (both nested inside briefs). */
  /* v7 adds the brief shelf — videos parked from the Videos page for reuse in briefs. */
  /* v8 adds outreach campaigns (the four-step wizard config). */
  return { v:8, campaigns:CAMPAIGNS, briefShelf:BRIEF_SHELF, map:MAP_GRAPH, tasks:state.tasks, creators:CREATORS, retainers:RETAINERS, courses:COURSES, briefs:BRIEFS,
    flows:OUTREACH_FLOWS, personal:PERSONAL_OUTREACH, samples:SAMPLE_REQS, chats:CHATS,
    notifs:state.notifs, learnings:AI.learnings, aiChat:AI.msgs.slice(-60), calcLev:CALC_LEV, profitVendors:PROFIT_VENDORS,
    users:USERS, brands:BRANDS, products:PRODUCTS, bank:PROFIT_BANK, orders:PROFIT_ORDERS,
    overheadManual:OVERHEAD_MANUAL, overheadRules:OVERHEAD_RULES, adManual:AD_MANUAL,
    briefFolders:BRIEF_FOLDERS,
    vaultBlob:TIKI_VAULT.blob };
}
function replaceArr(target, src){ if(Array.isArray(src)){ target.length=0; src.forEach(x=>target.push(x)); } }
function applyTikiState(d){
  if(!d) return;
  if(Array.isArray(d.tasks)) state.tasks=d.tasks;
  replaceArr(BRIEF_SHELF,d.briefShelf); replaceArr(CAMPAIGNS,d.campaigns);
  replaceArr(CREATORS,d.creators); replaceArr(RETAINERS,d.retainers); replaceArr(COURSES,d.courses);
  replaceArr(BRIEFS,d.briefs); replaceArr(OUTREACH_FLOWS,d.flows); replaceArr(SAMPLE_REQS,d.samples);
  replaceArr(CHATS,d.chats); replaceArr(PROFIT_VENDORS,d.profitVendors);
  if(Array.isArray(d.personal)) PERSONAL_OUTREACH=d.personal;
  if(Array.isArray(d.notifs)) state.notifs=d.notifs;
  if(Array.isArray(d.learnings)) replaceArr(AI.learnings,d.learnings);
  if(d.calcLev) Object.assign(CALC_LEV,d.calcLev);
  if(d.vaultBlob) TIKI_VAULT.blob=d.vaultBlob;
  if(d.map && Array.isArray(d.map.nodes) && Array.isArray(d.map.links)){ MAP_GRAPH.nodes=d.map.nodes; MAP_GRAPH.links=d.map.links; }
  replaceArr(PRODUCTS,d.products); replaceArr(PROFIT_BANK,d.bank); replaceArr(PROFIT_ORDERS,d.orders);
  /* Team and brands are objects, not arrays — merge in place so the constants stay live. */
  if(d.users && Object.keys(d.users).length){ Object.keys(USERS).forEach(k=>delete USERS[k]); Object.assign(USERS,d.users); }
  if(Array.isArray(d.aiChat)) AI.msgs=d.aiChat;
  if(Array.isArray(d.overheadManual)) OVERHEAD_MANUAL=d.overheadManual;
  if(d.overheadRules&&typeof d.overheadRules==='object') OVERHEAD_RULES=d.overheadRules;
  if(d.adManual&&typeof d.adManual==='object') AD_MANUAL=d.adManual;
  replaceArr(BRIEF_FOLDERS,d.briefFolders);
  if(d.brands && Object.keys(d.brands).length){
    Object.keys(BRANDS).forEach(k=>delete BRANDS[k]); Object.assign(BRANDS,d.brands);
    if(!BRANDS[state.brand] && state.brand!=='all') state.brand=defaultBrand();
  }
}
function tikiDirty(){ /* autosave loop picks changes up */ }
async function tikiPull(){
  const r=await tikiFetch('/rest/v1/tiki_state?key=eq.app&select=value');
  if(!r.ok) throw new Error('load failed');
  const rows=await r.json();
  if(rows.length){ applyTikiState(rows[0].value); tikiLastPushed=JSON.stringify(collectTikiState()); }
  else tikiLastPushed='';   // first run — seed data will be pushed
}
let TIKI_LOADED=false;   // no successful pull yet -> pushing would destroy data
async function tikiPush(){
  if(tikiSaving) return;
  if(!TIKI_LOADED) return;   // the guard that stops a failed load becoming a wipe
  const s=JSON.stringify(collectTikiState());
  if(s===tikiLastPushed) return;
  tikiSaving=true; syncStatus('saving','Saving…');
  try{
    const r=await tikiFetch('/rest/v1/tiki_state?on_conflict=key',{ method:'POST',
      headers:{ Prefer:'resolution=merge-duplicates' },
      body:JSON.stringify({ key:'app', value:JSON.parse(s), updated_at:new Date().toISOString() }) });
    if(r.ok){ tikiLastPushed=s; syncStatus('', 'Synced · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})); }
    else syncStatus('error','Save failed — retrying');
  } catch(e){ syncStatus('error','Offline — will retry'); }
  tikiSaving=false;
}
async function tikiEnter(inviteType){
  $('gate').classList.add('hidden');
  syncStatus('saving','Loading…');
  /* A failed load must NEVER be followed by a save.
     Previously a network hiccup on tikiPull left the app holding its empty
     in-memory defaults, and the 4-second autosave then wrote that emptiness
     straight over the good server copy — silently destroying work. Saving is
     now gated on having actually loaded first. */
  try{ await tikiPull(); TIKI_LOADED=true; syncStatus('', 'Synced · '+tikiSession.email.split('@')[0]); }
  catch(e){
    TIKI_LOADED=false;
    syncStatus('error','Could not load — not saving');
    openModal(modalShell('Couldn’t load your workspace',`
      <p style="font-size:.86rem;color:var(--ink-2);line-height:1.6">
        Your data is safe on the server, but this device couldn’t read it just now.
        <b>Saving is switched off</b> until it loads, so nothing here can overwrite it.</p>
      <p style="font-size:.8rem;color:var(--ink-3);line-height:1.55;margin-top:10px">
        Reload the page to try again. If it keeps failing, check your connection before making any edits.</p>`,
      `<button class="btn btn-primary" onclick="location.reload()">Reload</button>`));
  }
  resolveMe();
  await tiktokLoadStatus(); await xeroLoadStatus();
  await cogsLoad();
  if(TIKTOK_STATUS&&TIKTOK_STATUS.shop_id){ await tiktokLoadData(); await settlementsLoad(); await creatorsLoad(); await videosLoad(); await adSpendLoad(); }
  if(XERO_STATUS&&XERO_STATUS.tenant_id) await xeroLoadData();
  rerenderAll(); renderNotifs();
  navTo('overview');
  setInterval(tikiPush, 4000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') tikiPush(); });
  /* Profile completion is mandatory for everyone — invited users also set a password. */
  if(inviteType || !USERS[ME]?.onboarded) openOnboarding(!!inviteType);
}

async function init(){
  renderBrandUI(); renderNewMenu(); renderSidebar(); renderNotifs();
  navTo('overview');
  /* A shared brief is a public page: no session, no gate, nothing loaded from
     the workspace. Handled before auth so a creator is never asked to sign in. */
  const shared=new URLSearchParams(location.search).get('b');
  if(shared){ await tikiOpenSharedBrief(shared); return; }
  tiktokCatchReturn();
  const invite=tikiParseInviteHash();
  if(invite){ await tikiEnter(invite.type); return; }
  tikiLoadSession();
  if(tikiSession && (Date.now()<tikiSession.exp || await tikiRefreshToken())){ await tikiEnter(); }
  else { $('gate').classList.remove('hidden'); setTimeout(()=>$('gateEmail').focus(),100); }
}
