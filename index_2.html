<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiki — TikTok Operations Hub</title>
<!-- V1.1 · Apple-inspired UI · system SF typography, no external fonts — fully offline -->
<!-- Charts are hand-rolled SVG — no external chart library needed -->
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#f7f7f9;
  --ink:#1d1d1f;
  --ink-2:#56565c;
  --ink-3:#86868b;
  --line:rgba(0,0,0,.09);
  --line-2:rgba(0,0,0,.055);
  --accent:#0071e3;
  --accent-ink:#0066cc;
  --accent-soft:rgba(0,113,227,.10);
  --sidebar-bg:rgba(243,243,246,.9);
  --sidebar-ink:#3a3a3f;
  --sidebar-muted:#86868b;
  --sidebar-active:rgba(0,0,0,.055);
  --lytes:#2a78d6;
  --dwink:#eb6834;
  --good:#0ca30c;      --good-soft:#e8f6e8;   --good-ink:#0a7a0a;
  --warn:#fab219;      --warn-soft:#fdf3dc;   --warn-ink:#8a5c00;
  --serious:#ec835a;   --serious-soft:#fdeee7;--serious-ink:#b04a22;
  --crit:#d03b3b;      --crit-soft:#fbe9e9;   --crit-ink:#a92e2e;
  --neutral-soft:#eef0f3; --neutral-ink:#475467;
  --violet:#4a3aa7;    --violet-soft:#edeafa; --violet-ink:#3d2f91;
  --aqua:#1baf7a;      --aqua-soft:#e4f5ee;   --aqua-ink:#0d7c54;
  --magenta:#e87ba4;   --magenta-soft:#fbeef3;--magenta-ink:#b4416f;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 18px 50px -12px rgba(0,0,0,.22);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--font);font-size:.9rem;color:var(--ink)}
a{color:var(--accent-ink);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfd4dc;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-ink);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-width:0}
.content{padding:34px 38px 70px;max-width:1400px;width:100%;margin:0 auto}

/* ============ SIDEBAR (Apple-style: light, translucent) ============ */
.sidebar{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line-2)}
.sb-logo{display:flex;align-items:center;gap:10px;padding:22px 18px 14px}
.sb-logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2a78d6,#4a3aa7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo .mark svg{width:17px;height:17px}
.sb-logo .name{font-size:1.05rem;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.sb-logo .tag{display:none}
.sb-new{margin-left:auto;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.06);color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.sb-new:hover{background:var(--accent);color:#fff}
.sb-new svg{width:13px;height:13px}
.sb-brand{position:relative;margin:2px 12px 6px;padding:8px 11px;background:#fff;border:1px solid var(--line-2);border-radius:11px;display:flex;align-items:center;gap:9px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s}
.sb-brand:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sb-brand .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sb-brand .lbl{font-size:.58rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.sb-brand .val{font-size:.82rem;font-weight:600;color:var(--ink)}
.sb-brand .chev{margin-left:auto;color:var(--ink-3)}
.sb-search{margin:6px 12px 4px;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;background:rgba(0,0,0,.045);color:var(--ink-3);font-size:.82rem;cursor:pointer;width:calc(100% - 24px);transition:background .15s}
.sb-search:hover{background:rgba(0,0,0,.07)}
.sb-search svg{width:14px;height:14px}
.sb-search kbd{margin-left:auto;font-family:var(--font);font-size:.66rem;background:#fff;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.sb-nav{flex:1;padding:0 12px;overflow-y:auto}
.sb-section{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:15px 8px 5px;opacity:.8}
.nav-item{display:flex;align-items:center;gap:10px;padding:7.5px 10px;border-radius:9px;font-size:.86rem;font-weight:500;color:var(--sidebar-ink);width:100%;text-align:left;margin-bottom:1px;position:relative;transition:background .12s,color .12s}
.nav-item:hover{background:var(--sidebar-active);color:var(--ink)}
.nav-item.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav-item.active svg{color:var(--accent);opacity:1}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;color:var(--ink-2)}
.nav-item .count{margin-left:auto;background:rgba(0,0,0,.07);color:var(--ink-2);font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:20px}
.nav-item .count.hot{background:var(--crit);color:#fff}
.sb-footer{padding:10px 12px 14px;border-top:1px solid var(--line-2)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;cursor:pointer;transition:background .15s}
.sb-user:hover{background:var(--sidebar-active)}
.sb-user .meta .n{font-size:.82rem;font-weight:600;color:var(--ink)}
.sb-user .meta .r{font-size:.68rem;color:var(--ink-3)}
.sb-user .bell{margin-left:auto;position:relative;color:var(--ink-3);padding:6px;border-radius:9px}
.sb-user .bell:hover{color:var(--ink);background:rgba(0,0,0,.06)}
.bell-dot{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--crit);color:#fff;font-size:.58rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid #f4f4f6}
.mob-menu{display:none;position:fixed;top:14px;left:14px;z-index:50;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.12);align-items:center;justify-content:center;color:var(--ink)}

/* ============ AVATARS ============ */
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.02em}
.av.sm{width:24px;height:24px;font-size:.6rem}
.av.lg{width:48px;height:48px;font-size:1.05rem}
.av.xl{width:64px;height:64px;font-size:1.4rem}
.av-lewis{background:linear-gradient(135deg,#4a3aa7,#2a78d6)}
.av-rod{background:linear-gradient(135deg,#0d7c54,#1baf7a)}
.av-c1{background:linear-gradient(135deg,#b4416f,#e87ba4)}
.av-c2{background:linear-gradient(135deg,#b04a22,#ec835a)}
.av-c3{background:linear-gradient(135deg,#1c5cab,#2a78d6)}
.av-c4{background:linear-gradient(135deg,#8a5c00,#eda100)}
.av-c5{background:linear-gradient(135deg,#3d2f91,#9085e9)}
.av-c6{background:linear-gradient(135deg,#0d7c54,#1baf7a)}
.av-stack{display:flex}
.av-stack .av{border:2px solid #fff;margin-left:-8px}
.av-stack .av:first-child{margin-left:0}

/* ============ ICON BUTTON (shared) ============ */
.tb-icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative;border:1px solid transparent}
.tb-icon-btn:hover{background:var(--surface-2);border-color:var(--line-2)}

/* ============ SPOTLIGHT SEARCH (⌘K) ============ */
.spot-ov{position:fixed;inset:0;background:rgba(20,20,22,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:15vh 16px 0}
.spot-ov.open{display:flex}
.spot{width:620px;max-width:94vw;background:rgba(252,252,253,.94);backdrop-filter:blur(30px);border-radius:18px;box-shadow:0 30px 90px -15px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.1);overflow:hidden;animation:spotIn .16s ease}
@keyframes spotIn{from{transform:scale(.97) translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.spot-bar{display:flex;align-items:center;gap:12px;padding:16px 18px}
.spot-bar svg{width:20px;height:20px;color:var(--ink-3);flex-shrink:0}
.spot-bar input{flex:1;border:none;outline:none;background:none;font-size:1.15rem;font-weight:400;color:var(--ink);font-family:var(--font)}
.spot-bar input::placeholder{color:var(--ink-3)}
.spot-bar kbd{font-family:var(--font);font-size:.66rem;background:rgba(0,0,0,.05);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;color:var(--ink-3)}
.spot-results{max-height:44vh;overflow-y:auto;border-top:1px solid var(--line-2);padding:7px}
.spot-group{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:9px 12px 3px}
.spot-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;cursor:pointer;font-size:.88rem}
.spot-item svg{width:16px;height:16px;color:var(--ink-3);flex-shrink:0}
.spot-item .st{font-weight:500}
.spot-item .ss{font-size:.72rem;color:var(--ink-3);margin-left:auto;padding-left:14px;white-space:nowrap}
.spot-item.sel{background:var(--accent);color:#fff}
.spot-item.sel svg,.spot-item.sel .ss{color:rgba(255,255,255,.8)}
.spot-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line-2);font-size:.68rem;color:var(--ink-3)}
.spot-foot b{font-weight:600}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:.84rem;font-weight:600;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:#cfd4dc;color:var(--ink);background:var(--surface-2)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-soft:hover{background:#d9e9fa}
.btn-danger-soft{background:var(--crit-soft);color:var(--crit-ink)}
.btn-sm{padding:5px 10px;font-size:.76rem;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:.7rem;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}

/* ============ DROPDOWNS ============ */
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:70}
.dd-menu.open{display:block}
.dd-menu.left{left:0;right:auto}
.dd-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;font-size:.84rem;font-weight:500;text-align:left;color:var(--ink-2)}
.dd-item svg{width:15px;height:15px;flex-shrink:0;color:var(--ink-3)}
.dd-item:hover{background:var(--surface-2);color:var(--ink)}
.dd-item.sel{color:var(--ink);font-weight:600}
.dd-item .check{margin-left:auto;color:var(--accent);font-weight:800;visibility:hidden}
.dd-item.sel .check{visibility:visible}
.dd-sep{height:1px;background:var(--line-2);margin:5px 4px}
.dd-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:8px 10px 3px}
.b-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ============ CARDS & GRIDS ============ */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.card-h .t{font-size:.93rem;font-weight:700;letter-spacing:-.01em}
.card-h .sub{font-size:.75rem;color:var(--ink-3);font-weight:500}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.grid{display:grid;gap:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.page-head h1{font-size:1.85rem;font-weight:700;letter-spacing:-.025em}
.page-head .desc{font-size:.88rem;color:var(--ink-3);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* ============ KPI ============ */
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:18px 19px;box-shadow:var(--shadow);position:relative;transition:box-shadow .15s,transform .15s}
.kpi:hover{box-shadow:0 8px 24px -8px rgba(0,0,0,.12);transform:translateY(-1px)}
.kpi .k-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kpi .k-ico{display:none}
.kpi .k-label{font-size:.76rem;font-weight:500;color:var(--ink-3)}
.kpi .k-val{font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi .k-foot{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:.72rem;color:var(--ink-3);flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700}
.delta.up{color:#006300}
.delta.down{color:var(--crit-ink)}
.delta.flat{color:var(--ink-3)}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap;line-height:1.5}
.badge .bd{width:6px;height:6px;border-radius:50%}
.bg-good{background:var(--good-soft);color:var(--good-ink)}
.bg-warn{background:var(--warn-soft);color:var(--warn-ink)}
.bg-serious{background:var(--serious-soft);color:var(--serious-ink)}
.bg-crit{background:var(--crit-soft);color:var(--crit-ink)}
.bg-neutral{background:var(--neutral-soft);color:var(--neutral-ink)}
.bg-accent{background:var(--accent-soft);color:var(--accent-ink)}
.bg-violet{background:var(--violet-soft);color:var(--violet-ink)}
.bg-aqua{background:var(--aqua-soft);color:var(--aqua-ink)}
.bg-magenta{background:var(--magenta-soft);color:var(--magenta-ink)}
.badge.brand-lytes{background:var(--accent-soft);color:var(--accent-ink)}
.badge.brand-dwink{background:var(--serious-soft);color:var(--serious-ink)}
.status-lg{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.76rem;font-weight:700}

/* ============ PROGRESS ============ */
.prog{height:7px;background:var(--neutral-soft);border-radius:6px;overflow:hidden}
.prog>div{height:100%;border-radius:6px;transition:width .4s ease}
.prog.thin{height:5px}
.prog-row{display:flex;flex-direction:column;gap:5px}
.prog-row .pr-top{display:flex;justify-content:space-between;font-size:.75rem}
.prog-row .pr-top .l{color:var(--ink-2);font-weight:600}
.prog-row .pr-top .v{color:var(--ink);font-weight:700}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:#fafbfc}
.tbl tbody tr.clickable{cursor:pointer}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.tbl th.num{text-align:right}
.tbl .main-cell .t{font-weight:600}
.tbl .main-cell .s{font-size:.73rem;color:var(--ink-3);margin-top:1px}
.cell-user{display:flex;align-items:center;gap:8px}

/* ============ TABS & PILLS ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:.85rem;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .tc{background:var(--neutral-soft);color:var(--neutral-ink);font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:10px}
.tab.active .tc{background:var(--accent-soft);color:var(--accent-ink)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;font-size:.76rem;font-weight:600;border:1px solid var(--line);color:var(--ink-2);background:#fff;transition:all .12s}
.pill:hover{border-color:#cfd4dc}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .pc{opacity:.7;font-weight:700;margin-left:4px}

/* ============ KANBAN ============ */
.kanban{display:flex;gap:13px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kb-col{min-width:255px;width:255px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;flex-shrink:0}
.kb-col-h{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:.78rem;font-weight:700}
.kb-col-h .cnt{margin-left:auto;font-size:.7rem;color:var(--ink-3);background:#fff;border:1px solid var(--line);padding:1px 8px;border-radius:10px}
.kb-cards{padding:0 9px 9px;display:flex;flex-direction:column;gap:8px;min-height:50px}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:grab;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
.kb-card:hover{box-shadow:var(--shadow-lg)}
.kb-card.dragging{opacity:.45;transform:rotate(2deg)}
.kb-col.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.kb-card .t{font-size:.83rem;font-weight:600;line-height:1.35;margin-bottom:7px}
.kb-card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kb-card .foot{display:flex;align-items:center;margin-top:9px;gap:7px}
.kb-card .due{font-size:.7rem;color:var(--ink-3);font-weight:600;margin-left:auto}
.kb-card .due.over{color:var(--crit-ink)}

/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.cal .cal-dow{background:var(--surface-2);padding:8px 10px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;gap:1px}
.cal .cal-day{background:#fff;min-height:96px;padding:7px 8px;font-size:.72rem}
.cal .cal-day .d{font-weight:600;color:var(--ink-3);margin-bottom:5px}
.cal .cal-day.today .d{color:#fff;background:var(--accent);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal .cal-day.dim{background:#fafbfc}
.cal .cal-day.dim .d{opacity:.4}
.cal-task{display:block;width:100%;text-align:left;font-size:.66rem;font-weight:600;padding:2.5px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-task.p-urgent{background:var(--crit-soft);color:var(--crit-ink)}
.cal-task.p-high{background:var(--serious-soft);color:var(--serious-ink)}
.cal-task.p-medium{background:var(--accent-soft);color:var(--accent-ink)}
.cal-task.p-low{background:var(--neutral-soft);color:var(--neutral-ink)}

/* ============ LISTS / FEED ============ */
.feed-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:none}
.feed-item .fi-body{flex:1;min-width:0}
.feed-item .fi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.feed-item .fi-title{font-size:.87rem;font-weight:600}
.feed-item .fi-desc{font-size:.8rem;color:var(--ink-2);margin-top:3px;line-height:1.5}
.feed-item .fi-meta{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:.72rem;color:var(--ink-3);flex-wrap:wrap}
.act-item{display:flex;gap:11px;padding:10px 18px;position:relative}
.act-item::before{content:'';position:absolute;left:33px;top:40px;bottom:-4px;width:2px;background:var(--line-2)}
.act-item:last-child::before{display:none}
.act-item .ai-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.act-item .ai-ico svg{width:14px;height:14px}
.act-item .ai-body{font-size:.81rem;color:var(--ink-2);line-height:1.45;padding-top:4px}
.act-item .ai-body b{color:var(--ink);font-weight:600}
.act-item .ai-time{font-size:.7rem;color:var(--ink-3);margin-top:2px}
.rank-item{display:flex;align-items:center;gap:11px;padding:10px 18px;border-bottom:1px solid var(--line-2)}
.rank-item:last-child{border-bottom:none}
.rank-item .rk{width:20px;font-size:.75rem;font-weight:700;color:var(--ink-3);text-align:center}
.rank-item .ri-meta{flex:1;min-width:0}
.rank-item .ri-meta .n{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-item .ri-meta .s{font-size:.72rem;color:var(--ink-3)}
.rank-item .ri-val{text-align:right}
.rank-item .ri-val .v{font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums}
.rank-item .ri-val .vs{font-size:.68rem;color:var(--ink-3)}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;background:rgba(16,20,24,.5);backdrop-filter:blur(2px);z-index:90;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px 40px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.wide{max-width:860px}
.modal.xwide{max-width:980px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px 14px;border-bottom:1px solid var(--line-2)}
.modal-h .t{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.modal-h .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.modal-h .x:hover{background:var(--surface-2);color:var(--ink)}
.modal-b{padding:18px 22px}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 22px 18px;border-top:1px solid var(--line-2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:.74rem;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8.5px 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:72px}
.field .hint{font-size:.7rem;color:var(--ink-3);margin-top:4px}

/* ============ NOTIFICATION PANEL ============ */
.notif-panel{position:fixed;top:0;right:-400px;bottom:0;width:390px;max-width:94vw;background:#fff;border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:95;transition:right .25s ease;display:flex;flex-direction:column}
.notif-panel.open{right:0}
.np-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.np-h .t{font-weight:700;font-size:1rem}
.np-body{flex:1;overflow-y:auto}
.np-item{display:flex;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line-2);cursor:pointer;position:relative}
.np-item:hover{background:var(--surface-2)}
.np-item.unread{background:#f7faff}
.np-item.unread:hover{background:#eff5fd}
.np-item .ni-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.np-item .ni-ico svg{width:15px;height:15px}
.np-item .ni-t{font-size:.83rem;font-weight:600;line-height:1.35}
.np-item .ni-d{font-size:.76rem;color:var(--ink-2);margin-top:2px;line-height:1.45}
.np-item .ni-time{font-size:.68rem;color:var(--ink-3);margin-top:5px}
.np-item .un-dot{position:absolute;top:16px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.84rem;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:pop .2s ease}
.toast svg{width:15px;height:15px;color:#5cd65c}

/* ============ MISC ============ */
.empty{padding:34px 20px;text-align:center;color:var(--ink-3);font-size:.85rem}
.empty .e-ico{font-size:1.6rem;margin-bottom:8px}
.chart-box{position:relative;height:250px}
.chart-box.sm{height:190px}
.legend-row{display:flex;gap:16px;align-items:center;font-size:.74rem;color:var(--ink-2);font-weight:600}
.legend-row .li{display:flex;align-items:center;gap:6px}
.legend-row .sw{width:10px;height:10px;border-radius:3px}
.score-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .sv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800}
.divider-v{width:1px;align-self:stretch;background:var(--line-2)}
.mini-stat .l{font-size:.68rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mini-stat .v{font-size:1.05rem;font-weight:800;margin-top:2px}
.mini-stat .s{font-size:.7rem;color:var(--ink-3)}
.section-title{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;margin:26px 0 13px;display:flex;align-items:center;gap:9px}
.section-title:first-child{margin-top:0}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link-btn{font-size:.78rem;font-weight:600;color:var(--accent-ink)}
.link-btn:hover{text-decoration:underline}
.page{display:none}
.page.active{display:block;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(16,20,24,.5);z-index:55}
.comment{display:flex;gap:9px;padding:9px 0}
.comment .c-body{background:var(--surface-2);border-radius:0 11px 11px 11px;padding:8px 12px;font-size:.8rem;flex:1}
.comment .c-who{font-weight:700;font-size:.75rem;margin-bottom:2px}
.comment .c-time{font-size:.66rem;color:var(--ink-3);margin-top:3px}
.detail-kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:.83rem}
.detail-kv .k{color:var(--ink-3);font-weight:500}
.detail-kv .v{font-weight:600}
.timeline-mini{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.timeline-mini .tm-item{position:relative;font-size:.8rem;color:var(--ink-2)}
.timeline-mini .tm-item::before{content:'';position:absolute;left:-21.5px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
.timeline-mini .tm-item .tmt{font-size:.68rem;color:var(--ink-3)}
.stage-flow{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px}
.stage-chip{flex-shrink:0;text-align:center;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;min-width:78px;cursor:pointer}
.stage-chip:hover{border-color:#cfd4dc}
.stage-chip.active{border-color:var(--accent);background:var(--accent-soft)}
.stage-chip .n{font-size:1rem;font-weight:800}
.stage-chip .l{font-size:.62rem;color:var(--ink-3);font-weight:600;margin-top:1px;white-space:nowrap}
.report-btns{display:flex;gap:8px;flex-wrap:wrap}
.print-note{display:none}

/* ============ AI ASSISTANT (third column) ============ */
.ai-toggle{position:fixed;bottom:22px;right:22px;z-index:46;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.ai-toggle:hover{transform:scale(1.07);box-shadow:0 6px 24px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.05)}
.ai-toggle svg{width:21px;height:21px}
.ai-toggle .ai-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--crit);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
body.ai-open .ai-toggle{display:none}
body.brief-full .ai-toggle{display:none}
.ai-panel{position:fixed;top:0;right:-350px;bottom:0;width:340px;background:#fff;border-left:1px solid var(--line-2);z-index:45;display:flex;flex-direction:column;transition:right .28s cubic-bezier(.4,0,.2,1)}
body.ai-open .ai-panel{right:0}
body.ai-open .main{margin-right:340px}
body.brief-full .main{margin-right:0}
.ai-head{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;border-bottom:1px solid var(--line-2)}
.ai-orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 210deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#0a84ff);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-orb::after{content:'';width:24px;height:24px;border-radius:50%;background:#fff;position:absolute}
.ai-orb svg{width:14px;height:14px;position:relative;z-index:1}
.ai-head .t{font-weight:700;font-size:.95rem;letter-spacing:-.01em}
.ai-head .ctx{font-size:.68rem;color:var(--ink-3)}
.ai-body{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:3px}
.msg{max-width:86%;padding:9px 13px;font-size:.84rem;line-height:1.45;margin-bottom:6px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#0a84ff,#0071e3);color:#fff;border-radius:18px 18px 5px 18px}
.msg.ai{align-self:flex-start;background:#e9e9eb;color:var(--ink);border-radius:18px 18px 18px 5px}
.msg.ai b{font-weight:650}
.msg-btns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.msg-btn{padding:6px 14px;border-radius:16px;font-size:.76rem;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,113,227,.3)}
.msg-btn:hover{background:var(--accent-ink)}
.msg-btn.ghost{background:rgba(0,0,0,.05);color:var(--ink-2);box-shadow:none}
.msg-btn.ghost:hover{background:rgba(0,0,0,.09);color:var(--ink)}
.ai-card{align-self:stretch;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);font-size:.8rem}
.ai-card .ac-tag{display:inline-flex;align-items:center;gap:5px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;color:#bf5af2}
.ai-card .ac-t{font-weight:700;font-size:.86rem;margin-bottom:5px;letter-spacing:-.01em}
.ai-card .ac-b{color:var(--ink-2);line-height:1.5}
.ai-card .ac-kv{display:flex;gap:14px;margin:9px 0;padding:9px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.ai-card .ac-kv .k{font-size:.62rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ai-card .ac-kv .v{font-size:.92rem;font-weight:700;margin-top:1px}
.ai-typing{align-self:flex-start;background:#e9e9eb;border-radius:18px 18px 18px 5px;padding:12px 15px;display:flex;gap:4px;margin-bottom:6px}
.ai-typing i{width:7px;height:7px;border-radius:50%;background:#a8a8ad;animation:tybl 1.2s infinite}
.ai-typing i:nth-child(2){animation-delay:.18s}.ai-typing i:nth-child(3){animation-delay:.36s}
@keyframes tybl{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ai-chips{display:flex;flex-wrap:wrap;gap:7px;padding:4px 14px 10px}
.ai-chip{padding:7px 13px;border-radius:16px;font-size:.76rem;font-weight:500;background:rgba(0,113,227,.08);color:var(--accent-ink);text-align:left}
.ai-chip:hover{background:rgba(0,113,227,.15)}
.ai-input{display:flex;align-items:center;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line-2)}
.ai-input .field-wrap{flex:1;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.045);border-radius:20px;padding:8px 8px 8px 15px}
.ai-input input{flex:1;border:none;background:none;outline:none;font-size:.86rem;font-family:var(--font)}
.ai-input .mic,.ai-input .snd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-input .mic{color:var(--ink-3)}
.ai-input .mic:hover{color:var(--accent)}
.ai-input .snd{background:var(--accent);color:#fff;opacity:.35;transition:opacity .15s}
.ai-input .snd.ready{opacity:1}
.ai-input svg{width:15px;height:15px}
.ai-learn{font-size:.66rem;color:var(--ink-3);padding:0 16px 8px;display:flex;align-items:center;gap:6px}
@media (max-width:1100px){ body.ai-open .main{margin-right:0} .ai-panel{width:min(94vw,350px);box-shadow:var(--shadow-lg)} body.ai-open .ai-toggle{right:calc(min(94vw,350px) + 14px)} }

/* ============ BRIEFS CANVAS ============ */
.brf-editor{display:flex;flex-direction:column;height:calc(100vh - 128px);min-height:540px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.brf-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.brf-top .name-input{font-weight:700;font-size:.95rem;border:1px solid transparent;border-radius:7px;padding:5px 8px;min-width:200px;outline:none}
.brf-top .name-input:hover{border-color:var(--line)}
.brf-top .name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;background:var(--neutral-soft);border-radius:9px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:.76rem;font-weight:700;color:var(--ink-2)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.brf-body{flex:1;display:flex;min-height:0}
.brf-tools{width:52px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:5px;padding:10px 8px;background:var(--surface-2);align-items:center}
.brf-tool{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative}
.brf-tool:hover{background:var(--neutral-soft)}
.brf-tool.active{background:var(--ink);color:#fff}
.brf-tool svg{width:17px;height:17px}
.brf-viewport{flex:1;position:relative;overflow:hidden;background:#e9ecf0;background-image:radial-gradient(#d2d7de 1px,transparent 1px);background-size:22px 22px;cursor:grab;touch-action:none}
.brf-viewport.panning{cursor:grabbing}
.brf-viewport.adding{cursor:crosshair}
.brf-world{position:absolute;top:0;left:0;width:2600px;height:1750px;transform-origin:0 0}
.brf-frame{position:absolute;background:#fff;border:1px solid #dde1e7;border-radius:14px;box-shadow:0 2px 10px rgba(16,24,40,.06)}
.brf-frame .fr-title{position:absolute;top:-26px;left:2px;font-size:.72rem;font-weight:700;color:var(--ink-2);cursor:move;padding:3px 8px;background:rgba(255,255,255,.7);border-radius:6px;white-space:nowrap}
.fr-rs{position:absolute;opacity:0;transition:opacity .12s;z-index:4}
.brf-frame:hover .fr-rs{opacity:1}
.fr-rs-s{left:50%;bottom:-7px;transform:translateX(-50%);width:64px;height:12px;cursor:ns-resize;display:flex;align-items:center;justify-content:center}
.fr-rs-s::after{content:'';width:44px;height:5px;border-radius:4px;background:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.3)}
.fr-rs-se{right:-8px;bottom:-8px;width:16px;height:16px;cursor:nwse-resize}
.fr-rs-se::after{content:'';position:absolute;inset:2px;border-radius:4px;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.25)}
.brf-frame.resizing{outline:2px solid var(--accent);outline-offset:-1px}
.fr-size-tag{position:absolute;right:6px;bottom:6px;background:var(--ink);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;pointer-events:none}
.brf-el{position:absolute;cursor:move;user-select:none}
.brf-el.selected{outline:2px solid var(--accent);outline-offset:3px}
.brf-el .del-h{position:absolute;top:-12px;right:-12px;width:22px;height:22px;border-radius:50%;background:var(--crit);color:#fff;display:none;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;cursor:pointer;z-index:5}
.brf-el.selected .del-h{display:flex}
.brf-text{line-height:1.45;min-width:40px;white-space:pre-wrap}
.brf-text[contenteditable="true"]{outline:2px dashed var(--accent);cursor:text;user-select:text}
.brf-text.t-h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.brf-text.t-body{font-size:.86rem;color:var(--ink)}
.brf-text.t-small{font-size:.74rem;color:var(--ink-2)}
.brf-link{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;box-shadow:var(--shadow);font-size:.8rem;font-weight:600;color:var(--accent-ink);max-width:280px}
.brf-link .lk-ico{width:28px;height:28px;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brf-link .lk-ico svg{width:14px;height:14px}
.brf-link .lk-url{font-size:.66rem;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.brf-video{width:168px;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px -6px rgba(16,24,40,.35);background:#000}
.brf-video .v-body{aspect-ratio:9/16;position:relative;display:flex;align-items:center;justify-content:center}
.brf-video .v-play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.brf-video .v-play svg{width:15px;height:15px;margin-left:2px}
.brf-video .v-meta{position:absolute;bottom:0;left:0;right:0;padding:22px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.brf-video .v-handle{font-size:.7rem;font-weight:700}
.brf-video .v-cap{font-size:.62rem;opacity:.85;margin-top:1px}
.brf-video .v-views{position:absolute;top:8px;right:9px;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:10px}
.brf-pin{position:absolute;width:27px;height:27px;border-radius:14px 14px 14px 3px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.68rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow-lg);z-index:50;border:2px solid #fff;transform:translate(-4px,-23px)}
.brf-pin.resolved{opacity:.45}
.brf-thread{position:absolute;width:264px;background:#fff;border-radius:13px;box-shadow:var(--shadow-lg);border:1px solid var(--line);z-index:60;font-size:.8rem}
.brf-thread .th-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-2);font-weight:700;font-size:.76rem}
.brf-thread .th-msgs{max-height:200px;overflow-y:auto;padding:4px 12px}
.brf-zoom{display:flex;align-items:center;gap:2px;background:var(--neutral-soft);border-radius:9px;padding:3px}
.brf-zoom button{width:26px;height:26px;border-radius:7px;font-weight:800;color:var(--ink-2)}
.brf-zoom button:hover{background:#fff}
.brf-zoom .zv{font-size:.72rem;font-weight:700;min-width:44px;text-align:center}
.brief-card{cursor:pointer;transition:box-shadow .15s,transform .15s}
.brief-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.brief-thumb{height:130px;background:#e9ecf0;background-image:radial-gradient(#d2d7de 1px,transparent 1px);background-size:14px 14px;position:relative;overflow:hidden;border-radius:12px 12px 0 0}
.phone-frame{width:392px;max-width:96vw;margin:0 auto;border:11px solid #101418;border-radius:40px;overflow:hidden;background:#fff;box-shadow:var(--shadow-lg)}
.phone-frame .ph-notch{height:24px;background:#101418;display:flex;justify-content:center}
.phone-frame .ph-notch::after{content:'';width:110px;height:16px;background:#101418;border-radius:0 0 12px 12px}
.present-scroll{overflow-y:auto;flex:1;background:var(--bg)}
.present-sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.present-sec .ps-t{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-ink);margin-bottom:10px}
@media (max-width:860px){ .brf-tools{width:44px} .brf-editor{height:calc(100vh - 110px)} }
/* full-screen brief mode */
body.brief-full .topbar{display:none}
body.brief-full .content{padding:0;max-width:none;margin:0}
body.brief-full .brf-editor{height:100vh;min-height:100vh;border:none;border-radius:0;box-shadow:none}
body.brief-full .page.active{animation:none}
body.sb-hidden .sidebar{transform:translateX(-100%)}
body.sb-hidden .main{margin-left:0}
.sb-toggle-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border:1px solid var(--line)}
.sb-toggle-btn:hover{background:var(--surface-2)}

/* ============ COURSES & VAULT ============ */
.vid-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
.vid-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.vid-thumb{height:140px;position:relative;display:flex;align-items:center;justify-content:center}
.vid-thumb .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)}
.vid-thumb .play svg{width:18px;height:18px;margin-left:3px;color:var(--ink)}
.vid-thumb .dur{position:absolute;bottom:9px;right:10px;background:rgba(16,20,24,.82);color:#fff;font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:5px}
.player{aspect-ratio:16/9;background:#101418;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#7d8590;cursor:pointer;margin-bottom:14px}
.player:hover .play{transform:scale(1.06)}
.player .play{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.player .play svg{width:22px;height:22px;margin-left:3px;color:#fff}
.lock-wrap{padding:40px 20px;text-align:center}
.lock-wrap .lock-ico{width:52px;height:52px;border-radius:50%;background:var(--neutral-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--ink-2)}
.lock-wrap input{text-align:center;letter-spacing:.15em}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s ease 2}

/* ============ PROFIT TAB ============ */
.switch{position:relative;width:34px;height:19px;flex-shrink:0;display:inline-block;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#cfd4dc;border-radius:20px;transition:.15s}
.switch .sl::before{content:'';position:absolute;left:2.5px;top:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+.sl{background:var(--good)}
.switch input:checked+.sl::before{transform:translateX(15px)}
.wf-row{display:grid;grid-template-columns:190px 1fr 110px;gap:10px;align-items:center;padding:6px 0;font-size:.82rem}
.wf-row .wl{color:var(--ink-2);font-weight:500}
.wf-row.total .wl,.wf-row.total .wv{font-weight:800;color:var(--ink)}
.wf-row .wv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.wf-row .wbar{height:14px;border-radius:4px;background:var(--neutral-soft);position:relative;overflow:hidden}
.wf-row .wbar>div{position:absolute;top:0;bottom:0;border-radius:4px}
.neg{color:var(--crit-ink)}
.pos{color:#006300}
.lever{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;padding:5px 0;font-size:.78rem}
.lever .ll{font-weight:600;color:var(--ink-2)}
.lever .lv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lever input[type=range]{width:100%;accent-color:var(--accent);height:18px}
.org-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-2);font-size:.82rem}
.org-row:last-child{border-bottom:none}
.org-row.off{opacity:.45}
.org-row .ol{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-row .ov{font-weight:700;font-variant-numeric:tabular-nums;min-width:80px;text-align:right}
.org-row select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem}
.org-row .op{font-size:.7rem;color:var(--ink-3);min-width:66px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:.78rem}
.donut-legend .dl{display:flex;align-items:center;gap:8px}
.donut-legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend .dv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;padding-left:14px}
.verdict{display:inline-flex;padding:2px 9px;border-radius:14px;font-size:.68rem;font-weight:700}

/* ============ LOGIN GATE & SYNC ============ */
.gate{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.gate.hidden{display:none}
.gate-card{width:360px;background:#fff;border-radius:24px;box-shadow:0 24px 70px -20px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.05);padding:36px 32px;text-align:center;animation:pop .25s ease}
.gate-card .g-mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#2a78d6,#4a3aa7);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.gate-card .g-mark svg{width:28px;height:28px}
.gate-card h2{font-size:1.3rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.gate-card .g-sub{font-size:.8rem;color:var(--ink-3);margin-bottom:22px}
.gate-card input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;font-size:.9rem;outline:none;margin-bottom:10px;background:var(--surface-2)}
.gate-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.gate-card .g-btn{width:100%;padding:11px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;font-size:.92rem;margin-top:4px}
.gate-card .g-btn:hover{background:var(--accent-ink)}
.gate-card .g-err{font-size:.76rem;color:var(--crit-ink);margin-top:10px;min-height:16px}
.sync-status{font-size:.64rem;color:var(--ink-3);padding:6px 10px 0;display:flex;align-items:center;gap:5px}
.sync-status .sd{width:6px;height:6px;border-radius:50%;background:var(--good)}
.sync-status.saving .sd{background:var(--warn)}
.sync-status.error .sd{background:var(--crit)}

/* ============ RESPONSIVE ============ */
@media (max-width:1180px){

  .form-grid{grid-template-columns:1fr}
  .cal .cal-day{min-height:64px}
  .page-head h1{font-size:1.4rem}
}

const money = n => '£' + Math.round(n).toLocaleString('en-GB');
const moneyDec = n => '£' + n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => n>=1000000 ? (n/1000000).toFixed(1)+'M' : n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(n);
const brandBadge = b => b==='all' ? `<span class="badge bg-neutral">All Brands</span>` : `<span class="badge brand-${b}"><span class="bd" style="background:${BRANDS[b].solid}"></span>${BRANDS[b].name}</span>`;
const userAv = (uid,sz='') => { const u=USERS[uid]; return u?`<span class="av ${sz} ${u.av}" title="${u.name}">${u.initials}</span>`:''; };
const userChip = uid => { const u=USERS[uid]; return u?`<span class="cell-user">${userAv(uid,'sm')}<span style="font-weight:600">${u.short}</span></span>`:'<span style="color:var(--ink-3)">—</span>'; };

const campaignById = id => CAMPAIGNS.find(c=>c.id===id);

const fmtDate = iso => { if(!iso||iso==='—') return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
const isOverdue = t => t.status!=='Completed' && new Date(t.due+'T23:59:59') < TODAY;
const dueToday = t => t.due==='2026-07-31' && t.status!=='Completed';

const statusBadge = s => {

    'Not Started':'bg-neutral','In Progress':'bg-accent','Waiting on Creator':'bg-violet','Waiting on Lewis':'bg-warn',
    'Waiting on Stock':'bg-magenta','Blocked':'bg-crit','Completed':'bg-good',

    'Continue':'bg-good','Review':'bg-warn','Cancel':'bg-crit',
    'Resolved':'bg-good','Open':'bg-warn'
  };
  return `<span class="badge ${map[s]||'bg-neutral'}"><span class="bd" style="background:currentColor;opacity:.55"></span>${s}</span>`;
};
const prioBadge = p => {
  const map={ Low:'bg-neutral', Medium:'bg-accent', High:'bg-serious', Urgent:'bg-crit' };

};
const stageBadge = s => {
  const map={ 'Prospect':'bg-neutral','Contacted':'bg-neutral','Interested':'bg-accent','Sample Requested':'bg-violet','Sample Sent':'bg-violet',
    'Content Pending':'bg-warn','Content Live':'bg-aqua','Active Creator':'bg-good','Retainer Creator':'bg-good','Paused':'bg-serious','Rejected':'bg-crit' };
  return `<span class="badge ${map[s]||'bg-neutral'}">${s}</span>`;
};
const catBadge = c => {
  const map={'General Update':'bg-neutral','Creator Update':'bg-aqua','Product Update':'bg-violet','Campaign Update':'bg-accent',
    'Account Issue':'bg-crit','Opportunity':'bg-good','Urgent Decision':'bg-crit','Performance Update':'bg-magenta'};
  return `<span class="badge ${map[c]||'bg-neutral'}">${c}</span>`;
};
const progBar = (pct,color) => {
  const c = color || (pct>=80?'var(--good)':pct>=50?'var(--accent)':pct>=25?'var(--warn)':'var(--crit)');
  return `<div class="prog"><div style="width:${Math.min(100,pct)}%;background:${c}"></div></div>`;
};
const progRow = (label,cur,target,fmt) => {
  const pct = target? Math.round(cur/target*100) : 0;
  return `<div class="prog-row"><div class="pr-top"><span class="l">${label}</span><span class="v">${fmt(cur)} <span style="color:var(--ink-3);font-weight:500">/ ${fmt(target)}</span> · ${pct}%</span></div>${progBar(pct)}</div>`;
};
const scoreRing = (score,max=10) => {
  const pct=score/max, r=21, c=2*Math.PI*r;
  const col = score>=8?'var(--good)':score>=6?'var(--warn)':'var(--crit)';
  return `<div class="score-ring"><svg width="52" height="52"><circle cx="26" cy="26" r="${r}" stroke="var(--neutral-soft)" stroke-width="5" fill="none"/><circle cx="26" cy="26" r="${r}" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/></svg><span class="sv">${score.toFixed(1)}</span></div>`;
};

  const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;

    closeModal(); toggleNotifs(false); closeAllDD(); closeSpotlight();

/* ============ SPOTLIGHT SEARCH (⌘K) ============ */
let spotItems=[], spotSel=0;
function openSpotlight(){
  closeAllDD(); toggleNotifs(false);
  $('spotOv').classList.add('open');
  const inp=$('spotInput'); inp.value=''; spotSel=0;
  buildSpotResults('');
  setTimeout(()=>inp.focus(),20);
}
function closeSpotlight(){ $('spotOv').classList.remove('open'); }
function buildSpotResults(q){
  q=q.trim().toLowerCase();
  const items=[];
  const add=(group,icon,title,sub,run)=>items.push({group,icon,title,sub,run});
  if(!q){
    add('Suggestions','home','Go to Overview','Page',()=>navTo('overview'));
    add('Suggestions','tasks',"Rod's Dashboard",'Tasks',()=>navTo('tasks',{taskView:'rodDash'}));
    add('Suggestions','flag','Approvals waiting on you', state.tasks.filter(t=>t.status==='Waiting on Lewis').length+' items', ()=>goNeedsLewis());
    add('Actions','plus','New task','',()=>openTaskModal());
    add('Actions','canvas','New brief','',()=>newBrief());
    add('Actions','users','Add creator','',()=>openCreatorModal());
  } else {
    PAGES.filter(p=>p.label.toLowerCase().includes(q)).forEach(p=>add('Pages',p.icon,p.label,'Page',()=>navTo(p.id)));
    state.tasks.filter(t=>t.name.toLowerCase().includes(q)).slice(0,5).forEach(t=>add('Tasks','tasks',t.name,t.status,()=>{navTo('tasks');openTaskDetail(t.id);}));
    CREATORS.filter(c=>(c.name+' '+c.handle).toLowerCase().includes(q)).slice(0,5).forEach(c=>add('Creators','users',c.name,c.handle,()=>{navTo('creators');openCreatorDetail(c.id);}));
    BRIEFS.filter(b=>b.name.toLowerCase().includes(q)).slice(0,4).forEach(b=>add('Briefs','canvas',b.name,b.status,()=>openBriefEditor(b.id)));
    COURSES.filter(c=>c.title.toLowerCase().includes(q)).slice(0,4).forEach(c=>add('Courses','grad',c.title,c.duration,()=>{navTo('courses');openCourseDetail(c.id);}));
    RETAINERS.filter(r=>r.person.toLowerCase().includes(q)).slice(0,4).forEach(r=>add('Retainers','card',r.person,money(r.amount)+'/mo',()=>{navTo('retainers');openRetainerDetail(r.id);}));
    ['task','brief','creator','retainer'].filter(x=>('new '+x).includes(q)||x.startsWith(q)).forEach(x=>{
      const runs={task:()=>openTaskModal(),brief:()=>newBrief(),creator:()=>openCreatorModal(),retainer:()=>openRetainerModal()};
      add('Actions','plus','New '+x,'',runs[x]);
    });
  }
  spotItems=items;
  spotSel=Math.min(spotSel, Math.max(0,items.length-1));
  const groups=[...new Set(items.map(i=>i.group))];
  $('spotResults').innerHTML = items.length ? groups.map(g=>
    `<div class="spot-group">${g}</div>` + items.map((it,idx)=>it.group!==g?'':
      `<div class="spot-item ${idx===spotSel?'sel':''}" data-si="${idx}" onmouseenter="spotSel=${idx};paintSpotSel()" onclick="runSpot(${idx})">
        ${ICONS[it.icon]||ICONS.doc}<span class="st">${esc(it.title)}</span>${it.sub?`<span class="ss">${esc(it.sub)}</span>`:''}</div>`).join('')
  ).join('') : `<div class="empty" style="padding:22px">Nothing found for “${esc(q)}”</div>`;
}
function paintSpotSel(){
  document.querySelectorAll('.spot-item').forEach(n=>n.classList.toggle('sel', +n.dataset.si===spotSel));
}
function runSpot(i){ const it=spotItems[i]; if(!it) return; closeSpotlight(); it.run(); }
document.addEventListener('DOMContentLoaded', ()=>{
  $('spotInput').addEventListener('input', e=>{ spotSel=0; buildSpotResults(e.target.value); });
  $('spotInput').addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); spotSel=Math.min(spotItems.length-1,spotSel+1); paintSpotSel(); scrollSpotSel(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); spotSel=Math.max(0,spotSel-1); paintSpotSel(); scrollSpotSel(); }
    else if(e.key==='Enter'){ e.preventDefault(); runSpot(spotSel); }
    else if(e.key==='Escape'){ closeSpotlight(); }
  });
});
function scrollSpotSel(){ document.querySelector(`.spot-item[data-si="${spotSel}"]`)?.scrollIntoView({block:'nearest'}); }

function chartSeries(){

function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v||1))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function drawCharts(){
  const series=chartSeries();
  drawLineChart('gmvChart', WEEKS, series.map(s=>({label:s.label,color:s.color,data:s.gmv})), v=>'£'+(v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v), v=>'£'+v.toLocaleString());
  drawBarChart('vidChart', WEEKS, series.map(s=>({label:s.label,color:s.color,data:s.vids})), v=>v);
}
function drawLineChart(id, labels, series, tickFmt, tipFmt){
  const box=$(id); if(!box) return;
  const W=680,H=250,padL=44,padR=10,padT=12,padB=26;
  const maxV=niceMax(Math.max(...series.flatMap(s=>s.data))*1.15);
  const x=i=>padL+(W-padL-padR)*i/(labels.length-1);
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const ticks=[0,.25,.5,.75,1].map(t=>t*maxV);
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">`;
  ticks.forEach(t=>{ svg+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="#e1e0d9" stroke-width="1"/>`; });
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(labels.length-1)},${y(0)}" fill="${s.color}" opacity="0.07"/>`;
    svg+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
  svg+=`<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="#c3c2b7" stroke-width="1"/>`;
  svg+=`<line id="${id}-cross" x1="0" y1="${padT}" x2="0" y2="${y(0)}" stroke="#98a2b3" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>`;
  series.forEach((s,si)=>{ s.data.forEach((v,i)=>{ svg+=`<circle id="${id}-pt-${si}-${i}" cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2" style="display:none"/>`; }); });
  svg+='</svg>';
  const tickHtml=ticks.map(t=>`<span style="position:absolute;left:0;top:${(y(t)/H*100)}%;transform:translateY(-50%);font-size:.64rem;color:#898781">${tickFmt(t)}</span>`).join('');
  const labHtml=labels.map((l,i)=>`<span style="position:absolute;left:${(x(i)/W*100)}%;bottom:0;transform:translateX(-50%);font-size:.64rem;color:#898781;white-space:nowrap">${l}</span>`).join('');
  box.innerHTML=`<div style="position:absolute;inset:0">${svg}${tickHtml}${labHtml}
    <div id="${id}-tip" style="position:absolute;display:none;background:#101828;color:#fff;font-size:.72rem;padding:7px 10px;border-radius:8px;pointer-events:none;z-index:5;white-space:nowrap;box-shadow:var(--shadow-lg)"></div></div>`;
  const layer=box.firstElementChild;
  layer.style.cursor='crosshair';
  layer.onmousemove=e=>{
    const r=layer.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(labels.length-1,Math.round((mx-padL)/((W-padL-padR)/(labels.length-1)))));
    const cross=$(id+'-cross'); cross.style.display='block'; cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i));
    series.forEach((s,si)=>{ s.data.forEach((v,j)=>{ const pt=$(`${id}-pt-${si}-${j}`); if(pt) pt.style.display=j===i?'block':'none'; }); });
    const tip=$(id+'-tip');
    tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${labels[i]}</div>`+series.map(s=>`<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:${s.color}"></span>${s.label}: <b>${tipFmt(s.data[i])}</b></div>`).join('');
    tip.style.display='block';
    const tx=Math.min(Math.max(x(i)/W*r.width+10,4),r.width-150);
    tip.style.left=tx+'px'; tip.style.top='8px';
  };
  layer.onmouseleave=()=>{ $(id+'-cross').style.display='none'; $(id+'-tip').style.display='none';
    series.forEach((s,si)=>s.data.forEach((v,j)=>{ const pt=$(`${id}-pt-${si}-${j}`); if(pt) pt.style.display='none'; })); };
}
function drawBarChart(id, labels, series, tickFmt){
  const box=$(id); if(!box) return;
  const W=680,H=250,padL=30,padR=10,padT=12,padB=26;
  const totals=labels.map((_,i)=>series.reduce((s,sr)=>s+sr.data[i],0));
  const maxV=niceMax(Math.max(...totals)*1.15);
  const slot=(W-padL-padR)/labels.length, bw=slot*0.55;
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const ticks=[0,.25,.5,.75,1].map(t=>t*maxV);
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">`;
  ticks.forEach(t=>{ svg+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="#e1e0d9" stroke-width="1"/>`; });
  labels.forEach((_,i)=>{
    let acc=0; const cx=padL+slot*i+(slot-bw)/2;
    series.forEach((s,si)=>{
      const v=s.data[i]; if(!v) { return; }
      const y1=y(acc+v), y0=y(acc);
      const isTop=acc+v===totals[i];
      const h=Math.max(y0-y1-(acc>0?2:0),1.5);
      svg+=`<rect x="${cx}" y="${y1}" width="${bw}" height="${h}" fill="${s.color}" rx="${isTop?3:0}" data-i="${i}"/>`;
      acc+=v;
    });
  });
  svg+=`<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="#c3c2b7" stroke-width="1"/>`;
  svg+='</svg>';
  const tickHtml=ticks.map(t=>`<span style="position:absolute;left:0;top:${(y(t)/H*100)}%;transform:translateY(-50%);font-size:.64rem;color:#898781">${tickFmt(t)}</span>`).join('');
  const labHtml=labels.map((l,i)=>`<span style="position:absolute;left:${((padL+slot*i+slot/2)/W*100)}%;bottom:0;transform:translateX(-50%);font-size:.64rem;color:#898781;white-space:nowrap">${l}</span>`).join('');
  box.innerHTML=`<div style="position:absolute;inset:0">${svg}${tickHtml}${labHtml}
    <div id="${id}-tip" style="position:absolute;display:none;background:#101828;color:#fff;font-size:.72rem;padding:7px 10px;border-radius:8px;pointer-events:none;z-index:5;white-space:nowrap;box-shadow:var(--shadow-lg)"></div></div>`;
  const layer=box.firstElementChild;
  layer.onmousemove=e=>{
    const r=layer.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(labels.length-1,Math.floor((mx-padL)/slot)));
    const tip=$(id+'-tip');
    tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${labels[i]}</div>`+series.map(s=>`<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:${s.color}"></span>${s.label}: <b>${s.data[i]}</b></div>`).join('')+(series.length>1?`<div style="margin-top:3px;border-top:1px solid rgba(255,255,255,.2);padding-top:3px">Total: <b>${totals[i]}</b></div>`:'');
    tip.style.display='block';
    const tx=Math.min(Math.max((padL+slot*i+slot/2)/W*r.width+10,4),r.width-130);
    tip.style.left=tx+'px'; tip.style.top='8px';
  };
  layer.onmouseleave=()=>{ $(id+'-tip').style.display='none'; };
}

function applyTaskFilters(list){

function retEff(r){
  // Efficiency score 0-10: cost vs delivery vs GMV vs quality/reliability
  const delivery = r.promised? (r.delivered/r.promised) : 1;
  const roi = r.amount? Math.min(1,(r.gmv/6)/ (r.amount*10)) : 0; // rough return signal
  const qual=(r.quality+r.reliability)/20;
  return Math.round((delivery*4 + roi*3 + qual*3)*10)/10;
}

function donutSvg(segs,size){
  const tot=segs.reduce((s,x)=>s+x[1],0), r=size/2-10, cx=size/2, cy=size/2, sw=20;
  let a0=-Math.PI/2, out='';
  segs.forEach(s=>{
    const frac=s[1]/tot, a1=a0+frac*2*Math.PI;
    const gap=0.03;
    const x0=cx+r*Math.cos(a0+gap), y0=cy+r*Math.sin(a0+gap);
    const x1=cx+r*Math.cos(a1-gap), y1=cy+r*Math.sin(a1-gap);
    const large=(a1-a0)>Math.PI?1:0;
    out+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${s[2]}" stroke-width="${sw}" stroke-linecap="butt"><title>${s[0]}: ${m2(s[1])}</title></path>`;
    a0=a1;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:15px;font-weight:800;fill:var(--ink)">${money(tot)}</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" style="font-size:9px;fill:#898781;font-weight:600">TOTAL COSTS</text></svg>`;
}

function drawSignedBarChart(id, labels, data){
  const box=$(id); if(!box) return;
  const W=680,H=190,padL=44,padR=10,padT=10,padB=24;
  const maxV=niceMax(Math.max(...data.map(Math.abs))*1.1);
  const slot=(W-padL-padR)/labels.length, bw=slot*0.55;
  const y=v=>padT+(H-padT-padB)*(1-(v+maxV)/(2*maxV));
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">`;
  [-maxV,-maxV/2,0,maxV/2,maxV].forEach(t=>{ svg+=`<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="${t===0?'#c3c2b7':'#e1e0d9'}" stroke-width="1"/>`; });
  data.forEach((v,i)=>{
    const cx=padL+slot*i+(slot-bw)/2;
    const y0=y(0), y1=y(v);
    svg+=`<rect x="${cx}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(Math.abs(y0-y1),1.5)}" rx="3" fill="${v>=0?'#0ca30c':'#d03b3b'}"><title>${labels[i]}: ${m2(v)}</title></rect>`;
  });
  svg+='</svg>';
  const ticks=[-maxV,0,maxV].map(t=>`<span style="position:absolute;left:0;top:${(y(t)/H*100)}%;transform:translateY(-50%);font-size:.62rem;color:#898781">£${(t/1000).toFixed(1)}k</span>`).join('');
  const labs=labels.map((l,i)=>`<span style="position:absolute;left:${((padL+slot*i+slot/2)/W*100)}%;bottom:0;transform:translateX(-50%);font-size:.62rem;color:#898781">${l}</span>`).join('');
  box.innerHTML=`<div style="position:absolute;inset:0">${svg}${ticks}${labs}</div>`;
}

function renderCalcResults(){
  const el=$('calcResults'); if(!el) return;
  const L=CALC_LEV;
  const cogs=L.cost*(1+L.vat/100);
  const ovh=L.ovhOn?calcAutoOvh():0;
  const ad=L.price/L.roas;
  const pc=L.pctCreator/100, pa=L.pctAds/100;
  const buckets=[
    { n:'Creator + Ad', w:pc*pa,        comm:L.commAd,   hasAd:true },
    { n:'Creator only', w:pc*(1-pa),    comm:L.commNoAd, hasAd:false },
    { n:'Ad only',      w:(1-pc)*pa,    comm:0,          hasAd:true },
    { n:'Organic',      w:(1-pc)*(1-pa),comm:0,          hasAd:false }
  ].map(b=>{
    const net=L.price*(1-L.plat/100-b.comm/100-(b.hasAd?L.smart/100:0))-L.ship-cogs-(b.hasAd?ad:0)-ovh;

function brfSetTool(t){ state.brf.tool=t; state.brf.sel=null; state.brf.openThread=null; renderBriefEditor(); }
function brfZoom(dir){ const s=state.brf; s.zoom=Math.min(3,Math.max(.15, s.zoom + dir*.15)); renderBriefEditor(); }
function brfZoomFit(){ Object.assign(state.brf,{zoom:.62,panX:30,panY:20}); renderBriefEditor(); }
function brfScreenToWorld(e){
  const vp=$('brfViewport').getBoundingClientRect();
  const s=state.brf;
  return { x:(e.clientX-vp.left-s.panX)/s.zoom, y:(e.clientY-vp.top-s.panY)/s.zoom };
}
function brfBind(b){
  const vp=$('brfViewport'), world=$('brfWorld');
  let mode=null, start=null, moved=false;
  vp.addEventListener('mousedown', e=>{
    const s=state.brf;
    const elNode=e.target.closest('[data-el]');
    const fTitle=e.target.closest('[data-fdrag]');
    const rsNode=e.target.closest('[data-rs]');
    if(e.target.closest('.brf-thread')||e.target.closest('[data-pin]')||e.target.closest('.del-h')) return;
    if(rsNode){
      const [fid,edge]=rsNode.dataset.rs.split(':');
      const fr=b.elements.find(x=>x.id===fid);
      mode='resize'; moved=false; start={mx:e.clientX,my:e.clientY,fr,edge,w:fr.w,h:fr.h};
      const fn=world.querySelector(`[data-frame="${fid}"]`); if(fn) fn.classList.add('resizing');
      e.preventDefault(); return;
    }
    if(s.tool!=='select'){ const w=brfScreenToWorld(e); brfAddAt(b,w.x,w.y); return; }
    if(e.target.isContentEditable) return;
    if(fTitle){
      const fr=b.elements.find(x=>x.id===fTitle.dataset.fdrag);
      const kids=b.elements.filter(el=>el.type!=='frame' && el.x>=fr.x && el.x<=fr.x+fr.w && el.y>=fr.y && el.y<=fr.y+fr.h)
        .concat(b.comments.filter(c=>c.x>=fr.x&&c.x<=fr.x+fr.w&&c.y>=fr.y&&c.y<=fr.y+fr.h));
      mode='drag'; moved=false; start={mx:e.clientX,my:e.clientY,pos:kids.map(k=>({k,x:k.x,y:k.y})).concat([{k:fr,x:fr.x,y:fr.y}])};
    } else if(elNode){
      const el=b.elements.find(x=>x.id===elNode.dataset.el);
      if(el&&el.type!=='frame'){
        mode='drag'; moved=false; start={mx:e.clientX,my:e.clientY,pos:[{k:el,x:el.x,y:el.y}]};
        if(s.sel!==el.id){ s.sel=el.id;
          world.querySelectorAll('.brf-el.selected').forEach(n=>n.classList.remove('selected'));
          elNode.classList.add('selected');
        }
      }
    } else {
      if(s.sel||s.openThread){ s.sel=null; s.openThread=null; renderBriefEditor(); return; }
      mode='pan'; start={mx:e.clientX,my:e.clientY,px:s.panX,py:s.panY};
      vp.classList.add('panning');
    }
    e.preventDefault();
  });
  if(window._brfH){ document.removeEventListener('mousemove',window._brfH.move); document.removeEventListener('mouseup',window._brfH.up); }
  window._brfH={move:onMove,up:onUp};
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  function onMove(e){
    const s=state.brf;
    if(mode==='pan'&&start){ s.panX=start.px+(e.clientX-start.mx); s.panY=start.py+(e.clientY-start.my);
      const w=$('brfWorld'); if(w) w.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.zoom})`; }
    else if(mode==='drag'&&start){
      const dx=(e.clientX-start.mx)/s.zoom, dy=(e.clientY-start.my)/s.zoom;
      if(Math.abs(dx)+Math.abs(dy)<2 && !moved) return;   // ignore jitter — keeps double-click intact
      moved=true;
      start.pos.forEach(p=>{ p.k.x=Math.round(p.x+dx); p.k.y=Math.round(p.y+dy); });
      const w=$('brfWorld'); if(w) w.innerHTML=brfWorldHTML(b);
    }
    else if(mode==='resize'&&start){
      const dx=(e.clientX-start.mx)/s.zoom, dy=(e.clientY-start.my)/s.zoom;
      if(Math.abs(dx)+Math.abs(dy)>=2) moved=true;
      const fr=start.fr;
      fr.h=Math.max(160, Math.round(start.h+dy));
      if(start.edge==='se') fr.w=Math.max(240, Math.round(start.w+dx));
      const fn=$('brfWorld')?.querySelector(`[data-frame="${fr.id}"]`);
      if(fn){ fn.style.width=fr.w+'px'; fn.style.height=fr.h+'px';
        fn.classList.add('resizing');
        let tag=fn.querySelector('.fr-size-tag');
        if(!tag){ tag=document.createElement('div'); tag.className='fr-size-tag'; fn.appendChild(tag); }
        tag.textContent=fr.w+' × '+fr.h;
      }
    }
  }
  function onUp(){
    if(mode){
      const wasStructural = (mode==='resize'||mode==='drag') && moved;
      mode=null; start=null; moved=false;
      const v=$('brfViewport'); if(v) v.classList.remove('panning');
      if(wasStructural) renderBriefEditor();   // refresh world bounds only after a real move — a plain click must NOT re-render (it kills double-click)
    }
  }
  /* Figma-style trackpad: two-finger scroll = pan · pinch (ctrl/cmd+wheel) = fast zoom toward cursor */
  vp.addEventListener('wheel', e=>{
    e.preventDefault();
    const s=state.brf;
    if(e.ctrlKey || e.metaKey){
      const vpr=vp.getBoundingClientRect();
      const mx=e.clientX-vpr.left, my=e.clientY-vpr.top;
      const old=s.zoom;
      let d = e.deltaMode===1 ? e.deltaY*16 : e.deltaY;     // normalise line-mode wheels
      d = Math.max(-40, Math.min(40, d));                    // trackpad pinch stays fast; mouse notches don't jump
      s.zoom=Math.min(3,Math.max(.15, s.zoom*Math.exp(-d*0.012)));
      s.panX=mx-(mx-s.panX)*(s.zoom/old); s.panY=my-(my-s.panY)*(s.zoom/old);
      const zv=document.querySelector('.brf-zoom .zv'); if(zv) zv.textContent=Math.round(s.zoom*100)+'%';
    } else {
      const k = e.deltaMode===1 ? 16 : 1;
      s.panX-=e.deltaX*k; s.panY-=e.deltaY*k;
    }
    const w=$('brfWorld'); if(w) w.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.zoom})`;
  }, {passive:false});
}

/* =====================================================================
   SETTINGS · LOGINS VAULT (password-locked)
   ===================================================================== */
/* Logins vault — client-side AES-GCM encryption. The database only ever sees ciphertext. */
let LOGINS=[];   // decrypted in memory only while vault is open
const TIKI_VAULT={ blob:null, cryptoKey:null };
state.vaultOpen=false;
const revealedPw=new Set();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function vaultDeriveKey(pw, salt){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km,
    {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function vaultEncrypt(){
  if(!TIKI_VAULT.cryptoKey) return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=await crypto.subtle.encrypt({name:'AES-GCM', iv}, TIKI_VAULT.cryptoKey, new TextEncoder().encode(JSON.stringify(LOGINS)));
  TIKI_VAULT.blob={ salt:TIKI_VAULT.blob.salt, iv:b64(iv), data:b64(data) };
  tikiDirty();
}
async function vaultTryUnlock(){
  const inp=$('vaultPw'); const pw=inp.value;
  if(!pw || pw.length<6){ toast('Vault password needs 6+ characters'); return; }
  try{
    if(!TIKI_VAULT.blob){
      // first run — this password BECOMES the vault password
      const salt=crypto.getRandomValues(new Uint8Array(16));
      TIKI_VAULT.blob={ salt:b64(salt) };
      TIKI_VAULT.cryptoKey=await vaultDeriveKey(pw, salt);
      LOGINS=[];
      await vaultEncrypt();
      state.vaultOpen=true; revealedPw.clear(); renderSettings();
      toast('Vault created — this password now protects your logins');
    } else {
      const key=await vaultDeriveKey(pw, unb64(TIKI_VAULT.blob.salt));
      const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(TIKI_VAULT.blob.iv)}, key, unb64(TIKI_VAULT.blob.data));
      LOGINS=JSON.parse(new TextDecoder().decode(plain));
      TIKI_VAULT.cryptoKey=key;
      state.vaultOpen=true; revealedPw.clear(); renderSettings(); toast('Vault unlocked');
    }
  } catch(e){
    inp.value=''; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); toast('Wrong vault password');
  }
}
function vaultLock(){ state.vaultOpen=false; revealedPw.clear(); LOGINS=[]; TIKI_VAULT.cryptoKey=null; renderSettings(); toast('Vault locked'); }
function togglePw(i){ revealedPw.has(i)?revealedPw.delete(i):revealedPw.add(i); renderSettings(); }
function copyPw(i){ toast(`Password for ${LOGINS[i].app} copied`); }
function deleteLogin(i){ const l=LOGINS.splice(i,1)[0]; vaultEncrypt(); renderSettings(); toast(`${l.app} login removed`); }

  } catch(e){ err.textContent=e.message||'Sign-in failed'; }
  $('gateBtn').textContent='Sign in';
}
async function tikiRefreshToken(){
  if(!tikiSession?.rt) return false;
  try{
    const r=await fetch(`${TIKI_CFG.url}/auth/v1/token?grant_type=refresh_token`,{ method:'POST',
      headers:{ apikey:TIKI_CFG.key, 'Content-Type':'application/json' },
      body:JSON.stringify({ refresh_token:tikiSession.rt }) });
    const j=await r.json();
    if(!r.ok||!j.access_token) return false;
    tikiStoreSession({ at:j.access_token, rt:j.refresh_token, exp:Date.now()+(j.expires_in-60)*1000, email:tikiSession.email });
    return true;
  } catch(e){ return false; }
}
async function tikiFetch(path, opts={}, retried=false){
  if(tikiSession && Date.now()>tikiSession.exp) await tikiRefreshToken();
  const r=await fetch(TIKI_CFG.url+path, {...opts, headers:{ apikey:TIKI_CFG.key, Authorization:'Bearer '+tikiSession.at, 'Content-Type':'application/json', ...(opts.headers||{}) }});
  if(r.status===401 && !retried && await tikiRefreshToken()) return tikiFetch(path, opts, true);
  return r;
}
function tikiSignOut(){ tikiStoreSession(null); location.reload(); }
/* ---- state collect / apply ---- */
function collectTikiState(){
  return { v:2, tasks:state.tasks, creators:CREATORS, retainers:RETAINERS, courses:COURSES, briefs:BRIEFS,
    flows:OUTREACH_FLOWS, personal:PERSONAL_OUTREACH, samples:SAMPLE_REQS, chats:CHATS,
    notifs:state.notifs, learnings:AI.learnings, calcLev:CALC_LEV, profitVendors:PROFIT_VENDORS,
    vaultBlob:TIKI_VAULT.blob };
}
function replaceArr(target, src){ if(Array.isArray(src)){ target.length=0; src.forEach(x=>target.push(x)); } }
function applyTikiState(d){
  if(!d) return;
  if(Array.isArray(d.tasks)) state.tasks=d.tasks;
  replaceArr(CREATORS,d.creators); replaceArr(RETAINERS,d.retainers); replaceArr(COURSES,d.courses);
  replaceArr(BRIEFS,d.briefs); replaceArr(OUTREACH_FLOWS,d.flows); replaceArr(SAMPLE_REQS,d.samples);
  replaceArr(CHATS,d.chats); replaceArr(PROFIT_VENDORS,d.profitVendors);
  if(Array.isArray(d.personal)) PERSONAL_OUTREACH=d.personal;
  if(Array.isArray(d.notifs)) state.notifs=d.notifs;
  if(Array.isArray(d.learnings)) replaceArr(AI.learnings,d.learnings);
  if(d.calcLev) Object.assign(CALC_LEV,d.calcLev);
  if(d.vaultBlob) TIKI_VAULT.blob=d.vaultBlob;
}
function tikiDirty(){ /* autosave loop picks changes up */ }
async function tikiPull(){
  const r=await tikiFetch('/rest/v1/tiki_state?key=eq.app&select=value');
  if(!r.ok) throw new Error('load failed');
  const rows=await r.json();
  if(rows.length){ applyTikiState(rows[0].value); tikiLastPushed=JSON.stringify(collectTikiState()); }
  else tikiLastPushed='';   // first run — seed data will be pushed
}
async function tikiPush(){
  if(tikiSaving) return;
  const s=JSON.stringify(collectTikiState());
  if(s===tikiLastPushed) return;
  tikiSaving=true; syncStatus('saving','Saving…');
  try{
    const r=await tikiFetch('/rest/v1/tiki_state?on_conflict=key',{ method:'POST',
      headers:{ Prefer:'resolution=merge-duplicates' },
      body:JSON.stringify({ key:'app', value:JSON.parse(s), updated_at:new Date().toISOString() }) });
    if(r.ok){ tikiLastPushed=s; syncStatus('', 'Synced · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})); }
    else syncStatus('error','Save failed — retrying');
  } catch(e){ syncStatus('error','Offline — will retry'); }
  tikiSaving=false;
}
async function tikiEnter(){
  $('gate').classList.add('hidden');
  syncStatus('saving','Loading…');
  try{ await tikiPull(); syncStatus('', 'Synced · '+tikiSession.email.split('@')[0]); }
  catch(e){ syncStatus('error','Load failed — using local'); }
  rerenderAll(); renderNotifs();
  navTo('overview');
  setInterval(tikiPush, 4000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') tikiPush(); });
}

/* ============ INIT ============ */
async function init(){
  renderBrandUI(); renderNewMenu(); renderSidebar(); renderNotifs();
  navTo('overview');
  tikiLoadSession();
  if(tikiSession && (Date.now()<tikiSession.exp || await tikiRefreshToken())){ await tikiEnter(); }
  else { $('gate').classList.remove('hidden'); setTimeout(()=>$('gateEmail').focus(),100); }
}
document.addEventListener('DOMContentLoaded', init);

</script>
